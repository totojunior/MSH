<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 협업을 통한 개인 서사 구술</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;
    background:linear-gradient(160deg,#0f766e,#134e4a); color:#fff;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .box{max-width:560px; width:100%;}
  .kicker{font-size:13px; font-weight:700; letter-spacing:.05em; color:#99f6e4; margin-bottom:8px;}
  h1{font-size:26px; line-height:1.3; letter-spacing:-.01em; margin-bottom:10px;}
  .lead{font-size:14.5px; color:#e6fffb; line-height:1.65; margin-bottom:26px;}
  .cards{display:flex; flex-direction:column; gap:14px;}
  a.card{
    display:flex; align-items:center; gap:16px; text-decoration:none; color:#134e4a;
    background:#fff; border-radius:16px; padding:18px 20px;
    box-shadow:0 6px 18px rgba(0,0,0,.18); transition:transform .1s ease;
  }
  a.card:hover{transform:translateY(-2px);}
  .emoji{font-size:30px; flex:0 0 auto;}
  .card h2{font-size:17px; margin-bottom:3px;}
  .card p{font-size:13px; color:#5b6b7c; line-height:1.5;}
  .arrow{margin-left:auto; font-size:18px; color:#0f766e; flex:0 0 auto;}
  footer{margin-top:26px; font-size:12.5px; color:#99f6e4; text-align:center; line-height:1.6;}
</style>
</head>
<body>
<div class="box">
  <p class="kicker">마석고 2학년 영어 II · 2학기 말하기 수행평가</p>
  <h1>AI 협업을 통한 개인 서사 구술</h1>
  <p class="lead">나에게 영향을 준 <b>사람 · 책 · 경험</b>에 대해 영어로 이야기하는 말하기 수행평가입니다. 아래 두 자료를 보며 준비하세요.</p>
  <div class="cards">
    <a class="card" href="bank.html">
      <span class="emoji">📚</span>
      <span><h2>문제은행</h2><p>시험에 나오는 모든 질문 (공통 3 + 선택 15) · 한 문장 구조 · 🔊 질문 음성 듣기</p></span>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="script.html">
      <span class="emoji">🎤</span>
      <span><h2>발표 구조 템플릿 · 예시 대본</h2><p>발표 순서(오프닝 → 답변 3개 → 마무리)와 김토토 학생의 예시 대본</p></span>
      <span class="arrow">→</span>
    </a>
  </div>
  <footer>답변은 모두 <b>영어 한 문장 · 10단어 이상</b> — 질문마다 미리 준비해 두세요!</footer>
</div>
</body>
</html>
