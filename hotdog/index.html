    ctx.strokeStyle = "rgba(0,0,0,0.55)";
    ctx.fillStyle = step >= 3 ? "#36D399" : "#FFD23F";
    ctx.shadowColor = step >= 3 ? "rgba(54,211,153,0.8)" : "rgba(255,210,63,0.8)";
    ctx.shadowBlur = 30;
    ctx.strokeText(label, 0, 0);
    ctx.fillText(label, 0, 0);
    ctx.restore();
  }

  // ──────────────────────────────────────────────────────────────────────────
  // 캔버스 도형 헬퍼
  // ──────────────────────────────────────────────────────────────────────────
  function _circle(ctx, x, y, rad) {
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fill();
  }
  function _roundRect(ctx, x, y, w, h, r) {
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function _zigzag(ctx, x, y, w, amp, segs) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    for (var i = 1; i <= segs; i++) {
      var px = x + (w * i) / segs;
      var py = y + (i % 2 === 0 ? -amp : amp);
      ctx.lineTo(px, py);
    }
    ctx.stroke();
  }

  // ──────────────────────────────────────────────────────────────────────────
  // 노출
  // ──────────────────────────────────────────────────────────────────────────
  HD.Race = {
    init: init,
    makeBracket: makeBracket,
    runRace: runRace,
    stop: stop,
    cancel: stop, // 별칭: UI 가 cancel() 로 부르고 싶을 때(= stop). 멱등.
    reset: stop, // 별칭: 초기화 시 reset() 로 부르고 싶을 때(= stop). 멱등.
    // 내부 검산 노출(테스트/리뷰 보조) — 사용 안 해도 무방.
    _assertBracket: _assertBracket,
  };
})();

</script>
  <script>
/* ui.js — 🌭 핫도그 레이스 오케스트레이터
 * 담당: UI. 이 파일만 수정. window.HD 만 사용. DOMContentLoaded 에서 구동.
 * 컨트롤 패널 + 명단(결석 토글) + 진행 흐름(라운드/그룹 레이스) + 우승자 공개.
 * HD.Race(race.js) / HD.Sound(sound.js) 와 SPEC §3 계약대로 연동.
 */
(function () {
  'use strict';

  var HD = (window.HD = window.HD || {});

  // ---------------------------------------------------------------------------
  // 작은 유틸
  // ---------------------------------------------------------------------------
  function $(sel, root) { return (root || document).querySelector(sel); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); }
  function delay(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }

  // Fisher–Yates 셔플 (원본 불변, 새 배열 반환) — 공정한 그룹 배정용
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // groups(인원수 배열)대로 list 를 순서대로 슬라이스해서 그룹 배열로 분할
  function partition(list, groups) {
    var out = [];
    var idx = 0;
    for (var g = 0; g < groups.length; g++) {
      var size = groups[g];
      out.push(list.slice(idx, idx + size));
      idx += size;
    }
    // 분할 검증(빠짐없이/중복없이) — 합이 안 맞으면 남은 인원을 마지막 그룹에 흡수(견고성)
    if (idx < list.length) {
      if (out.length === 0) out.push([]);
      out[out.length - 1] = out[out.length - 1].concat(list.slice(idx));
    }
    return out.filter(function (grp) { return grp.length > 0; });
  }

  // 안전 사운드 호출 (sound.js 가 아직/혹은 일부만 있어도 죽지 않게)
  var Snd = {
    call: function (method, arg) {
      try {
        var S = HD.Sound;
        if (S && typeof S[method] === 'function') return S[method](arg);
      } catch (e) { /* 사운드 실패는 추첨을 막지 않는다 */ }
      return undefined;
    },
    unlock: function () { return this.call('unlock'); },
    startBgm: function () { return this.call('startBgm'); },
    stopBgm: function () { return this.call('stopBgm'); },
    // 전체 정지(음악+효과음). sound.js 에 stopAll 없으면 stopBgm 으로 폴백(안전).
    stopAll: function () {
      var S = HD.Sound;
      if (S && typeof S.stopAll === 'function') return this.call('stopAll');
      return this.call('stopBgm');
    },
    setIntensity: function (v) { return this.call('setIntensity', v); },
    sfx: function (name) { return this.call('sfx', name); },
    toggleMute: function () { return this.call('toggleMute'); },
    isMuted: function () { var r = this.call('isMuted'); return !!r; }
  };

  // ---------------------------------------------------------------------------
  // 상태
  // ---------------------------------------------------------------------------
  var state = {
    absent: Object.create(null),  // name -> true 면 결석
    running: false,
    runId: 0,                     // 실행 세대(초기화/중단 시 +1 → 진행중 흐름 무효화)
    raceInited: false,
    waitResolve: null,            // Space '다음' 대기용 resolver
    winnerCount: 10
  };

  var dom = {}; // 자주 쓰는 DOM 캐시

  // ---------------------------------------------------------------------------
  // 패널(컨트롤) 생성
  // ---------------------------------------------------------------------------
  function buildPanel() {
    var panel = $('#panel');
    clear(panel);

    panel.appendChild(el('h1', 'panel-title', '🌭 핫도그 레이스'));
    panel.appendChild(el('p', 'panel-sub', '2학년 1반 · 남는 핫도그 10개 추첨'));

    // 명단 헤더 + 카운트
    var rosterHead = el('div', 'roster-head');
    rosterHead.appendChild(el('span', 'roster-label', '명단 (클릭=결석 토글)'));
    dom.rosterCount = el('span', 'roster-count', '');
    rosterHead.appendChild(dom.rosterCount);
    panel.appendChild(rosterHead);

    // 명단 칩
    dom.roster = el('div', 'roster');
    dom.roster.setAttribute('role', 'group');
    dom.roster.setAttribute('aria-label', '학생 명단 — 클릭하면 결석/출전 토글');
    var names = Array.isArray(HD.names) ? HD.names : [];
    names.forEach(function (name) {
      var chip = el('button', 'roster-item', name);
      chip.type = 'button';
      chip.setAttribute('data-name', name);
      // 접근성: 토글 버튼 의미 부여. aria-pressed=true → '결석' 눌림 상태.
      chip.setAttribute('aria-pressed', 'false');
      chip.setAttribute('aria-label', name + ' — 출전');
      chip.addEventListener('click', function () {
        if (state.running) return; // 진행 중엔 명단 잠금
        toggleAbsent(name, chip);
        Snd.sfx('click');
      });
      dom.roster.appendChild(chip);
    });
    panel.appendChild(dom.roster);

    // 당첨 인원 입력
    // Designer CSS(#panel label{display:flex;justify-content:space-between})에 맞춰
    // label 이 '텍스트 + input' 을 직접 감싸 한 줄에 정렬되도록 구성.
    // F1(nit): label/input 은 엘리먼트 선택자(#panel label / input[type=number])로 스타일됨
    //   → 미사용 클래스(.winner-field/.field-input) 제거. (.field-label 은 Designer 가 스타일하므로 유지)
    var wcLabel = el('label');
    wcLabel.setAttribute('for', 'winnerCount');
    wcLabel.appendChild(el('span', 'field-label', '당첨 인원'));
    dom.winnerCount = el('input');
    dom.winnerCount.id = 'winnerCount';
    dom.winnerCount.type = 'number';
    dom.winnerCount.min = '1';
    dom.winnerCount.max = String(Math.max(1, (HD.names || []).length));
    dom.winnerCount.value = '10';
    // 타이핑 중(input)엔 표시/max 만 갱신(자유 입력). 확정(change/blur) 시 값 클램프.
    dom.winnerCount.addEventListener('input', updateRosterCount);
    dom.winnerCount.addEventListener('change', function () { updateRosterCount(); clampWinnerCount(); });
    dom.winnerCount.addEventListener('blur', function () { updateRosterCount(); clampWinnerCount(); });
    wcLabel.appendChild(dom.winnerCount);
    panel.appendChild(wcLabel);

    // 버튼들
    var btns = el('div', 'btn-row');
    dom.btnStart = mkBtn('시작', 'btn btn-primary', onStartClick);
    dom.btnReset = mkBtn('초기화', 'btn', onResetClick);
    dom.btnFull = mkBtn('전체화면', 'btn', toggleFullscreen);
    dom.btnMute = mkBtn('🔊 소리켜짐', 'btn btn-ghost', onMuteClick);
    btns.appendChild(dom.btnStart);
    btns.appendChild(dom.btnReset);
    btns.appendChild(dom.btnFull);
    btns.appendChild(dom.btnMute);
    panel.appendChild(btns);

    // 사용법 힌트 (Designer 가 <kbd> 를 키캡 스타일로 꾸며줌)
    var hint = el('p', 'hint');
    hint.appendChild(document.createTextNode('⌨ '));
    [['Space', '시작/다음'], ['F', '전체화면'], ['M', '음소거'], ['R', '초기화'], ['Esc', '중단']]
      .forEach(function (pair, i) {
        if (i > 0) hint.appendChild(document.createTextNode(' · '));
        hint.appendChild(el('kbd', null, pair[0]));
        hint.appendChild(document.createTextNode(' ' + pair[1]));
      });
    panel.appendChild(hint);

    updateRosterCount();
    syncMuteLabel();
  }

  function mkBtn(label, cls, handler) {
    var b = el('button', cls, label);
    b.type = 'button';
    b.addEventListener('click', handler);
    return b;
  }

  function toggleAbsent(name, chip) {
    var nowAbsent;
    if (state.absent[name]) { delete state.absent[name]; chip.classList.remove('absent'); nowAbsent = false; }
    else { state.absent[name] = true; chip.classList.add('absent'); nowAbsent = true; }
    // 접근성 상태 동기화
    chip.setAttribute('aria-pressed', nowAbsent ? 'true' : 'false');
    chip.setAttribute('aria-label', name + (nowAbsent ? ' — 결석' : ' — 출전'));
    updateRosterCount();
    clampWinnerCount(); // 결석 토글로 출전수가 줄면 즉시 클램프(타이핑이 아니므로 안전)
  }

  function presentNames() {
    var names = Array.isArray(HD.names) ? HD.names : [];
    return names.filter(function (n) { return !state.absent[n]; });
  }

  // 표시(출전/결석 배지)와 input max 만 갱신 — 매 키입력에도 안전(값은 안 건드림).
  function updateRosterCount() {
    var total = (HD.names || []).length;
    var absentCount = Object.keys(state.absent).length;
    var present = total - absentCount;
    if (dom.rosterCount) {
      dom.rosterCount.textContent = '출전 ' + present + ' · 결석 ' + absentCount;
    }
    if (dom.winnerCount) {
      dom.winnerCount.max = String(Math.max(1, present));
    }
  }

  // 입력값을 출전 인원으로 클램프 — 'change'/blur 와 결석 토글에서만 호출(타이핑 중 X).
  // (R2-F2: 매 키입력 클램프하면 '25' 입력 중 '2'에서 잘림. 입력 중엔 자유 허용.)
  function clampWinnerCount() {
    if (!dom.winnerCount) return;
    var present = (HD.names || []).length - Object.keys(state.absent).length;
    if (present < 1) return; // 출전 0명이면 시작 시 막힘 — 값은 그대로 둠
    var cur = parseInt(dom.winnerCount.value, 10);
    if (isFinite(cur) && cur > present) dom.winnerCount.value = String(present);
  }

  function readWinnerCount(present) {
    var v = parseInt(dom.winnerCount && dom.winnerCount.value, 10);
    if (!isFinite(v) || v < 1) v = 1;
    if (v > present) v = present; // 출전 인원보다 많을 수 없음
    return v;
  }

  function syncMuteLabel() {
    var muted = Snd.isMuted();
    if (dom.btnMute) {
      // R2 SND-R2-2: 음소거 시 아이콘은 Designer 의 .is-muted::before(🔇)가 담당 →
      // 텍스트엔 🔇 넣지 않음(중복 방지). 비음소거는 ::before 없으니 🔊 인라인 유지.
      dom.btnMute.textContent = muted ? '음소거됨' : '🔊 소리켜짐';
      dom.btnMute.classList.toggle('is-muted', muted);
    }
  }

  // ---------------------------------------------------------------------------
  // 버튼/키보드 핸들러
  // ---------------------------------------------------------------------------
  function onStartClick() {
    Snd.sfx('click');
    if (state.running) {
      // 진행 중 '시작'은 '다음'으로 동작(라운드 사이 대기 해제)
      advanceStep();
      return;
    }
    runLottery();
  }

  function onResetClick() {
    Snd.sfx('click');
    resetAll();
  }

  function onMuteClick() {
    Snd.toggleMute();
    syncMuteLabel();
  }

  function advanceStep() {
    if (state.waitResolve) {
      var r = state.waitResolve;
      state.waitResolve = null;
      r();
    }
  }

  function onKey(e) {
    var tag = (e.target && e.target.tagName) || '';
    var typing = tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable);

    switch (e.key) {
      case ' ':
      case 'Spacebar': // 구형
        if (typing) return;
        e.preventDefault();
        if (state.running) advanceStep();
        else runLottery();
        break;
      case 'f': case 'F':
        if (typing) return;
        e.preventDefault();
        toggleFullscreen();
        break;
      case 'm': case 'M':
        if (typing) return;
        e.preventDefault();
        onMuteClick();
        break;
      case 'r': case 'R':
        if (typing) return;
        e.preventDefault();
        resetAll();
        break;
      case 'Escape':
        // R2-F3: 입력창 타이핑 중 Esc 는 전체 초기화 대신 입력만 빠져나감(실수 방지).
        if (typing) {
          if (e.target && typeof e.target.blur === 'function') e.target.blur();
          return;
        }
        e.preventDefault();
        resetAll();
        break;
      default:
        break;
    }
  }

  // ---------------------------------------------------------------------------
  // 전체화면
  // ---------------------------------------------------------------------------
  function toggleFullscreen() {
    Snd.sfx('click');
    try {
      var docEl = document.documentElement;
      if (!document.fullscreenElement) {
        if (docEl.requestFullscreen) docEl.requestFullscreen();
        else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    } catch (e) { /* file:// 등에서 막혀도 무시 */ }
  }

  // ---------------------------------------------------------------------------
  // 오버레이 / 연출 헬퍼
  // ---------------------------------------------------------------------------
  function showOverlay() { var o = $('#overlay'); if (o) o.classList.remove('hidden'); }
  function hideOverlay() { var o = $('#overlay'); if (o) { o.classList.add('hidden'); clear(o); } }

  function setOverlay(node) {
    var o = $('#overlay');
    if (!o) return;
    clear(o);
    o.classList.remove('hidden');
    if (node) o.appendChild(node);
  }

  // 라운드 배너 표시
  function showRoundBanner(round, roundIndex, total, survivorCount) {
    var wrap = el('div', 'round-banner pop');
    // .gradient → Designer 의 애니메이션 그라데이션 텍스트
    wrap.appendChild(el('div', 'round-banner-title gradient', round.title || ('라운드 ' + (roundIndex + 1))));
    var subText;
    if (round.isFinal) {
      subText = '결승 · ' + survivorCount + '명 중 ' +
        (round.advanceTotal != null ? round.advanceTotal : state.winnerCount) + '명 우승!';
    } else {
      var grps = round.groups || [];
      subText = grps.length + '개 그룹 · 각 조 상위 ' + (round.advancePerGroup || 1) + '명 진출';
    }
    wrap.appendChild(el('div', 'round-banner-sub', subText));
    setOverlay(wrap);
    Snd.sfx('drum');
  }

  // 화면 흔들기(접전/피니시 연출)
  function shakeStage(ms) {
    var stage = $('#stage') || $('#app');
    if (!stage) return;
    stage.classList.add('shake');
    setTimeout(function () { stage.classList.remove('shake'); }, ms || 600);
  }

  // ---------------------------------------------------------------------------
  // 대진(bracket) 표시
  // ---------------------------------------------------------------------------
  function ensureBracket() {
    var stage = $('#stage');
    if (!stage) return null;
    var b = $('#hdBracket');
    if (!b) {
      b = el('div', 'bracket');
      b.id = 'hdBracket';
      stage.appendChild(b);
    }
    return b;
  }

  function clearBracket() {
    var b = $('#hdBracket');
    if (b && b.parentNode) b.parentNode.removeChild(b);
  }

  // 라운드 컬럼 추가(생존자 이름 칩) → 컬럼 엘리먼트 반환(완료 시 상태표시 갱신)
  // Designer CSS 계약: .bracket-round(.active/.done) > .br-title + 이름칩들.
  // 이름칩은 결과 전엔 .bracket-chip(중립), 결과 후 .advancer/.eliminated 로 전환.
  function addBracketRound(round, roundIndex, names) {
    var b = ensureBracket();
    if (!b) return null;
    // 이전 active 해제 → 완료(done) 처리
    var prev = b.querySelectorAll('.bracket-round.active');
    for (var i = 0; i < prev.length; i++) {
      prev[i].classList.remove('active');
      prev[i].classList.add('done');
    }

    var col = el('div', 'bracket-round active');
    var titleText = round.isFinal ? '결승' : (round.title || ('R' + (roundIndex + 1)));
    col.appendChild(el('span', 'br-title', titleText));
    var chips = el('div', 'bracket-chips');
    names.forEach(function (nm) {
      var c = el('span', 'bracket-chip', nm);
      c.setAttribute('data-name', nm);
      chips.appendChild(c);
    });
    col.appendChild(chips);
    b.appendChild(col);
    // 가로 스크롤 시 최신 컬럼 보이도록
    b.scrollLeft = b.scrollWidth;
    return col;
  }

  // 컬럼 내 칩들을 진출/탈락으로 마킹 (Designer 의 .advancer/.eliminated 스타일 적용)
  function markBracket(col, advancers) {
    if (!col) return;
    var adv = Object.create(null);
    advancers.forEach(function (n) { adv[n] = true; });
    var chips = col.querySelectorAll('.bracket-chip');
    for (var i = 0; i < chips.length; i++) {
      var nm = chips[i].getAttribute('data-name');
      chips[i].classList.remove('bracket-chip');
      if (adv[nm]) chips[i].classList.add('advancer');
      else chips[i].classList.add('eliminated');
    }
  }

  // 모든 라운드 컬럼의 active 펄스 해제(우승자 공개 시)
  function clearBracketActive() {
    var b = $('#hdBracket');
    if (!b) return;
    var act = b.querySelectorAll('.bracket-round.active');
    for (var i = 0; i < act.length; i++) {
      act[i].classList.remove('active');
      act[i].classList.add('done');
    }
  }

  // 레이스 중 대진표 처리 — 클래스 토글만(인라인 스타일 없음; Designer 소유 CSS).
  //  - .racing-hidden(Designer): opacity:0 + pointer-events:none 로 완전 페이드아웃
  //    (RaceEngine 지적: 레이스 시작 시 좌상단 상위 레인 이름표 가림 해소). 0.4s 트랜지션.
  //  - .racing 도 함께 토글(부분 dim 의미 보존 + finding#6 상태 표식).
  //  - 라운드 전환/결과 표시 때 둘 다 제거 → 페이드인(가장 정보가 유용한 시점).
  function setBracketRacing(on) {
    var b = $('#hdBracket');
    if (!b) return;
    if (on) { b.classList.add('racing'); b.classList.add('racing-hidden'); }
    else { b.classList.remove('racing-hidden'); b.classList.remove('racing'); }
  }

  // 우승자 공개 중 풀스크린 모드 토글 — #app 에 .revealing(Designer 소유 CSS).
  // Designer: #app.revealing 에서 #panel 숨김 + #overlay/.winner-reveal 전체 불투명 덮기
  //   → 카드 세로 공간 최대화(잘림 방지) + 레이스 잔상 가림. 공개 끝/초기화 시 해제.
  function setRevealing(on) {
    var app = $('#app');
    if (!app) return;
    app.classList.toggle('revealing', !!on);
  }

  // ---------------------------------------------------------------------------
  // 한 그룹 레이스 실행 — HD.Race.runRace 를 Promise/콜백 양쪽 대응으로 await
  // ---------------------------------------------------------------------------
  function runGroup(runners, advanceCount, title, myRun, sizzleOnStart) {
    return new Promise(function (resolve) {
      var settled = false;
      var orderedFromHook = null;
      var lastWhoosh = 0; // onLeadChange 스로틀(접전 시 과도한 사운드 방지)

      function settle(ordered) {
        if (settled) return;
        settled = true;
        // 결과 정규화: 전체 등수 배열이 와야 함. 비거나 부족하면 입력 순서로 보정.
        var result = Array.isArray(ordered) && ordered.length ? ordered.slice() : runners.slice();
        // runners 중 누락 보충(안정성): 결과에 없는 주자는 뒤에 붙임
        var seen = Object.create(null);
        result.forEach(function (n) { seen[n] = true; });
        runners.forEach(function (n) { if (!seen[n]) result.push(n); });
        resolve(result);
      }

      var hooks = {
        onCountdown: function (n) { if (myRun !== state.runId) return; Snd.sfx('count'); },
        onStart: function () {
          if (myRun !== state.runId) return;
          Snd.sfx('go');
          // 라운드 첫 그룹: 출발 호른 위에 'sizzle'(핫도그가 그릴에 지글) 레이어 — 온테마 연출.
          if (sizzleOnStart) Snd.sfx('sizzle');
        },
        onLeadChange: function () {
          if (myRun !== state.runId) return;
          var t = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
          if (t - lastWhoosh < 250) return; // Sound 확정: 최대 4회/초(1회/250ms), 초과분 드롭 → mush 방지
          lastWhoosh = t;
          Snd.sfx('whoosh');
        },
        // 접전 슬로모(포토피니시) — RaceEngine 가 호출. 드럼롤+긴장도 최대로 클라이맥스 연출.
        onPhotoFinish: function () {
          if (myRun !== state.runId) return;
          Snd.setIntensity(1.0);
          Snd.sfx('drum');
          Snd.sfx('sizzle'); // 핫도그 굽는 소리(여운)
        },
        onFinish: function (orderedNames) {
          orderedFromHook = orderedNames;
          // 콜백-only 엔진이면 여기서 완료. Promise 엔진이면 아래 then 이 settle.
          if (!retPromise) settle(orderedNames);
        }
      };

      var retPromise = null;
      try {
        var ret = HD.Race && typeof HD.Race.runRace === 'function'
          ? HD.Race.runRace({ runners: runners.slice(), advanceCount: advanceCount, title: title, hooks: hooks })
          : null;
        if (ret && typeof ret.then === 'function') {
          retPromise = ret;
          ret.then(function (ordered) {
            settle(ordered || orderedFromHook);
          }, function () {
            // 취소/오류 → 훅 결과 또는 입력순으로 마무리
            settle(orderedFromHook);
          });
        } else if (!HD.Race || typeof HD.Race.runRace !== 'function') {
          // 엔진 없음(개발 중) → 셔플 순서로 즉시 진행(흐름 검증용)
          delay(300).then(function () { settle(shuffle(runners)); });
        }
        // 그 외(동기 콜백 엔진): onFinish 에서 settle 됨
      } catch (e) {
        settle(orderedFromHook);
      }
    });
  }

  // ---------------------------------------------------------------------------
  // 라운드 사이 일시정지(Space/다음 으로 진행)
  // ---------------------------------------------------------------------------
  function waitForNext(myRun, promptText) {
    return new Promise(function (resolve) {
      if (myRun !== state.runId) { resolve(); return; }
      // 안내 + resolver 등록
      var hintNode = $('#nextHint');
      if (!hintNode) {
        hintNode = el('div', 'next-hint');
        hintNode.id = 'nextHint';
        var stage = $('#stage');
        if (stage) stage.appendChild(hintNode);
      }
      hintNode.textContent = promptText || '▶ Space 로 다음';
      hintNode.classList.remove('hidden');

      state.waitResolve = function () {
        if (hintNode) hintNode.classList.add('hidden');
        resolve();
      };
    });
  }

  function removeNextHint() {
    var hintNode = $('#nextHint');
    if (hintNode && hintNode.parentNode) hintNode.parentNode.removeChild(hintNode);
  }

  // ---------------------------------------------------------------------------
  // 메인 흐름
  // ---------------------------------------------------------------------------
  function runLottery() {
    if (state.running) return;

    var present = presentNames();
    if (present.length < 1) {
      flashMessage('출전자가 없습니다. 명단을 확인하세요!');
      return;
    }

    var winners = readWinnerCount(present.length);
    state.winnerCount = winners;
    state.running = true;
    state.runId++;
    var myRun = state.runId;

    setBusyUI(true);

    // 직전 우승 공개에서 바로 재시작하는 경우: 풀스크린 공개 모드 해제 + 잔여 공개 정리
    // (#panel 다시 보이게, 새 라운드 배너가 깨끗하게 뜨도록).
    setRevealing(false);
    hideOverlay();
    clearConfetti();

    // 사운드 시작(첫 제스처)
    Snd.unlock();
    Snd.startBgm();

    // 레이스 엔진 준비
    initRaceEngine();

    // 대진 계산
    var plan = makeBracketSafe(present.length, winners);

    // 진행
    clearBracket();
    runRounds(plan, present, myRun).then(function (finalWinners) {
      if (myRun !== state.runId) return; // 중간에 초기화됨
      revealWinners(finalWinners, myRun);
    }).catch(function () {
      if (myRun !== state.runId) return;
      // 흐름 오류 시 정리
      finishRun();
    });
  }

  function runRounds(plan, present, myRun) {
    var rounds = (plan && plan.rounds) || [];
    var survivors = present.slice();
    var seq = Promise.resolve();

    // 라운드를 순차 체이닝(각 라운드는 그룹들을 순차 실행)
    rounds.forEach(function (round, ri) {
      seq = seq.then(function () {
        if (myRun !== state.runId) return Promise.reject(new Error('cancelled'));

        // 긴장도: 라운드 진행될수록 상승, 결승은 1.0
        var roundIntensity = round.isFinal ? 1.0 : Math.min(0.9, (ri + 1) / Math.max(1, rounds.length));
        Snd.setIntensity(roundIntensity);

        // 배너
        showRoundBanner(round, ri, rounds.length, survivors.length);

        // 셔플 후 그룹 분할
        var shuffled = shuffle(survivors);
        var groups = partition(shuffled, round.groups || [survivors.length]);

        // 대진 컬럼(이 라운드 전체 생존자 표시)
        var col = addBracketRound(round, ri, shuffled);

        return delay(900).then(function () {
          if (myRun !== state.runId) return Promise.reject(new Error('cancelled'));
          // 배너 치우고 레이스 시작. 레이스 동안 대진표를 흐리게/축소(.racing)해서
          // 캔버스 주자 이름표와 겹치지 않게 함(finding #6).
          hideOverlay();
          setBracketRacing(true);
          var survivorsBefore = survivors.length;
          return runGroupsSequential(round, groups, myRun, roundIntensity).then(function (advancers) {
            if (myRun !== state.runId) return Promise.reject(new Error('cancelled'));
            // 레이스 끝 → 대진표 원래 크기로 복귀 후 결과 마킹
            setBracketRacing(false);
            markBracket(col, advancers);
            // 진출 사운드는 그룹별 dingAdvancers 롤콜로 재생됨.
            // 탈락음은 라운드당 1회(Sound 권고): 진출 롤콜 뒤 한 번.
            dingRoundEliminated(round, survivorsBefore, advancers.length, myRun);
            survivors = advancers;
            // 마지막 라운드가 아니면 다음으로 대기(선택적 일시정지)
            if (ri < rounds.length - 1) {
              return waitForNext(myRun, '▶ Space 로 다음 라운드');
            }
            return undefined;
          });
        });
      });
    });

    return seq.then(function () {
      return survivors.slice(0, state.winnerCount);
    });
  }

  // 진출자 롤콜 사운드: onFinish 는 1회만 호출되므로(주자별 통과 훅 없음),
  // 그룹 결과(ordered)에서 상위 advanceCount 명을 'advance' 딩으로 스태거(~110ms) 재생
  // → "딩…딩…딩" 진출 롤콜. (탈락음은 라운드당 1회만 — dingRoundEliminated 참고)
  function dingAdvancers(ordered, advanceCount, myRun) {
    var n = Math.min(advanceCount, ordered.length);
    if (n <= 0) return;
    var spacing = Math.min(110, Math.floor(600 / n)); // 롤콜 전체 ≤ ~600ms
    for (var i = 0; i < n; i++) {
      (function (i) {
        var t = setTimeout(function () {
          if (myRun !== state.runId) return;
          Snd.sfx('advance');
        }, i * spacing);
        roundTimers.push(t);
      })(i);
    }
  }

  // 탈락음: Sound 권고대로 라운드당 1회만(주자별 X) — 진출 롤콜 뒤 한 번 'eliminate'.
  // 컷이 있었고(진출<생존) 결승이 아닐 때만. '슬픈 트럼본 퍼레이드' 방지.
  function dingRoundEliminated(round, survivorsBefore, advancersCount, myRun) {
    if (round.isFinal) return;                 // 결승: fanfare/win 이 주인공
    if (advancersCount >= survivorsBefore) return; // 아무도 안 떨어지면 생략
    // 진출 롤콜(최대 ~600ms)이 끝난 뒤 한 번 떨어지는 톤.
    var t = setTimeout(function () {
      if (myRun !== state.runId) return;
      Snd.sfx('eliminate');
    }, 680);
    roundTimers.push(t);
  }

  // 한 라운드 안의 그룹들을 순차 실행, 각 그룹 상위 advance 명 수집
  function runGroupsSequential(round, groups, myRun, roundIntensity) {
    var advancers = [];
    var seq = Promise.resolve();

    groups.forEach(function (grp, gi) {
      seq = seq.then(function () {
        if (myRun !== state.runId) return Promise.reject(new Error('cancelled'));
        var advanceCount;
        if (round.isFinal) {
          // 결승: 그룹은 보통 1개. advanceTotal 명을 이 그룹에서 진출(=우승)
          advanceCount = round.advanceTotal != null ? round.advanceTotal : state.winnerCount;
        } else {
          advanceCount = round.advancePerGroup != null ? round.advancePerGroup : 1;
        }
        advanceCount = Math.min(advanceCount, grp.length);

        var title = round.isFinal ? '결승'
          : ((round.title || '조별') + ' ' + (gi + 1) + '조');

        // 라운드의 첫 그룹 출발에만 'sizzle'(핫도그 굽는 소리) — 매 그룹 반복 방지.
        var firstInRound = (gi === 0);

        return runGroup(grp, advanceCount, title, myRun, firstInRound).then(function (ordered) {
          if (myRun !== state.runId) return Promise.reject(new Error('cancelled'));
          // R2 SND-R2-1: 비결승 그룹에서 onPhotoFinish 가 intensity 1.0 으로 올렸을 수 있음
          // → 그룹 종료 시 라운드 기본 강도로 복귀(결승만 1.0 유지).
          if (!round.isFinal && roundIntensity != null) Snd.setIntensity(roundIntensity);
          // 상위 advanceCount 명 진출(안정적: ordered 순서 유지)
          var top = ordered.slice(0, advanceCount);
          advancers = advancers.concat(top);
          // 진출자 롤콜 딩(스태거). 탈락음은 라운드 단위로 1회(아래 runRounds).
          // N1: 결승은 롤콜 생략 — 곧바로 우승 공개 fanfare/win 에 무대를 양보(eliminate 도 결승서 생략 중, 일관).
          if (!round.isFinal) dingAdvancers(ordered, advanceCount, myRun);
          // 짧은 텀
          return delay(250);
        });
      });
    });

    return seq.then(function () { return advancers; });
  }

  // ---------------------------------------------------------------------------
  // 우승자 공개
  // ---------------------------------------------------------------------------
  function revealWinners(winners, myRun) {
    if (myRun !== state.runId) return;
    removeNextHint();
    hideOverlay();        // 마지막 레이스 잔여 오버레이 정리
    setBracketRacing(false); // 혹시 남아있을 .racing 해제
    clearBracketActive(); // 대진 active 펄스 정리(있다면)
    Snd.setIntensity(1.0);

    var wrap = el('div', 'winner-reveal');
    // 당첨 인원 수 + 열 수를 CSS 에 전달 → Designer 가 항상 한 화면에 맞춤(잘림 방지) + 깔끔한 5열 격자.
    //   --cols = min(5, n) → grid repeat(var(--cols),1fr), ceil(n/5) 행(예: 15 → 5×3).
    var nWin = winners.length;
    wrap.style.setProperty('--nwin', String(nWin));
    wrap.style.setProperty('--cols', String(Math.min(5, Math.max(1, nWin))));
    wrap.setAttribute('data-count', String(nWin));
    // 공개 동안 풀스크린 공간 확보(옆 #panel 숨김 + 오버레이 전체 불투명) — Designer 의 .revealing 스타일.
    setRevealing(true);
    // Designer CSS: .winner-reveal .reveal-title (또는 > h2) 가 골든 타이틀
    wrap.appendChild(el('h2', 'reveal-title', '🎉 우승자 ' + winners.length + '명 🎉'));
    var grid = el('div', 'winner-grid');
    var STAGGER = 0.12; // 카드 간 등장 간격(초)
    winners.forEach(function (name, i) {
      // 1등 카드 강조(.top1): 우승자 2명 이상일 때만(레이스 테마의 1등 하이라이트).
      var cls = 'winner-card' + (i === 0 && winners.length > 1 ? ' top1' : '');
      var card = el('div', cls);
      // Designer 의 cardPop 애니메이션을 카드별로 지연 → 순차 등장(재트리거 없이)
      card.style.animationDelay = (i * STAGGER) + 's';
      var rank = el('span', 'wrank', String(i + 1));
      var nm = el('span', 'wname', name);
      card.appendChild(rank);
      card.appendChild(nm);
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    // Designer 가 .winner-reveal .winner-reveal-sub 스타일 제공 → 인라인 불필요.
    wrap.appendChild(el('p', 'winner-reveal-sub', '🌭 핫도그 당첨을 축하합니다!'));
    setOverlay(wrap);

    Snd.sfx('fanfare');
    shakeStage(700);

    // 카드가 차례로 등장하는 동안 'win' 반짝 사운드를 몇 번 뿌림(과도 연타 방지).
    // 첫 'win' 은 fanfare 와 겹치지 않게 ~600ms 뒤부터(Sound 권고 0.5~0.8s 갭).
    var winSfxCount = Math.min(winners.length, 5);
    for (var k = 0; k < winSfxCount; k++) {
      (function (k) {
        var t = setTimeout(function () {
          if (myRun !== state.runId) return;
          Snd.sfx('win');
        }, 600 + k * Math.max(160, winners.length * STAGGER * 1000 / winSfxCount));
        revealTimers.push(t);
      })(k);
    }

    launchConfetti(myRun);
    finishRun();
  }

  // ---------------------------------------------------------------------------
  // 색종이/반짝이 효과(#fxLayer) — Designer 소유 CSS(.confetti/.sparkle) 사용.
  // 계약: 자식 div 를 N개 만들고 인라인은 left + animation-delay (옵션 --x/--rot)만.
  //   색/모양은 Designer 가 :nth-child 로 자동 다양화 → background/width/height 는
  //   인라인으로 건드리지 않는다(덮어쓰면 다양성 깨짐).
  //   애니메이션: confettiFall 2.8s / sparkleTwinkle 1.2s (둘 다 forwards) → 끝나면 제거.
  //   prefers-reduced-motion 이면 Designer 가 #fxLayer 를 숨기므로 생성 자체를 생략.
  // ---------------------------------------------------------------------------
  var confettiTimers = [];
  var revealTimers = [];
  var roundTimers = [];   // 라운드 진출 롤콜 딩 타이머(초기화 시 취소)
  var CONFETTI_MS = 2800; // Designer .confetti animation duration
  var SPARKLE_MS = 1200;  // Designer .sparkle animation duration
  function prefersReducedMotion() {
    try { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (e) { return false; }
  }
  function launchConfetti(myRun) {
    var fx = $('#fxLayer');
    if (!fx) return;
    if (prefersReducedMotion()) return; // 모션 최소화: #fxLayer 숨김 → 생성 생략

    // 색종이
    var count = 130;
    for (var i = 0; i < count; i++) {
      var piece = el('div', 'confetti');
      piece.style.left = (Math.random() * 100) + '%';
      var delayS = Math.random() * 0.9;           // 분사 스태거
      piece.style.animationDelay = delayS + 's';
      // 변형(옵션 변수): 가로 드리프트 ±, 회전수 2~5
      piece.style.setProperty('--x', Math.round((Math.random() * 2 - 1) * 160) + 'px');
      piece.style.setProperty('--rot', String(2 + Math.floor(Math.random() * 4)));
      fx.appendChild(piece);
      scheduleRemove(piece, CONFETTI_MS + delayS * 1000 + 250);
    }

    // 반짝이(골드, 제자리)
    var sparkles = 26;
    for (var s = 0; s < sparkles; s++) {
      var sp = el('div', 'sparkle');
      sp.style.left = (Math.random() * 100) + '%';
      sp.style.top = (Math.random() * 100) + '%';
      var sDelay = Math.random() * 1.2;
      sp.style.animationDelay = sDelay + 's';
      fx.appendChild(sp);
      scheduleRemove(sp, SPARKLE_MS + sDelay * 1000 + 250);
    }
  }

  // 애니메이션 종료 후 DOM 에서 제거(타이머는 초기화 시 일괄 취소).
  function scheduleRemove(node, ms) {
    var t = setTimeout(function () {
      if (node && node.parentNode) node.parentNode.removeChild(node);
    }, ms);
    confettiTimers.push(t);
  }

  function clearConfetti() {
    var fx = $('#fxLayer');
    if (fx) clear(fx);
    confettiTimers.forEach(function (t) { clearTimeout(t); });
    confettiTimers = [];
    revealTimers.forEach(function (t) { clearTimeout(t); });
    revealTimers = [];
    roundTimers.forEach(function (t) { clearTimeout(t); });
    roundTimers = [];
  }

  // ---------------------------------------------------------------------------
  // 대진 계산 — HD.Race.makeBracket 사용, 없거나 깨지면 폴백
  // ---------------------------------------------------------------------------
  function makeBracketSafe(n, winners) {
    var plan = null;
    try {
      if (HD.Race && typeof HD.Race.makeBracket === 'function') {
        plan = HD.Race.makeBracket(n, winners);
      }
    } catch (e) { plan = null; }
    if (plan && plan.rounds && plan.rounds.length) return plan;
    return fallbackBracket(n, winners);
  }

  // 엔진이 없을 때만 쓰는 최소 폴백(SPEC 불변식 만족)
  function fallbackBracket(n, winners) {
    if (n <= winners) {
      return { rounds: [{ key: 'all', title: '전원 당첨 🎉', groups: [n], isFinal: true, advanceTotal: n }] };
    }
    // 조별리그(그룹당 ~6명, 각 조 상위 절반) → 결승
    var groupSize = 6;
    var numGroups = Math.max(2, Math.ceil(n / groupSize));
    var groups = [];
    var base = Math.floor(n / numGroups);
    var rem = n % numGroups;
    for (var i = 0; i < numGroups; i++) groups.push(base + (i < rem ? 1 : 0));
    // 각 조 진출 인원: 결승이 winners 근처가 되도록
    var advancePerGroup = Math.max(1, Math.ceil((winners * 1.6) / numGroups));
    // 조별 통과자 합 추정
    var afterGroup = groups.reduce(function (s, g) { return s + Math.min(advancePerGroup, g); }, 0);
    if (afterGroup <= winners) {
      // 한 라운드로 충분하지 않으면 바로 결승만
      return { rounds: [{ key: 'group', title: '조별리그', groups: groups, advancePerGroup: advancePerGroup },
                        { key: 'final', title: '결승', groups: [afterGroup], isFinal: true, advanceTotal: winners }] };
    }
    return {
      rounds: [
        { key: 'group', title: '조별리그', groups: groups, advancePerGroup: advancePerGroup },
        { key: 'final', title: '결승', groups: [afterGroup], isFinal: true, advanceTotal: winners }
      ]
    };
  }

  // ---------------------------------------------------------------------------
  // 레이스 엔진 init / stop
  // (race.js 계약: 취소 메서드는 HD.Race.stop(). init() 은 내부에서 stop()+리스너
  //  정리를 수행하므로 재호출 안전. runRace 는 Promise<orderedNames> 반환 + onFinish 호출.)
  // ---------------------------------------------------------------------------
  function initRaceEngine() {
    try {
      var canvas = $('#raceCanvas');
      if (HD.Race && typeof HD.Race.init === 'function' && canvas) {
        // 재실행 안전: 진행 중 레이스가 있으면 먼저 정지(있을 때만).
        cancelRaceEngine();
        HD.Race.init({ canvas: canvas });
        state.raceInited = true;
      }
    } catch (e) { /* 엔진 없거나 init 실패해도 흐름은 폴백으로 진행 */ }
  }

  function cancelRaceEngine() {
    try {
      // race.js 의 취소 API 는 stop(). (cancel/reset 도 혹시 있으면 대응)
      if (HD.Race && typeof HD.Race.stop === 'function') HD.Race.stop();
      else if (HD.Race && typeof HD.Race.cancel === 'function') HD.Race.cancel();
      else if (HD.Race && typeof HD.Race.reset === 'function') HD.Race.reset();
    } catch (e) { /* ignore */ }
  }

  // ---------------------------------------------------------------------------
  // 종료 / 초기화
  // ---------------------------------------------------------------------------
  function finishRun() {
    // 흐름 자체는 끝났지만 결과 화면은 유지. 컨트롤 다시 활성화.
    state.running = false;
    state.waitResolve = null;
    setBusyUI(false);
  }

  function resetAll() {
    // 레이스 진행 중이었는지(중단/abort) vs 끝난 공개를 정리하는지 — 사운드 처리 분기용.
    // (finishRun 이 공개 시작 때 running=false 로 두므로, 여기서 true 면 '레이스 중 중단'.)
    var wasRacing = state.running;

    // 진행 세대 무효화 → 모든 대기/콜백 무시
    state.runId++;
    state.running = false;

    // 대기 resolver 깨우기(있다면)
    if (state.waitResolve) { var r = state.waitResolve; state.waitResolve = null; try { r(); } catch (e) {} }

    cancelRaceEngine();
    // 옵션 C(리더 결정): 레이스 중 중단 → stopAll(꼬리 효과음까지 즉시 무음);
    //   끝난 우승 공개 정리 → stopBgm(win/fanfare 여운은 울리게).
    if (wasRacing) Snd.stopAll();
    else Snd.stopBgm();
    Snd.setIntensity(0.25); // 다음 레이스가 차분하게 시작되도록(Sound 권고: BGM 기본 강도)

    if (flashTimer) { clearTimeout(flashTimer); flashTimer = null; }
    setRevealing(false); // 풀스크린 공개 모드 해제 → #panel 복귀
    hideOverlay();
    clearConfetti();
    clearBracket();
    removeNextHint();

    // 캔버스 클리어
    try {
      var canvas = $('#raceCanvas');
      if (canvas && canvas.getContext) {
        var ctx = canvas.getContext('2d');
        if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    } catch (e) {}

    setBusyUI(false);
  }

  // 진행 중 UI 잠금/해제
  function setBusyUI(busy) {
    if (dom.btnStart) dom.btnStart.textContent = busy ? '다음 ▶' : '시작';
    if (dom.winnerCount) dom.winnerCount.disabled = busy;
    if (dom.roster) {
      dom.roster.classList.toggle('locked', busy);
      dom.roster.setAttribute('aria-disabled', busy ? 'true' : 'false'); // R2-F3 접근성
    }
  }

  // 짧은 토스트성 메시지(오버레이)
  var flashTimer = null;
  function flashMessage(text) {
    var node = el('div', 'round-banner pop');
    node.appendChild(el('div', 'round-banner-title', text));
    setOverlay(node);
    // R2-F1: 핸들 추적 + capturedRunId 가드 → 직후 시작된 새 라운드/오버레이를 지우지 않음.
    if (flashTimer) clearTimeout(flashTimer);
    var capturedRunId = state.runId;
    flashTimer = setTimeout(function () {
      flashTimer = null;
      if (capturedRunId !== state.runId) return; // 그새 새 실행 시작 → 그 오버레이 보존
      hideOverlay();
    }, 1600);
  }

  // ---------------------------------------------------------------------------
  // 부팅
  // ---------------------------------------------------------------------------
  function boot() {
    buildPanel();
    hideOverlay();
    // R2-F3 접근성: 오버레이(라운드 배너/우승자 공개)를 스크린리더가 읽도록 live region.
    var ov = $('#overlay');
    if (ov) {
      ov.setAttribute('aria-live', 'polite');
      ov.setAttribute('aria-atomic', 'true');
    }
    document.addEventListener('keydown', onKey, false);
    // 음소거 상태 변화가 외부에서 일어날 수도 있으니 초기 동기화
    syncMuteLabel();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, false);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
