<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🌭 핫도그 레이스 — 2학년 1반</title>
  <style>
/* ============================================================
   🌭 핫도그 레이스 — style.css  (Designer)
   2학년 1반 교실 프로젝터용 추첨 앱.  100% 오프라인 / 바닐라 CSS.
   외부 리소스(웹폰트·이미지·원격 임포트) 전혀 없음.  file:// 더블클릭 동작.
   ============================================================ */

/* ---------- 0. 디자인 토큰 ---------- */
:root {
  /* 핫도그 팔레트 */
  --ketchup:    #ff2e2e;   /* 케첩 빨강 */
  --ketchup-dk: #b81414;
  --mustard:    #ffd11a;   /* 머스타드 옐로 */
  --mustard-dk: #e0a800;
  --sausage:    #c8783c;   /* 소시지 브라운 */
  --sausage-dk: #8a4f23;
  --bun:        #f4c98a;   /* 빵 */
  --relish:     #6fcf3f;   /* 렐리시 그린 (진출 표시) */

  /* 네온 포인트 */
  --neon-pink:  #ff3ea5;
  --neon-cyan:  #2ee6ff;
  --neon-violet:#9d5cff;
  --gold:       #ffd700;
  --gold-soft:  #ffe98a;

  /* 무대 배경 (어두운 아케이드) */
  --bg-0: #140a24;
  --bg-1: #1f0f3a;
  --bg-2: #2a1450;
  --ink:  #fff8ec;          /* 기본 글자 (따뜻한 흰색) */
  --ink-dim: #cfc3e6;
  --panel-bg: rgba(20, 10, 36, 0.78);
  --panel-edge: rgba(255, 255, 255, 0.12);

  /* 그림자/글로우 */
  --glow-pink:  0 0 14px rgba(255, 62, 165, 0.75);
  --glow-cyan:  0 0 14px rgba(46, 230, 255, 0.7);
  --glow-gold:  0 0 22px rgba(255, 215, 0, 0.85);
  --shadow-card: 0 14px 40px rgba(0, 0, 0, 0.55);

  /* 폰트 스택 (SPEC 고정, 웹폰트 import 금지) */
  --font-kr: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;

  --radius: 16px;
  --radius-sm: 10px;
}

/* ---------- 1. 리셋 & 기본 ---------- */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;                 /* 무대는 화면을 가득 채우고 스크롤 없음 */
  font-family: var(--font-kr);
  color: var(--ink);
  background: var(--bg-0);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;                /* 추첨 화면에서 텍스트 드래그 방지 */
}

button { font-family: inherit; }

/* 움직이는 축제 그라데이션 배경 (이미지 없이 CSS만) */
body::before {
  content: "";
  position: fixed;
  inset: -20%;
  z-index: -2;
  background:
    radial-gradient(circle at 20% 20%, rgba(255, 62, 165, 0.30), transparent 45%),
    radial-gradient(circle at 82% 28%, rgba(46, 230, 255, 0.26), transparent 48%),
    radial-gradient(circle at 50% 88%, rgba(255, 209, 26, 0.22), transparent 50%),
    linear-gradient(135deg, var(--bg-1), var(--bg-0) 55%, var(--bg-2));
  background-size: 200% 200%, 200% 200%, 200% 200%, 200% 200%;
  animation: bgFloat 22s ease-in-out infinite;
  filter: saturate(1.1);
}

/* 은은한 도트(반짝이) 패턴 오버레이 — conic/radial 합성, 이미지 아님 */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    radial-gradient(rgba(255, 255, 255, 0.05) 1.5px, transparent 1.6px);
  background-size: 34px 34px;
  opacity: 0.6;
  animation: shimmer 9s linear infinite;
}

/* ---------- 2. 레이아웃: #app / #stage / #panel ---------- */
#app {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-columns: 1fr clamp(300px, 24vw, 420px);
  gap: clamp(10px, 1.4vw, 22px);
  padding: clamp(10px, 1.4vw, 22px);
}

/* 우승자 공개 중: 패널 숨기고 무대를 화면 가득 (UI가 #app 에 .revealing 토글).
   공간 최대 확보 + 레이스 캔버스 잔상 가리기. */
#app.revealing {
  grid-template-columns: 1fr;       /* 패널 칼럼 제거 → 무대 풀폭 */
  gap: 0;
  padding: 0;
}
#app.revealing #panel { display: none; }
/* 공개 오버레이를 불투명 풀블리드로: 캔버스 잔상이 비쳐 보이지 않게 */
#app.revealing #overlay {
  background:
    radial-gradient(circle at 50% 35%, rgba(157, 92, 255, 0.35), transparent 60%),
    linear-gradient(160deg, var(--bg-1), var(--bg-0) 70%);
  padding: clamp(10px, 2.5vmin, 32px);
}
/* 무대 자체도 잔상 안 보이게 캔버스를 살짝 가림(보조 안전장치) */
#app.revealing #raceCanvas { opacity: 0; }

/* 무대: 레이스 캔버스 + 오버레이 + fx 가 겹쳐 쌓이는 영역 */
#stage {
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(0, 0, 0, 0.25)),
    repeating-linear-gradient(             /* 트랙 느낌의 가로 줄무늬 */
      180deg,
      rgba(255, 255, 255, 0.035) 0,
      rgba(255, 255, 255, 0.035) 2px,
      transparent 2px,
      transparent 56px);
  border: 2px solid rgba(255, 255, 255, 0.10);
  box-shadow:
    inset 0 0 70px rgba(0, 0, 0, 0.55),
    0 18px 50px rgba(0, 0, 0, 0.5);
}

/* 무대 테두리 네온 러닝 라이트 */
#stage::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  padding: 2px;
  background: linear-gradient(120deg, var(--neon-pink), var(--neon-cyan), var(--mustard), var(--neon-pink));
  background-size: 300% 300%;
  /* 테두리만 칠하기 (mask 합성) */
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask-composite: exclude;
  opacity: 0.85;
  animation: borderRun 8s linear infinite;
  pointer-events: none;
  z-index: 5;
}

/* 캔버스가 무대를 가득 채움 (RaceEngine 가 DPR/리사이즈 담당) */
#raceCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 1;
}

/* 오버레이: 카운트다운/라운드 배너/우승자 공개 (ui.js 가 내용 채움) */
#overlay {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  pointer-events: none;             /* 기본은 통과 — 내부 인터랙션 요소만 따로 활성화 */
  padding: 4vmin;
}
/* 우승자 카드 등 클릭 가능한 자식은 다시 살림 */
#overlay .btn,
#overlay .winner-reveal { pointer-events: auto; }

/* fx 레이어: DOM 색종이/반짝이 (RaceEngine/UI 가 파티클 주입) */
#fxLayer {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  overflow: hidden;
}

/* ---------- 3. 사이드 패널 #panel (컨트롤) ---------- */
#panel {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: clamp(10px, 1.2vw, 16px);
  padding: clamp(14px, 1.5vw, 22px);
  border-radius: var(--radius);
  background: var(--panel-bg);
  border: 1px solid var(--panel-edge);
  box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(8px);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--neon-violet) transparent;
}
#panel::-webkit-scrollbar { width: 10px; }
#panel::-webkit-scrollbar-thumb {
  background: var(--neon-violet);
  border-radius: 20px;
}

/* 패널 제목 (앱 타이틀) */
#panel h1, #panel .title, #panel .panel-title, .panel-title {
  margin: 0;
  font-size: clamp(1.6rem, 2.6vw, 2.4rem);
  line-height: 1.1;
  font-weight: 900;
  letter-spacing: -0.5px;
  text-align: center;
  background: linear-gradient(90deg, var(--ketchup), var(--mustard) 55%, var(--neon-pink));
  -webkit-background-clip: text;
          background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.35));
  animation: float 6s ease-in-out infinite;
}
#panel h2, #panel .subtitle, #panel .panel-sub, .panel-sub {
  margin: 0;
  font-size: clamp(0.85rem, 1.2vw, 1rem);
  font-weight: 700;
  color: var(--mustard);
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
#panel p, #panel .help, #panel small, #panel .hint, .hint {
  margin: 0;
  font-size: clamp(0.78rem, 1.05vw, 0.95rem);
  line-height: 1.5;
  color: var(--ink-dim);
}
/* 출전/결석 카운트 배지 */
.roster-count {
  display: inline-block;
  padding: 4px 12px;
  font-size: clamp(0.8rem, 1.1vw, 0.98rem);
  font-weight: 800;
  color: var(--bg-0);
  background: linear-gradient(135deg, var(--mustard), var(--relish));
  border-radius: 999px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}
#panel kbd {
  display: inline-block;
  min-width: 1.6em;
  padding: 1px 7px;
  font-family: var(--font-kr);
  font-size: 0.82em;
  font-weight: 800;
  text-align: center;
  color: var(--bg-0);
  background: var(--mustard);
  border-radius: 6px;
  box-shadow: 0 2px 0 var(--mustard-dk);
}

/* 패널 입력 (당첨 인원 등) */
#panel label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-weight: 700;
  font-size: clamp(0.85rem, 1.15vw, 1rem);
  color: var(--ink);
}
#panel input[type="number"],
#panel input[type="text"],
#panel select {
  width: 5.5em;
  padding: 8px 10px;
  font-family: var(--font-kr);
  font-size: 1.05rem;
  font-weight: 800;
  text-align: center;
  color: var(--ink);
  background: rgba(0, 0, 0, 0.35);
  border: 2px solid var(--panel-edge);
  border-radius: var(--radius-sm);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
#panel input:focus,
#panel select:focus {
  border-color: var(--neon-cyan);
  box-shadow: var(--glow-cyan);
}

/* 컨트롤 버튼들이 들어갈 행 (UI 가 div로 감쌀 수 있음) */
#panel .controls,
#panel .btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

/* ---------- 4. 버튼: .btn / .btn-primary / .btn-ghost ---------- */
.btn {
  appearance: none;
  cursor: pointer;
  flex: 1 1 auto;
  min-width: 84px;
  padding: 12px 18px;
  font-size: clamp(0.95rem, 1.3vw, 1.15rem);
  font-weight: 900;
  letter-spacing: 0.3px;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.07);
  border: 2px solid rgba(255, 255, 255, 0.18);
  border-radius: var(--radius-sm);
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18);
  transition: transform 0.08s ease, box-shadow 0.12s ease, background 0.15s, filter 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover    { filter: brightness(1.12); transform: translateY(-1px); }
.btn:active   { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
.btn:focus-visible {
  outline: 3px solid var(--neon-cyan);
  outline-offset: 2px;
}

/* 주 버튼 (시작) — 케첩→머스타드 그라데이션 + 글로우 펄스 */
.btn-primary {
  color: #2a1100;
  background: linear-gradient(135deg, var(--mustard), var(--ketchup) 80%);
  border-color: rgba(255, 255, 255, 0.55);
  box-shadow:
    0 5px 0 var(--ketchup-dk),
    0 0 18px rgba(255, 62, 165, 0.55),
    inset 0 1px 0 rgba(255, 255, 255, 0.5);
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
  animation: pulse 2.2s ease-in-out infinite;
}
.btn-primary:active { box-shadow: 0 1px 0 var(--ketchup-dk), 0 0 18px rgba(255, 62, 165, 0.55); }

/* 고스트 버튼 (보조: 초기화/전체화면/음소거) */
.btn-ghost {
  background: transparent;
  border-color: rgba(255, 255, 255, 0.30);
  box-shadow: inset 0 0 0 0 transparent;
  color: var(--ink-dim);
}
.btn-ghost:hover {
  background: rgba(255, 255, 255, 0.08);
  color: var(--ink);
  border-color: var(--neon-cyan);
  box-shadow: var(--glow-cyan);
}

/* 음소거 활성 상태 (UI: btn btn-ghost 에 .is-muted 토글).
   .btn-ghost(.hover) 보다 확실히 이기도록 .btn-ghost.is-muted 도 명시. */
.btn.is-muted,
.btn-ghost.is-muted,
.btn.is-muted:hover,
.btn-ghost.is-muted:hover {
  background: rgba(255, 46, 46, 0.18);
  border-color: var(--ketchup);
  color: var(--ketchup);
  box-shadow: 0 0 12px rgba(255, 46, 46, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
}
.btn.is-muted:hover,
.btn-ghost.is-muted:hover {
  filter: brightness(1.12);          /* 음소거 상태 유지하며 호버 피드백만 */
}
.btn.is-muted::before { content: "🔇 "; }

/* ---------- 5. 명단: .roster / .roster-item / .absent ---------- */
.roster {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  padding: 10px;
  border-radius: var(--radius-sm);
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid var(--panel-edge);
  max-height: 38vh;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--sausage) transparent;
  align-content: flex-start;
}
.roster-item {
  cursor: pointer;
  padding: 6px 11px;
  font-size: clamp(0.8rem, 1.05vw, 0.98rem);
  font-weight: 800;
  white-space: nowrap;
  color: var(--bg-0);
  background: linear-gradient(135deg, var(--bun), var(--mustard));
  border: 2px solid rgba(255, 255, 255, 0.4);
  border-radius: 999px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  transition: transform 0.1s, filter 0.12s, opacity 0.12s;
}
.roster-item::before { content: "🌭 "; }
.roster-item:hover { transform: translateY(-2px) scale(1.04); filter: brightness(1.08); }
.roster-item:active { transform: scale(0.96); }

/* 결석 (클릭으로 토글) — 회색 + 줄긋기 */
.roster-item.absent {
  color: var(--ink-dim);
  background: rgba(255, 255, 255, 0.06);
  border-color: rgba(255, 255, 255, 0.12);
  text-decoration: line-through;
  text-decoration-thickness: 2px;
  opacity: 0.55;
  box-shadow: none;
  filter: grayscale(0.7);
}
.roster-item.absent::before { content: "💤 "; }

/* 추첨 진행 중 명단 잠금 (UI가 .roster에 .locked 토글 → 결석 변경 방지) */
.roster.locked {
  pointer-events: none;
  opacity: 0.6;
  filter: grayscale(0.4);
  cursor: not-allowed;
}

/* 명단 헤더/라벨 + 입력 라벨 (UI 래퍼; 미스타일 방지) */
.roster-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.roster-label,
.field-label {
  font-weight: 800;
  font-size: clamp(0.85rem, 1.15vw, 1rem);
  color: var(--ink);
  letter-spacing: 0.2px;
}

/* ---------- 6. 오버레이 상태: 카운트다운 ---------- */
.countdown {
  font-size: clamp(8rem, 32vmin, 26rem);
  font-weight: 900;
  line-height: 1;
  color: var(--mustard);
  text-shadow:
    0 0 18px rgba(255, 209, 26, 0.9),
    0 0 50px rgba(255, 62, 165, 0.7),
    0 8px 0 rgba(0, 0, 0, 0.35);
  -webkit-text-stroke: 3px rgba(0, 0, 0, 0.35);
  animation: countPop 1s ease-out both;
}
/* "GO!" 같은 출발 신호 변형 (UI가 .countdown.go 로 줄 수 있음) */
.countdown.go {
  color: var(--relish);
  text-shadow: 0 0 24px rgba(111, 207, 63, 0.95), 0 0 60px rgba(46, 230, 255, 0.7);
}

/* ---------- 7. 라운드 배너: .round-banner ---------- */
.round-banner {
  display: flex;
  flex-direction: column;
  gap: 0.2em;
  padding: 0.5em 1.1em;
  font-size: clamp(2rem, 7vmin, 5rem);
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: 0.5px;
  color: var(--ink);
  text-shadow: 0 3px 0 rgba(0, 0, 0, 0.4), 0 0 28px rgba(255, 62, 165, 0.6);
  background: linear-gradient(135deg, rgba(255, 46, 46, 0.22), rgba(157, 92, 255, 0.22));
  border: 3px solid rgba(255, 255, 255, 0.28);
  border-radius: 22px;
  box-shadow: var(--shadow-card), 0 0 40px rgba(157, 92, 255, 0.4);
  backdrop-filter: blur(4px);
  animation: bannerIn 0.6s cubic-bezier(0.2, 1.4, 0.4, 1) both;
}
.round-banner small,
.round-banner .sub {
  font-size: 0.42em;
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--mustard);
  -webkit-text-fill-color: var(--mustard);
}
/* 라운드 제목(UI: .round-banner-title) — 기본 굵게 */
.round-banner .round-banner-title {
  font-weight: 900;
  line-height: 1.05;
}
/* 그라데이션 텍스트 변형 (.gradient 또는 제목에 직접) */
.round-banner .gradient,
.round-banner .round-banner-title.gradient {
  background: linear-gradient(90deg, var(--mustard), var(--ketchup), var(--neon-pink));
  background-size: 200% auto;
  -webkit-background-clip: text;
          background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmerText 3s linear infinite;
}
/* 그룹/부가 정보 줄 (UI: 서브타이틀) */
.round-banner .round-banner-sub {
  font-size: 0.42em;
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--mustard);
  -webkit-text-fill-color: var(--mustard);
}

/* ---------- 8. 우승자 공개: .winner-reveal / .winner-card / .wname ----------
   전원(기본 10명, 더 많아도)을 한 화면에 잘림/스크롤 없이.
   #overlay(flex 중앙정렬 풀커버) 안에서 높이를 가득 쓰고 내부를 압축. */
.winner-reveal {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(6px, 1.5vh, 20px);
  width: 100%;
  max-width: 96vw;
  height: 100%;
  max-height: 100%;
  box-sizing: border-box;
  padding: clamp(8px, 2vh, 28px);
  overflow: hidden;                 /* 절대 뷰포트 밖으로 넘기지 않음 */
}
.winner-reveal .reveal-title,
.winner-reveal > h2 {
  flex: 0 0 auto;
  margin: 0;
  font-size: clamp(1.6rem, 6vmin, 4.5rem);
  font-weight: 900;
  color: var(--gold);
  text-shadow: var(--glow-gold), 0 4px 0 rgba(0, 0, 0, 0.4);
  animation: pulse 1.8s ease-in-out infinite;
}
/* 우승 부제 ('핫도그 당첨을 축하합니다') — UI: .winner-reveal-sub */
.winner-reveal .winner-reveal-sub {
  flex: 0 0 auto;
  margin: 0;
  font-size: clamp(0.85rem, 2vmin, 1.5rem);
  font-weight: 800;
  letter-spacing: 0.5px;
  color: var(--mustard);
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
}

/* 우승자 카드 그리드.
   기본은 auto-fit(폭 기준). 인원 힌트(data-count 또는 --cols)가 있으면 깔끔한 열 수로.
   세로로 넘치지 않게 min-height:0 + align-content:center, 행은 남는 높이를 균등 분배(1fr). */
.winner-reveal .winner-grid,
.winner-reveal .cards {
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(clamp(96px, 12vw, 170px), 1fr));
  grid-auto-rows: 1fr;
  align-content: center;
  justify-content: center;
  gap: clamp(6px, 1.2vmin, 16px);
  width: 100%;
  min-height: 0;                    /* flex 자식이 내용보다 줄어들 수 있게 (잘림 방지 핵심) */
  overflow: hidden;
}
/* 열 수 결정(우선순위 1): UI가 --cols 를 직접 줄 때. */
.winner-reveal[style*="--cols"] .winner-grid,
.winner-reveal[style*="--cols"] .cards {
  grid-template-columns: repeat(var(--cols), 1fr);
}
/* 열 수 결정(우선순위 2): data-count(인원)만 줄 때 — 내가 깔끔한 열 수로 계산.
   1~5명: 한 줄(N열). 6명↑: 5열 고정 → 10=5×2, 15=5×3, 20=5×4 등. */
.winner-reveal[data-count="1"] .winner-grid { grid-template-columns: repeat(1, 1fr); }
.winner-reveal[data-count="2"] .winner-grid { grid-template-columns: repeat(2, 1fr); }
.winner-reveal[data-count="3"] .winner-grid { grid-template-columns: repeat(3, 1fr); }
.winner-reveal[data-count="4"] .winner-grid { grid-template-columns: repeat(4, 1fr); }
.winner-reveal[data-count="5"] .winner-grid { grid-template-columns: repeat(5, 1fr); }
/* 6명 이상: 5열 고정(행이 늘어도 height 캡 + 1fr 로 줄어들어 안 잘림) */
.winner-reveal[data-count="6"]  .winner-grid,
.winner-reveal[data-count="7"]  .winner-grid,
.winner-reveal[data-count="8"]  .winner-grid,
.winner-reveal[data-count="9"]  .winner-grid,
.winner-reveal[data-count="10"] .winner-grid,
.winner-reveal[data-count="11"] .winner-grid,
.winner-reveal[data-count="12"] .winner-grid,
.winner-reveal[data-count="13"] .winner-grid,
.winner-reveal[data-count="14"] .winner-grid,
.winner-reveal[data-count="15"] .winner-grid,
.winner-reveal[data-count="16"] .winner-grid,
.winner-reveal[data-count="17"] .winner-grid,
.winner-reveal[data-count="18"] .winner-grid,
.winner-reveal[data-count="19"] .winner-grid,
.winner-reveal[data-count="20"] .winner-grid { grid-template-columns: repeat(5, 1fr); }

/* 골드 프레임 우승 카드 (세로 압축 가능하도록 vmin 기반) */
.winner-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(2px, 0.6vmin, 6px);
  min-height: 0;                    /* 그리드 셀 안에서 줄어들 수 있게 */
  padding: clamp(6px, 1.4vmin, 20px) clamp(6px, 1vmin, 16px);
  border-radius: clamp(10px, 1.4vmin, 18px);
  color: #3a2a00;
  background: linear-gradient(160deg, var(--gold-soft), var(--gold) 55%, var(--mustard-dk));
  border: clamp(2px, 0.4vmin, 3px) solid #fff3c4;
  box-shadow:
    var(--glow-gold),
    var(--shadow-card),
    inset 0 2px 0 rgba(255, 255, 255, 0.7);
  overflow: hidden;
  animation: cardPop 0.55s cubic-bezier(0.18, 1.5, 0.4, 1) both;
}
.winner-card::before { content: "🏆"; font-size: clamp(1rem, 2.6vmin, 2.2rem); line-height: 1; }
/* 카드 위를 지나가는 반짝임 */
.winner-card::after {
  content: "";
  position: absolute;
  top: 0; left: -60%;
  width: 50%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.75), transparent);
  transform: skewX(-18deg);
  animation: cardSheen 3.2s ease-in-out infinite;
}
/* 순위 배지 (UI: span.wrank, 선택) */
.winner-card .wrank {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.8em;
  height: 1.8em;
  padding: 0 0.4em;
  font-size: clamp(0.7rem, 1.6vmin, 1.1rem);
  font-weight: 900;
  color: var(--gold);
  background: rgba(58, 42, 0, 0.92);
  border: 2px solid rgba(255, 243, 196, 0.8);
  border-radius: 999px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
}
.winner-card .wname {
  position: relative;
  z-index: 1;
  font-size: clamp(0.95rem, 2.4vmin, 1.9rem);
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -0.3px;
  text-align: center;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
  word-break: keep-all;
  overflow: hidden;
}
/* 1등 강조 (UI가 .winner-card.top1 로 줄 수 있음).
   전체 폭(grid-column:1/-1)으로 한 줄을 통째로 먹으면 세로가 넘쳐 잘리므로 금지.
   대신 같은 셀 안에서 강조만(밝은 골드 글로우 + 살짝 확대 + 펄스). */
.winner-card.top1 {
  background: linear-gradient(160deg, #fff6cf, var(--gold) 50%, var(--mustard));
  border-color: #fffbe6;
  box-shadow:
    0 0 30px rgba(255, 215, 0, 0.95),
    var(--shadow-card),
    inset 0 2px 0 rgba(255, 255, 255, 0.85);
  transform: scale(1.04);
  z-index: 1;
  animation: cardPop 0.55s cubic-bezier(0.18, 1.5, 0.4, 1) both, pulseSoft 1.8s ease-in-out infinite;
}
.winner-card.top1::before { content: "👑"; font-size: clamp(1.2rem, 3vmin, 2.6rem); }
.winner-card.top1 .wname { font-size: clamp(1.05rem, 2.8vmin, 2.2rem); }

/* ---------- 9. 대진 진행: .bracket ----------
   #stage 좌상단 코너에 떠 있는 진행 현황판 (라운드를 가로 컬럼으로).
   #overlay(가운데 콘텐츠)와 겹치지 않게 코너 고정. */
.bracket {
  position: absolute;
  top: clamp(8px, 1.2vw, 16px);
  left: clamp(8px, 1.2vw, 16px);
  z-index: 2;                       /* 캔버스(1) 위, 오버레이(3) 아래 */
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 8px;
  max-width: min(62%, 720px);
  max-height: 38vh;
  padding: 10px;
  border-radius: var(--radius-sm);
  background: rgba(10, 5, 20, 0.62);
  border: 1px solid var(--panel-edge);
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(6px);
  overflow: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--neon-violet) transparent;
  pointer-events: auto;
  transition: opacity 0.4s ease, transform 0.4s ease, max-width 0.4s ease, filter 0.4s ease;
}

/* 레이스 진행 중: 출발선의 위쪽 레인 이름표와 겹치지 않게 흐리게+축소.
   UI가 runRace 동안 .racing 토글(완전 숨김 .hidden 도 가능). */
.bracket.racing {
  opacity: 0.32;
  filter: saturate(0.7);
  transform: scale(0.82);
  transform-origin: top left;
  max-width: min(42%, 460px);
  pointer-events: none;
}
/* 레이스 중 완전 페이드아웃 (UI가 인라인 opacity 대신 이 클래스 사용).
   .bracket transition 의 opacity 를 타고 부드럽게 사라졌다 복귀. */
.bracket.racing.racing-hidden,
.bracket.racing-hidden {
  opacity: 0;
  pointer-events: none;
}

/* 대안 배치: 하단 가로 스트립(상단 좌측 충돌 회피). UI가 .bottom 토글 시. */
.bracket.bottom {
  top: auto;
  bottom: clamp(8px, 1.2vw, 16px);
  left: 50%;
  transform: translateX(-50%);
  max-width: min(94%, 1100px);
  max-height: 26vh;
}
.bracket.bottom.racing {
  transform: translateX(-50%) scale(0.92);
  transform-origin: bottom center;
}

.bracket-round {
  flex: 0 0 auto;
  min-width: 120px;
  max-width: 200px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.04);
  border: 2px solid transparent;
  border-top: 5px solid rgba(255, 255, 255, 0.18);
  font-size: clamp(0.78rem, 1vw, 0.92rem);
  font-weight: 700;
  color: var(--ink-dim);
  transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
}
.bracket-round .br-title {
  display: block;
  font-weight: 900;
  color: var(--ink);
  margin-bottom: 4px;
  font-size: 1.02em;
}
/* 현재 진행 중인 라운드 강조 */
.bracket-round.active {
  background: linear-gradient(135deg, rgba(255, 209, 26, 0.18), rgba(255, 62, 165, 0.14));
  border-top-color: var(--mustard);
  color: var(--ink);
  box-shadow: 0 0 18px rgba(255, 209, 26, 0.35);
  animation: pulseSoft 1.8s ease-in-out infinite;
}
/* 완료된 라운드 */
.bracket-round.done {
  border-top-color: var(--relish);
  opacity: 0.85;
}
.bracket-round.done .br-title::after { content: " ✓"; color: var(--relish); }

/* 칩 묶음 래퍼 (UI: div.bracket-chips, .bracket-round 안) — 깔끔하게 줄바꿈 */
.bracket-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
/* flex gap 사용 시 칩 자체 margin 은 제거(이중 간격 방지) */
.bracket-chips > .bracket-chip,
.bracket-chips > .advancer,
.bracket-chips > .eliminated { margin: 0; }

/* 개별 선수 칩: 결과 전(.bracket-chip) → 결과 후(.advancer/.eliminated) */
.bracket-chip,
.advancer,
.eliminated {
  display: inline-block;
  margin: 2px;
  padding: 3px 9px;
  font-size: 0.9em;
  font-weight: 800;
  border-radius: 999px;
  white-space: nowrap;
}
/* 결과 전 중립 칩 (레이스 진행 중 명단이 의도적으로 보이게) */
.bracket-chip {
  color: var(--ink);
  background: rgba(255, 255, 255, 0.08);
  border: 2px solid rgba(255, 255, 255, 0.18);
  transition: background 0.2s, border-color 0.2s;
}
.advancer {
  color: #0c2a00;
  background: linear-gradient(135deg, #b6ff7a, var(--relish));
  border: 2px solid rgba(255, 255, 255, 0.5);
  box-shadow: 0 0 12px rgba(111, 207, 63, 0.6);
  animation: pop 0.4s cubic-bezier(0.2, 1.5, 0.4, 1) both;
}
.advancer::before { content: "▲ "; }
.eliminated {
  color: var(--ink-dim);
  background: rgba(255, 255, 255, 0.05);
  border: 2px solid rgba(255, 255, 255, 0.12);
  text-decoration: line-through;
  text-decoration-thickness: 2px;
  opacity: 0.55;
}
.eliminated::before { content: "✕ "; opacity: 0.8; }

/* ---------- 9a. '다음' 힌트 (#stage 하단 중앙 떠있는 알약, UI: #nextHint.next-hint) ---------- */
.next-hint {
  position: absolute;
  left: 50%;
  bottom: clamp(12px, 2.5vh, 28px);
  transform: translateX(-50%);
  z-index: 2;                        /* 캔버스 위, 오버레이 아래 */
  padding: 10px 22px;
  font-size: clamp(0.9rem, 1.4vw, 1.15rem);
  font-weight: 800;
  color: var(--bg-0);
  background: linear-gradient(135deg, var(--mustard), var(--bun));
  border: 2px solid rgba(255, 255, 255, 0.55);
  border-radius: 999px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4), var(--glow-pink);
  pointer-events: none;
  white-space: nowrap;
  animation: float 2.4s ease-in-out infinite;
}

/* ---------- 9b. 색종이/반짝이 파티클 (#fxLayer 내부) ----------
   UI가 div.confetti / div.sparkle 를 N개 주입.
   인라인으로 left, animation-delay(원하면 --dur, --x, --rot)만 주면 됨. */
.confetti {
  position: absolute;
  top: -8%;
  width: 12px;
  height: 18px;
  background: var(--mustard);          /* 아래 nth-child 로 다채롭게 */
  border-radius: 2px;
  opacity: 0;
  will-change: transform, opacity;
  /* 기본 낙하 애니메이션. UI는 left/animation-delay만 인라인으로 주면 됨 */
  animation: confettiFall 2.8s linear forwards;
}
/* 다채로운 색 (핫도그 + 네온) */
.confetti:nth-child(6n+1) { background: var(--ketchup); }
.confetti:nth-child(6n+2) { background: var(--mustard); }
.confetti:nth-child(6n+3) { background: var(--neon-pink); }
.confetti:nth-child(6n+4) { background: var(--neon-cyan); }
.confetti:nth-child(6n+5) { background: var(--relish); }
.confetti:nth-child(6n)   { background: var(--gold); }
/* 모양 변형 (둥근/길쭉) */
.confetti:nth-child(3n)   { width: 14px; height: 14px; border-radius: 50%; }
.confetti:nth-child(4n)   { width: 8px;  height: 22px; }

/* 반짝이 (작은 별/점, 제자리에서 반짝) */
.sparkle {
  position: absolute;
  width: 10px;
  height: 10px;
  background: var(--gold-soft);
  border-radius: 50%;
  box-shadow: 0 0 10px 2px rgba(255, 233, 138, 0.85);
  opacity: 0;
  will-change: transform, opacity;
  animation: sparkleTwinkle 1.2s ease-in-out forwards;
}

/* ---------- 10. 공용 유틸: .hidden / .shake / .pop ---------- */
.hidden { display: none !important; }

/* 화면 흔들림 (접전/탈락 충격) */
.shake { animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }

/* 등장 팝 (요소가 튀어나오며 등장) */
.pop { animation: pop 0.45s cubic-bezier(0.18, 1.5, 0.4, 1) both; }

/* ============================================================
   11. @keyframes
   ============================================================ */
@keyframes bgFloat {
  0%   { background-position: 0% 0%, 100% 0%, 50% 100%, 0% 50%; }
  50%  { background-position: 100% 100%, 0% 100%, 50% 0%, 100% 50%; }
  100% { background-position: 0% 0%, 100% 0%, 50% 100%, 0% 50%; }
}

@keyframes shimmer {
  from { background-position: 0 0; }
  to   { background-position: 34px 34px; }
}

@keyframes shimmerText {
  to { background-position: 200% center; }
}

@keyframes borderRun {
  to { background-position: 300% 300%; }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-7px); }
}

/* 부드러운 글로우 펄스 (버튼/타이틀) */
@keyframes pulse {
  0%, 100% { transform: scale(1);    filter: brightness(1); }
  50%      { transform: scale(1.04); filter: brightness(1.12); }
}
@keyframes pulseSoft {
  0%, 100% { box-shadow: 0 0 14px rgba(255, 209, 26, 0.30); }
  50%      { box-shadow: 0 0 26px rgba(255, 209, 26, 0.55); }
}

/* 등장 팝 */
@keyframes pop {
  0%   { transform: scale(0.5); opacity: 0; }
  70%  { transform: scale(1.12); opacity: 1; }
  100% { transform: scale(1); }
}

/* 카운트다운 숫자 */
@keyframes countPop {
  0%   { transform: scale(2.2); opacity: 0; filter: blur(6px); }
  35%  { transform: scale(0.92); opacity: 1; filter: blur(0); }
  60%  { transform: scale(1.06); }
  100% { transform: scale(1); opacity: 1; }
}

/* 라운드 배너 진입 */
@keyframes bannerIn {
  0%   { transform: translateY(40px) scale(0.8) rotate(-2deg); opacity: 0; }
  100% { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
}

/* 우승 카드 팝 */
@keyframes cardPop {
  0%   { transform: scale(0.4) translateY(30px); opacity: 0; }
  65%  { transform: scale(1.08) translateY(0); opacity: 1; }
  100% { transform: scale(1); }
}
@keyframes cardSheen {
  0%, 60% { left: -60%; }
  100%    { left: 130%; }
}

/* 색종이 낙하 (선택 CSS 변수: --x 가로드리프트, --rot 회전수; 기본값 내장) */
@keyframes confettiFall {
  0%   { transform: translate3d(0, 0, 0) rotate(0); opacity: 0; }
  8%   { opacity: 1; }
  100% {
    transform:
      translate3d(var(--x, 40px), 112vh, 0)
      rotate(calc(var(--rot, 3) * 360deg));
    opacity: 1;
  }
}

/* 반짝이 깜빡임 */
@keyframes sparkleTwinkle {
  0%   { transform: scale(0) rotate(0); opacity: 0; }
  40%  { transform: scale(1.3) rotate(90deg); opacity: 1; }
  100% { transform: scale(0) rotate(180deg); opacity: 0; }
}

/* 화면 흔들림 */
@keyframes shake {
  10%, 90%        { transform: translate(-2px, 0); }
  20%, 80%        { transform: translate(4px, 0); }
  30%, 50%, 70%   { transform: translate(-8px, 0); }
  40%, 60%        { transform: translate(8px, 0); }
}

/* ============================================================
   12. 반응형 (좁은 화면 / 세로 모니터)
   ============================================================ */
@media (max-width: 860px), (max-aspect-ratio: 1/1) {
  #app {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr auto;
  }
  #panel {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: flex-start;
    max-height: 42vh;
  }
  .roster { max-height: 22vh; }
}

/* ============================================================
   13. 모션 최소화 폴백 (멀미/접근성)
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
  body::before, body::after,
  #stage::before,
  .btn-primary,
  .round-banner .gradient,
  .round-banner .round-banner-title.gradient,
  .winner-card::after { animation: none !important; }
  /* 색종이/반짝이는 모션 최소화 시 숨김(애니메이션 없으면 안 보이므로) */
  #fxLayer { display: none !important; }
  /* 정적이어도 보이도록 핵심 등장 요소는 최종 상태 유지 */
  .countdown, .round-banner, .winner-card, .winner-card .wname,
  .winner-card .wrank, .advancer, .eliminated, .pop {
    opacity: 1 !important;
    transform: none !important;
  }
}

</style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="raceCanvas"></canvas>
      <div id="overlay"></div>
      <div id="fxLayer"></div>
    </div>
    <aside id="panel"></aside>
  </div>
  <script>
// 2-1반 학생 명단 (이름만, 학번 제외) — 명렬표에서 자동 추출. 수정 금지(build에서 재생성됨).
window.HD = window.HD || {};

    }
    // Hi-hat: 8분(짝수 스텝) 항상, intensity 높으면 16분 전체
    if (lvl < 0.45) {
      if (s % 4 === 0) hat(t, 0.7, false);
    } else if (lvl < 0.75) {
      if (s % 2 === 0) hat(t, 0.7, s % 4 === 0 ? false : false);
    } else {
      hat(t, s % 4 === 2 ? 0.5 : 0.8, false);
      if (s === 14) hat(t, 0.9, true); // 마디 끝 오픈햇
    }

    // ── 베이스 (8분음표: 짝수 스텝마다) ──
    if (s % 2 === 0) {
      var bi = s / 2; // 0..7
      var semis = BASS_PROG[bar][bi];
      bassNote(t, hz(semis), sp * 2 * 0.92, 1.0);
    }

    // ── 리드 아르페지오 (intensity>0.15 부터, 16분) ──
    if (lvl > 0.15) {
      var ln = LEAD_PROG[bar][s];
      if (ln !== -1 && ln != null) {
        // 낮은 강도에선 군데군데 쉼 (덜 빽빽하게)
        var play = lvl > 0.5 ? true : (s % 2 === 0);
        if (play) {
          var leadVel = 0.6 + 0.5 * lvl;
          leadNote(t, hz(ln), sp * (lvl > 0.6 ? 1.7 : 1.3), leadVel);
        }
      }
    }

    // ── 하이 멜로디 (클라이맥스 lvl>0.6) ──
    if (lvl > 0.6) {
      var mn = MEL_PROG[bar][s];
      if (mn !== -1 && mn != null) {
        leadNote(t, hz(mn + 0), sp * 3.5, 0.45 * lvl);
      }
    }

    // 마디 다운비트 액센트(인텐시티 높을 때 살짝 크래시 대용 오픈햇)
    if (lvl > 0.8 && s === 0 && bar === 0) {
      noiseHit({ dest: musicBus, t: t, filter: 'highpass', freq: 8000, peak: 0.25, a: 0.001, d: 0.3, r: 0.2 });
    }
  }

  // lookahead 스케줄러 루프
  function schedulerTick() {
    if (!ctx || !bgmOn) return;
    while (nextNoteTime < ctx.currentTime + SCHEDULE_AHEAD) {
      scheduleStep(current16th, nextNoteTime);
      nextNoteTime += spb();
      current16th++;
    }
    schedulerTimer = setTimeout(schedulerTick, LOOKAHEAD_MS);
  }

  // ── 공개 API ────────────────────────────────────────────────────────
  function unlock() {
    var c = ensureCtx();
    if (!c) return;
    if (c.state === 'suspended') {
      // resume는 Promise지만 거부돼도 무해
      try { c.resume(); } catch (e) {}
    }
    // 일부 브라우저는 첫 소리가 나야 완전히 unlock → 무음 톤 한 번.
    // master 경유(음소거 일관성) + start/stop 모두 호출해 노드 정리.
    try {
      var b = ctx.createBuffer(1, 1, ctx.sampleRate || 44100);
      var s = ctx.createBufferSource();
      s.buffer = b;
      s.connect(master || ctx.destination);
      s.start(0);
      s.stop(now() + 0.02);
    } catch (e) {}
  }

  function startBgm() {
    var c = ensureCtx();
    if (!c) return;
    if (c.state === 'suspended') { try { c.resume(); } catch (e) {} }
    if (bgmOn) return; // 중복 시작 방지
    bgmOn = true;
    // 첫 음을 살짝 미래에 시작 → 첫 박 클릭/누락 방지
    nextNoteTime = ctx.currentTime + 0.08;
    current16th = 0;
    // 부드러운 fade-in (zipper 없음)
    var g = musicBus.gain;
    g.cancelScheduledValues(ctx.currentTime);
    g.setValueAtTime(Math.max(0.0001, g.value), ctx.currentTime);
    g.linearRampToValueAtTime(0.7, ctx.currentTime + 0.5);
    schedulerTick();
  }

  // 추적 버킷의 노드를 at 시점에 강제 stop()하고 버킷을 비운다. 비운 새 배열을 반환.
  // (이미 예약된 osc.stop()에만 의존하지 않음. 이미 멈춘 노드는 try/catch로 무시.)
  function forceStop(arr, at) {
    for (var i = 0; i < arr.length; i++) {
      var node = arr[i].node;
      if (node && typeof node.stop === 'function') {
        try { node.stop(at); } catch (e) {}
      }
    }
    return [];
  }

  function stopBgm() {
    if (!ctx) { bgmOn = false; return; }
    bgmOn = false;
    if (schedulerTimer) { clearTimeout(schedulerTimer); schedulerTimer = null; }
    var t = ctx.currentTime;
    var fade = 0.25;
    // 부드러운 fade-out
    if (musicBus) {
      var g = musicBus.gain;
      g.cancelScheduledValues(t);
      g.setValueAtTime(Math.max(0.0001, g.value), t);
      g.linearRampToValueAtTime(0.0001, t + fade);
    }
    // 음악 노드만 fade 종료 직후 강제 정지. 진행 중인 긴 SFX(win/fanfare 등)는 건드리지 않음.
    musicNodes = forceStop(musicNodes, t + fade + 0.02);
  }

  // 전체 정지(음악 + 효과음). resetAll/초기화에서 화면 싹 정리할 때 사용.
  function stopAll() {
    stopBgm();
    if (!ctx) { sfxNodes = []; return; }
    // 효과음은 거의 짧으니 살짝만 미뤄 정지(클릭 방지). 즉시에 가깝게.
    sfxNodes = forceStop(sfxNodes, ctx.currentTime + 0.03);
  }

  function setIntensity(level) {
    intensity = clamp01(level);
    if (!ctx) return; // 다음 시작 때 반영
    // 필터 cutoff 부드럽게 (zipper 방지: 짧은 ramp)
    if (musicFilter) {
      var f = musicFilter.frequency;
      var t = ctx.currentTime;
      f.cancelScheduledValues(t);
      f.setValueAtTime(f.value, t);
      f.linearRampToValueAtTime(filterCutoffFor(intensity), t + 0.3);
    }
    // 음악 버스 게인도 강도에 따라 살짝(0.6→0.85) — 박진감
    if (bgmOn && musicBus) {
      var mg = musicBus.gain;
      var tt = ctx.currentTime;
      var target = 0.6 + 0.28 * intensity;
      mg.cancelScheduledValues(tt);
      mg.setValueAtTime(mg.value, tt);
      mg.linearRampToValueAtTime(target, tt + 0.3);
    }
    // 템포(BPM)는 다음 스텝부터 spb()가 자동 반영(seamless).
  }

  // ── 효과음 ──────────────────────────────────────────────────────────
  function sfx(name) {
    var c = ensureCtx();
    if (!c) return;
    // sfx는 unlock 전에 불려도 동작하도록 resume 시도
    if (c.state === 'suspended') { try { c.resume(); } catch (e) {} }
    var t = ctx.currentTime + 0.001;
    switch (name) {
      case 'count': // 짧은 블립 (카운트다운 틱)
        tone({ type: 'square', f0: hz(N.A4), f1: hz(N.A4), a: 0.004, d: 0.05, peak: 0.3, s: 0.2, hold: 0.02, r: 0.08, t: t });
        tone({ type: 'sine', f0: hz(N.A5), peak: 0.12, a: 0.003, d: 0.04, r: 0.06, t: t });
        break;

      case 'go': { // 출발 호른 (밝고 상승, 화음)
        var gt = t;
        // 두 음 화음 + 살짝 상승
        tone({ type: 'sawtooth', f0: hz(N.A4), f1: hz(N.A4), a: 0.01, d: 0.05, peak: 0.32, s: 0.7, hold: 0.28, r: 0.18, t: gt });
        tone({ type: 'sawtooth', f0: hz(N.E5), f1: hz(N.E5), a: 0.01, d: 0.05, peak: 0.3, s: 0.7, hold: 0.28, r: 0.18, t: gt });
        tone({ type: 'square', f0: hz(N.A5), f1: hz(N.A5), a: 0.012, d: 0.05, peak: 0.18, s: 0.6, hold: 0.28, r: 0.2, t: gt });
        // 살짝 위로 끌어올리는 삑
        tone({ type: 'sawtooth', f0: hz(N.A4 - 2), f1: hz(N.A4), a: 0.005, d: 0.02, peak: 0.2, s: 0.4, hold: 0.0, r: 0.1, glide: 'lin', t: gt });
        break;
      }

      case 'drum': { // 드럼롤 (점점 빨라지는 스네어 연타 → 액센트)
        var n = 22;
        var span = 0.95;
        for (var i = 0; i < n; i++) {
          // 점점 촘촘하게: 간격을 가속
          var frac = i / n;
          var tt = t + span * (frac * frac); // ease-in
          var vel = 0.25 + 0.5 * frac;
          snare(tt, vel, sfxBus);
        }
        // 마무리 크래시 느낌
        noiseHit({ dest: sfxBus, t: t + span, filter: 'highpass', freq: 6000, peak: 0.5, a: 0.001, d: 0.5, r: 0.4 });
        snare(t + span, 1.0, sfxBus);
        break;
      }

      case 'advance': { // 밝은 딩 (진출/긍정)
        var at = t;
        tone({ type: 'sine', f0: hz(N.E5), a: 0.004, d: 0.08, peak: 0.3, s: 0.3, hold: 0.03, r: 0.18, t: at });
        tone({ type: 'sine', f0: hz(N.A5), a: 0.004, d: 0.08, peak: 0.26, s: 0.3, hold: 0.03, r: 0.2, t: at + 0.02 });
        tone({ type: 'triangle', f0: hz(N.E6), a: 0.004, d: 0.06, peak: 0.14, r: 0.25, t: at + 0.04 });
        break;
      }

      case 'eliminate': { // 하강 탈락음 (떨어지는 톤)
        tone({ type: 'sawtooth', f0: hz(N.A4), f1: hz(N.A4 - 14), a: 0.005, d: 0.06, peak: 0.3, s: 0.5, hold: 0.05, r: 0.22, glide: 'exp', t: t });
        tone({ type: 'square', f0: hz(N.A4 - 12), f1: hz(N.A4 - 26), a: 0.006, d: 0.06, peak: 0.16, s: 0.5, hold: 0.05, r: 0.22, glide: 'exp', t: t + 0.01 });
        break;
      }

      case 'fanfare': { // 승리 팡파레 (상행 아르페지오 + 화음)
        var seq = [N.A4, N.C5, N.E5, N.A5];
        var step = 0.12;
        for (var k = 0; k < seq.length; k++) {
          var tk = t + k * step;
          tone({ type: 'sawtooth', f0: hz(seq[k]), a: 0.008, d: 0.05, peak: 0.3, s: 0.6, hold: 0.08, r: 0.14, t: tk });
          tone({ type: 'square', f0: hz(seq[k] + 12), a: 0.008, d: 0.05, peak: 0.12, s: 0.5, hold: 0.06, r: 0.12, t: tk });
        }
        // 마지막 화음 길게 (A 메이저-ish 밝게)
        var fin = t + seq.length * step;
        [N.A5, N.C6 + 1, N.E6].forEach(function (s2, idx) {
          tone({ type: 'sawtooth', f0: hz(s2), a: 0.01, d: 0.08, peak: 0.26, s: 0.7, hold: 0.45, r: 0.4, t: fin + idx * 0.005 });
        });
        break;
      }

      case 'win': { // 큰 우승 반짝 (팡파레 + 상승 스파클 글리스)
        // 굵은 화음
        [N.A4, N.E5, N.A5, N.C6 + 1].forEach(function (s2, idx) {
          tone({ type: 'sawtooth', f0: hz(s2), a: 0.012, d: 0.1, peak: 0.28, s: 0.7, hold: 0.5, r: 0.5, t: t + idx * 0.004 });
        });
        // 반짝이 상승 글리스 (빠른 펜타토닉 런)
        var sparkle = [N.A5, N.C6, N.E6, N.A5 + 12, N.E6 + 5, N.A5 + 12, N.C6 + 12];
        for (var w = 0; w < sparkle.length; w++) {
          tone({ type: 'triangle', f0: hz(sparkle[w]), a: 0.003, d: 0.04, peak: 0.16, r: 0.12, t: t + 0.15 + w * 0.05 });
        }
        // 키라킨 고역 반짝
        for (var sp2 = 0; sp2 < 5; sp2++) {
          noiseHit({ dest: sfxBus, t: t + 0.2 + sp2 * 0.08, filter: 'bandpass', freq: 9000 + sp2 * 1500, Q: 8, peak: 0.1, a: 0.002, d: 0.08, r: 0.06 });
        }
        break;
      }

      case 'sizzle': { // 굽는 소리 (필터링된 노이즈, 지글지글)
        var src = ctx.createBufferSource();
        src.buffer = getNoise();
        src.loop = true;
        var bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 3200;
        bp.Q.value = 0.7;
        var hp = ctx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 1500;
        var g = ctx.createGain();
        var dur = 0.7;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.08);
        g.gain.setValueAtTime(0.18, t + dur - 0.2);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        // 지글지글 떨림 (LFO로 게인 흔들기)
        var lfo = ctx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = 28;
        var lfoGain = ctx.createGain();
        lfoGain.gain.value = 0.06;
        lfo.connect(lfoGain); lfoGain.connect(g.gain);
        src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(sfxBus);
        src.start(t); src.stop(t + dur + 0.02);
        lfo.start(t); lfo.stop(t + dur + 0.02);
        track(src, t + dur + 0.05, sfxBus); track(lfo, t + dur + 0.05, sfxBus);
        break;
      }

      case 'click': // UI 틱 (아주 짧고 깔끔)
        tone({ type: 'square', f0: hz(N.A5), a: 0.001, d: 0.02, peak: 0.18, s: 0.0, hold: 0.0, r: 0.03, t: t });
        break;

      case 'whoosh': { // 스월 (노이즈 + 필터 스윕)
        noiseHit({ dest: sfxBus, t: t, filter: 'bandpass', freq: 500, freqEnd: 6000, Q: 1.2, a: 0.04, d: 0.1, peak: 0.3, hold: 0.04, r: 0.18 });
        // 톤 도플러 느낌 살짝
        tone({ type: 'sine', f0: hz(N.A4 - 5), f1: hz(N.A5), a: 0.03, d: 0.08, peak: 0.1, r: 0.18, glide: 'exp', t: t });
        break;
      }

      default:
        // 알 수 없는 이름 → 안전하게 무시 (콘솔 에러 0)
        return;
    }
  }

  // ── 음소거 ──────────────────────────────────────────────────────────
  function applyMute() {
    if (!master) return;
    var t = ctx.currentTime;
    var g = master.gain;
    g.cancelScheduledValues(t);
    g.setValueAtTime(Math.max(0.0001, g.value), t);
    // 짧은 ramp로 클릭 없이
    g.linearRampToValueAtTime(muted ? 0.0001 : savedVol, t + 0.05);
  }

  function toggleMute() {
    muted = !muted;
    if (ctx) applyMute();
    return muted;
  }
  function isMuted() {
    return muted;
  }

  // ── export ──────────────────────────────────────────────────────────
  // SPEC §3-1 필수 7개 + stopAll(추가/선택: 음악+효과음 전체 정지, 초기화 화면 정리용).
  HD.Sound = {
    unlock: unlock,
    startBgm: startBgm,
    stopBgm: stopBgm,
    stopAll: stopAll,
    setIntensity: setIntensity,
    sfx: sfx,
    toggleMute: toggleMute,
    isMuted: isMuted
  };
})();

</script>
  <script>
/* 🌭 핫도그 레이스 — race.js
 * RaceEngine: 토너먼트 대진 계산(makeBracket) + 캔버스 레이스 애니메이션(runRace).
 * 100% 오프라인 / 바닐라 JS / window.HD 하나만 사용 / 외부 리소스 없음.
 *
 * 노출 인터페이스 (SPEC §3-2):
 *   HD.Race.init({ canvas })
 *   HD.Race.makeBracket(numRunners, numWinners) -> { rounds: [...] }
 *   HD.Race.runRace({ runners, advanceCount, title, hooks }) -> Promise<string[]>
 *   HD.Race.stop()                      // 진행 중 레이스 안전 중단(Esc/초기화)
 *
 * 주의: 로드 시점엔 어떤 DOM/캔버스 접근도 하지 않는다(파일 로드/`node --check` 클린).
 * 모든 DOM·캔버스 작업은 메서드 내부에서만 수행.
 */
(function () {
  "use strict";

  var HD = (window.HD = window.HD || {});

  // 프로젝터 가독성용 한글 폰트 스택 (웹폰트 import 금지 — 시스템 폰트만).
  var FONT_STACK =
    '"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif';

  // prefers-reduced-motion 폴백(SPEC §4/§5). reduced=true 면 화면흔들림/파티클/팝/바운스를
  // 끄거나 대폭 축소한다. 로드 시 1회 캐시 + change 리스너로 갱신(없는 환경 안전 가드).
  var reducedMotion = false;
  (function () {
    try {
      if (typeof window !== "undefined" && window.matchMedia) {
        var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
        reducedMotion = !!mq.matches;
        var onChange = function (e) {
          reducedMotion = !!e.matches;
        };
        if (mq.addEventListener) mq.addEventListener("change", onChange);
        else if (mq.addListener) mq.addListener(onChange); // 구형 브라우저
      }
    } catch (e) {
      reducedMotion = false;
    }
  })();

  // 매 프레임 새 배열 할당을 피하기 위한 상수(출발선 점선 패턴).
  var DASH_START = [6, 6];
  var DASH_NONE = [];

  // ──────────────────────────────────────────────────────────────────────────
  // 유틸
  // ──────────────────────────────────────────────────────────────────────────
  function clamp(v, lo, hi) {
    return v < lo ? lo : v > hi ? hi : v;
  }
  function lerp(a, b, t) {
    return a + (b - a) * t;
  }
  function easeOutCubic(t) {
    var u = 1 - t;
    return 1 - u * u * u;
  }
  function easeInOutSine(t) {
    return -(Math.cos(Math.PI * t) - 1) / 2;
  }

  /* 합계 total 을 count 개의 정수로 최대한 고르게 분할.
   * 큰 그룹이 앞에 오도록 내림차순(예: 33,6 -> [6,6,6,5,5,5]). */
  function splitEven(total, count) {
    var base = Math.floor(total / count);
    var rem = total - base * count;
    var out = new Array(count);
    for (var i = 0; i < count; i++) out[i] = base + (i < rem ? 1 : 0);
    return out;
  }

  // ──────────────────────────────────────────────────────────────────────────
  // makeBracket — 대진 '구조'만 계산(이름 배정은 UI 담당)
  // ──────────────────────────────────────────────────────────────────────────
  /*
   * 전략(일반화, 임의 n/winners):
   *  - n ≤ winners  → 단일 '전원 당첨 🎉' 라운드.
   *  - n == w+1     → 한 그룹에서 1명만 탈락시키는 결승 1라운드(경쟁이지만 라운드 1개).
   *  - n  > w+1     → 조별리그 + (필요시 준결승) + 결승. (항상 ≥2 라운드)
   *
   * 라운드 = "현재 생존자 S를 G개 그룹으로 분할, 각 그룹 상위 a명 진출" → 다음 생존자 = G*a.
   *   유효 조건(불변식): 매 그룹에서 최소 1명 탈락 → a < (가장 작은 그룹 크기) = floor(S/G).
   *   즉 a ≤ floor(S/G) - 1.  그리고 G*a 는 [w, S) 범위(엄격 감소, 결승 인원 이상).
   * 결승 = 한 그룹(생존자 전원)에서 상위 w명.
   *
   * 핵심 보조: planRound(S, idealNext) — S명을 위 유효 조건으로 나눠 다음 생존자 next 를
   *   idealNext 에 최대한 가깝게(그리고 그룹 3~8 선호) 만드는 {groups, a, next} 반환.
   *   '정확히 idealNext'가 불가능해도 가장 가까운 달성 가능한 next 를 고른다.
   *
   * 불변식(SPEC §3-2)은 코드로 강제하고, 끝에서 _assertBracket 으로 검산한다.
   */

  /* S명을 그룹들로 나눠 다음 생존자 next(=G*a)가 [lo, S)에 들고 idealNext에 가깝도록.
   * 각 그룹에서 최소 1명 탈락(a ≤ floor(S/G)-1)을 강제.
   * 그룹 3~8 은 '가능하면'(SPEC §3-2-5): ≤8 해가 존재하면 그 중에서만 고르고,
   *   존재하지 않을 때만 >8 을 허용(이 경우 max 그룹이 가장 작은 해 선호).
   * 반환: { groups:number[], a:number, next:number, over8:bool }  (불가능하면 null) */
  function planRound(S, idealNext, lo) {
    if (lo < 1) lo = 1;
    var best = null,
      bestScore = Infinity; // 3~8 만족 해 중 최선
    var bestOver = null,
      bestOverScore = Infinity; // >8 허용 해 중 최선(폴백)
    // G = 그룹 수. 그룹당 최소 2명(탈락1+진출1) → G ≤ floor(S/2).
    var maxG = Math.floor(S / 2);
    for (var G = 1; G <= maxG; G++) {
      var sizes = splitEven(S, G); // 내림차순(앞이 큼)
      var minGroup = sizes[sizes.length - 1];
      var maxGroup = sizes[0];
      if (minGroup < 2) continue;
      var within = maxGroup <= 8 && minGroup >= 3; // 3~8 범위?
      var maxA = minGroup - 1; // 최소 그룹에서도 1명 이상 탈락
      for (var a = 1; a <= maxA; a++) {
        var next = G * a;
        if (next >= S) break; // 엄격 감소 위반
        if (next < lo) continue; // 결승 인원 미만
        // 균형/이상치 점수(작을수록 좋음).
        var score =
          Math.abs(next - idealNext) * 3 +
          (maxGroup - minGroup) * 1.5 +
          Math.abs(maxGroup - 6) * 0.6;
        if (within) {
          if (score < bestScore) {
            bestScore = score;
            best = { groups: sizes.slice(), a: a, next: next, over8: false };
          }
        } else {
          // >8(또는 <3) 폴백: max 그룹이 작을수록 + 점수 작을수록.
          var overScore = (maxGroup > 8 ? (maxGroup - 8) * 100 : 0) + score;
          if (overScore < bestOverScore) {
            bestOverScore = overScore;
            bestOver = { groups: sizes.slice(), a: a, next: next, over8: true };
          }
        }
      }
    }
    return best || bestOver; // 3~8 해가 있으면 그것, 없으면 폴백.
  }

  function makeBracket(numRunners, numWinners) {
    // n 가드: NaN/Infinity/음수 같은 기형 입력 방지(이런 값이 남으면 _assertBracket 이
    // console.warn 을 찍어 SPEC §5 위반 소지). 비정상이면 0(→ 아래 all-win 분기).
    var n = Math.floor(numRunners);
    if (!isFinite(n) || n < 0) n = 0;
    // w 가드: 최소 1(우승자 0명/음수/NaN 같은 기형 입력으로 advanceTotal=0 대진이 나오는 것 방지).
    var w = Math.floor(numWinners);
    if (!isFinite(w) || w < 1) w = 1;

    // 예외: 전원 당첨.
    if (n <= w) {
      return {
        rounds: [
          { key: "all", title: "전원 당첨 🎉", groups: [n], isFinal: true, advanceTotal: n },
        ],
      };
    }

    // n == w+1 : 결승 한 그룹에서 1명만 탈락. (경쟁 있는 단일 결승)
    if (n === w + 1) {
      return {
        rounds: [
          { key: "group", title: "조별리그 (결승)", groups: [n], isFinal: true, advanceTotal: w },
        ],
      };
    }

    // ── n > w+1 : 조별리그 + (준결승) + 결승. 항상 ≥2 라운드. ──
    var rounds = [];
    var survivors = n;

    // 결승 그룹 크기 F: 경쟁이 되도록 w 보다 크고, 너무 크지 않게. [w+1, min(2w, n-1)].
    // (n-1 상한 → 결승 앞에 반드시 예선 라운드가 1개 이상 생겨 ≥2 라운드 보장.)
    var idealFinal = Math.round(w * 1.6);
    var loF = w + 1; // 모든 예선 라운드의 하한(우승자 수보다 많이 남겨야 결승이 경쟁).
    var hiF = Math.min(2 * w, n - 1);
    if (hiF < loF) hiF = loF;
    var finalSize = clamp(idealFinal, loF, hiF);

    // 예선 라운드: survivors 를 finalSize 부근까지 줄인다.
    // 각 라운드의 하한 lo = loF(=w+1) 로 두어, ≤8 그룹 해가 존재하면 그것을 택하게 한다.
    // 한 번에 finalSize 까지 못 줄이면(또는 큰 그룹이 불가피하면) 여러 라운드로 단계 축소.
    var guard = 0;
    while (survivors > finalSize && guard++ < 50) {
      // 이번 라운드 이상 목표(idealNext): 너무 급하게 줄이면 그룹이 작아지고 라운드가
      // 1개로 뭉친다. 초반은 ~55%(드라마틱한 다단계)로 완만히, 라운드가 쌓이면 더 공격적으로
      // 줄여 전체 라운드 수를 2~3개로 수렴(SPEC: 보통 2~3라운드).
      var shrink = rounds.length >= 2 ? 0.4 : 0.55;
      var idealNext = Math.max(finalSize, Math.round(survivors * shrink));
      if (idealNext >= survivors) idealNext = survivors - 1;
      var plan = planRound(survivors, idealNext, loF);
      if (!plan) break; // 안전망(이론상 S>=4 면 항상 성공)
      var roundKey = rounds.length === 0 ? "group" : "semi" + rounds.length;
      var nextIsFinal = plan.next <= finalSize;
      var roundTitle = rounds.length === 0 ? "조별리그" : (nextIsFinal ? "준결승" : "예선");
      rounds.push({
        key: roundKey,
        title: roundTitle,
        groups: plan.groups,
        advancePerGroup: plan.a,
      });
      survivors = plan.next;
      if (plan.next <= finalSize) break;
    }

    // ── 결승 ──
    rounds.push({
      key: "final",
      title: "결승",
      groups: [survivors],
      isFinal: true,
      advanceTotal: w,
    });

    // 첫 라운드 보정: 위 루프가 한 번도 안 돈 경우는 없도록 설계(finalSize ≤ n-1)지만,
    // 만약을 대비해 첫 라운드 key/title 강제.
    if (rounds.length >= 1) {
      rounds[0].key = "group";
      if (rounds[0].title !== "조별리그") {
        rounds[0].title = rounds.length === 1 ? "조별리그 (결승)" : "조별리그";
      }
    }

    var bracket = { rounds: rounds };
    _assertBracket(bracket, n, w);
    return bracket;
  }

  /* 불변식 검산. 위반 시 console.warn (개발 보조). 반환: true/false. */
  function _assertBracket(bracket, n, w) {
    var ok = true;
    function warn(msg) {
      ok = false;
      try {
        console.warn("[HD.Race.makeBracket] 불변식 위반:", msg, { n: n, w: w });
      } catch (e) {}
    }
    var rounds = bracket.rounds;
    if (!rounds || !rounds.length) {
      warn("rounds 비어있음");
      return false;
    }
    // 전원 당첨 예외.
    if (n <= w) {
      if (rounds.length !== 1) warn("전원당첨인데 라운드>1");
      return ok;
    }
    // 1) 첫 라운드.
    if (rounds[0].key !== "group" || rounds[0].title.indexOf("조별리그") !== 0)
      warn("첫 라운드 key/title 규칙 위반");
    // 6) 최소 2라운드(보통). n==w+1 극단은 1라운드 허용 → 경고 대신 통과.
    if (rounds.length < 2 && n > w + 1)
      warn("n>w+1 인데 라운드가 2개 미만");

    var survivors = n;
    for (var i = 0; i < rounds.length; i++) {
      var r = rounds[i];
      var sum = 0;
      for (var j = 0; j < r.groups.length; j++) sum += r.groups[j];
      // 2) 분할 = 현재 생존자.
      if (sum !== survivors)
        warn("라운드 " + i + " 그룹합 " + sum + " ≠ 생존자 " + survivors);
      var next;
      if (r.isFinal) {
        if (r.groups.length !== 1) warn("결승 그룹이 1개가 아님");
        next = r.advanceTotal;
        // 4) 결승은 정확히 w.
        if (next !== w) warn("결승 advanceTotal " + next + " ≠ winners " + w);
      } else {
        next = r.groups.length * r.advancePerGroup;
        // advancePerGroup 은 각 그룹 인원보다 작아야(탈락 발생) — 최소 그룹 기준.
        var minGroup = r.groups[r.groups.length - 1];
        if (r.advancePerGroup >= minGroup)
          warn(
            "라운드 " +
              i +
              " advancePerGroup " +
              r.advancePerGroup +
              " ≥ 최소그룹 " +
              minGroup +
              " (탈락 없음)"
          );
        if (r.advancePerGroup < 1) warn("advancePerGroup<1");
      }
      // 3) 엄격 감소.
      if (next >= survivors)
        warn("라운드 " + i + " 후 생존자 " + next + " 가 줄지 않음(" + survivors + ")");
      // 5) 그룹 3~8 은 '가능하면'(SPEC §3-2-5) — HARD 불변식이 아니다.
      //    n 이 w 에 매우 근접하면(예: n=12,w=10) ≤8 분할로 목표 인원을 만들 수 없어
      //    >8 단일 그룹이 수학적으로 불가피하다. 이는 정상 동작이므로 console 에 경고하지 않는다
      //    (SPEC §5: file:// 더블클릭 시 콘솔 에러/경고 0). planRound 가 가능하면 ≤8 을 택한다.
      survivors = next;
    }
    // 최종 생존자 == w.
    if (survivors !== w) warn("최종 생존자 " + survivors + " ≠ winners " + w);
    return ok;
  }

  /* ── makeBracket 실측 결과(winners=10) ──
   * (n=1..200 × w=1..30 = 6000조합 자동 검증: HARD 불변식 6000/6000 통과.
   *  >8 그룹은 n이 w에 매우 근접해 ≤8 분할이 수학적으로 불가능한 경우에만 발생—SPEC '가능하면'.)
   *  n=33: 조별리그[6,6,6,5,5,5]adv3→18 · 준결승[6,6,6]adv5→15 · 결승[15]→10   (3R) ✓
   *  n=28: 조별리그[7,7,7,7]adv4→16 · 결승[16]→10                              (2R) ✓
   *  n=20: 조별리그[5,5,5,5]adv4→16 · 결승[16]→10                              (2R) ✓
   *  n=12: 조별리그[12]adv11→11 · 결승[11]→10   (12는 ≤8그룹으로 11 못 만듦→단일그룹, soft) (2R) ✓
   *  n=11: 조별리그(결승)[11]→10   (n==w+1: 한 그룹서 1명 탈락하는 결승 1라운드)        (1R) ✓
   *  n=10: 전원 당첨 🎉[10]→10   (n≤w)                                          ✓
   *  n=6 : 전원 당첨 🎉[6]→6     (n≤w)                                          ✓
   */

  // ──────────────────────────────────────────────────────────────────────────
  // 캔버스 / 애니메이션 상태
  // ──────────────────────────────────────────────────────────────────────────
  var R = {
    canvas: null,
    ctx: null,
    dpr: 1,
    cssW: 0,
    cssH: 0,
    _resizeHandler: null,
    _raf: 0,
    _running: false,
    _cancel: null, // 진행 중 레이스 취소 함수
    // 재사용 버퍼(프레임당 할당 회피)
    _runners: [], // runner 객체 풀
    _particles: [], // 파티클 풀
    _particleCount: 0,
  };

  function init(opts) {
    opts = opts || {};
    var canvas = opts.canvas;
    if (!canvas) {
      try {
        console.warn("[HD.Race.init] canvas 누락");
      } catch (e) {}
      return;
    }
    // 재호출 안전: 이전 핸들러/루프 정리.
    stop();
    if (R._resizeHandler) {
      window.removeEventListener("resize", R._resizeHandler);
      R._resizeHandler = null;
    }
    R.canvas = canvas;
    R.ctx = canvas.getContext("2d");
    R._resizeHandler = function () {
      _resize();
    };
    window.addEventListener("resize", R._resizeHandler);
    _resize();
  }

  function _resize() {
    var canvas = R.canvas;
    if (!canvas) return;
    var dpr = window.devicePixelRatio || 1;
    // CSS 크기: 레이아웃에 의해 결정됨. clientWidth/Height 사용(없으면 부모/기본값).
    var cssW = canvas.clientWidth || (canvas.parentNode && canvas.parentNode.clientWidth) || 960;
    var cssH = canvas.clientHeight || (canvas.parentNode && canvas.parentNode.clientHeight) || 540;
    cssW = Math.max(1, cssW);
    cssH = Math.max(1, cssH);
    R.dpr = dpr;
    R.cssW = cssW;
    R.cssH = cssH;
    // 백버퍼 픽셀 크기.
    var pxW = Math.round(cssW * dpr);
    var pxH = Math.round(cssH * dpr);
    if (canvas.width !== pxW) canvas.width = pxW;
    if (canvas.height !== pxH) canvas.height = pxH;
    var ctx = R.ctx;
    if (ctx) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // 이후 그리기는 CSS 픽셀 좌표.
    }
  }

  function stop() {
    R._running = false;
    if (R._raf) {
      cancelAnimationFrame(R._raf);
      R._raf = 0;
    }
    if (R._cancel) {
      var c = R._cancel;
      R._cancel = null;
      try {
        c();
      } catch (e) {}
    }
  }

  // ──────────────────────────────────────────────────────────────────────────
  // 색상 팔레트 (핫도그 무드 — 주자 구분용)
  // ──────────────────────────────────────────────────────────────────────────
  var SAUSAGE_COLORS = [
    "#C0392B", "#E67E22", "#D35400", "#B9770E", "#A04000",
    "#922B21", "#CA6F1E", "#AF601A", "#9C640C", "#7E5109",
  ];
  var BUN = "#F4C36B";
  var BUN_SHADE = "#E3A84E";

  // ──────────────────────────────────────────────────────────────────────────
  // runRace — 그룹 1개 레이스 애니메이션. Promise<orderedNames> 반환.
  // ──────────────────────────────────────────────────────────────────────────
  function runRace(opts) {
    opts = opts || {};
    var names = (opts.runners || []).slice();
    var advanceCount = opts.advanceCount || 0;
    var title = opts.title || "";
    var hooks = opts.hooks || {};

    return new Promise(function (resolve, reject) {
      // 진행 중이던 레이스가 있으면 정리.
      stop();

      if (!R.canvas || !R.ctx) {
        try {
          console.warn("[HD.Race.runRace] init() 먼저 호출 필요");
        } catch (e) {}
        // 안전 폴백: 입력 순서대로 반환(애니메이션 없이).
        var fallback = names.slice();
        _safeHook(hooks.onFinish, fallback);
        resolve(fallback);
        return;
      }
      _resize();

      var N = names.length;
      if (N === 0) {
        _safeHook(hooks.onFinish, []);
        resolve([]);
        return;
      }
      if (N === 1) {
        // 단독 — 즉시 우승 처리(짧은 연출 없이 바로). 그래도 카운트다운 훅은 생략.
        _safeHook(hooks.onFinish, names.slice());
        resolve(names.slice());
        return;
      }

      // ── 트랙/레인 레이아웃 ──
      _buildRunners(names, advanceCount);

      var state = {
        phase: "countdown", // countdown -> race -> photofinish -> done
        t0: 0, // 페이즈 시작 시각
        countdownN: 3,
        countdownShownGo: false,
        lastTs: 0,
        finished: [], // 결승선 통과 순서(runner 인덱스)
        finishedSet: null,
        leader: -1,
        slowmo: 1, // 1 = 정상, <1 슬로모
        shake: 0, // 화면 흔들림 강도(px)
        shakeT: 0,
        photoStart: 0,
        done: false,
        title: title,
        advanceCount: advanceCount,
        hooks: hooks,
      };
      state.finishedSet = {};

      var canceled = false;
      function cleanup() {
        canceled = true;
        R._running = false;
        if (R._raf) {
          cancelAnimationFrame(R._raf);
          R._raf = 0;
        }
      }
      // stop() 이 부를 취소 함수 등록.
      R._cancel = function () {
        if (canceled) return;
        cleanup();
        // 취소 시: 현재까지 순위 + 남은 주자 진행도순으로 채워 onFinish 호출 후 resolve
        var order = _composeOrder(state);
        var nm = order.map(function (idx) {
          return R._runners[idx].name;
        });
        _safeHook(hooks.onFinish, nm);
        resolve(nm);
      };

      R._running = true;
      _safeHook(hooks.onCountdown, 3);

      var startTime = (typeof performance !== "undefined" && performance.now)
        ? performance.now()
        : Date.now();
      state.t0 = startTime;
      state.lastTs = startTime;

      function frame(ts) {
        if (canceled) return;
        if (!R._running) return;
        R._raf = requestAnimationFrame(frame);

        var now = ts || ((typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now());
        var dtMs = now - state.lastTs;
        if (dtMs > 60) dtMs = 60; // 탭 비활성 등으로 큰 점프 방지
        state.lastTs = now;
        var dt = (dtMs / 1000) * state.slowmo;

        _update(state, dt, now);
        _render(state, now);

        if (state.done) {
          cleanup();
          var order = _composeOrder(state);
          var nm = order.map(function (idx) {
            return R._runners[idx].name;
          });
          _safeHook(hooks.onFinish, nm);
          R._cancel = null;
          resolve(nm);
        }
      }
      R._raf = requestAnimationFrame(frame);
    });
  }

  function _safeHook(fn, arg) {
    if (typeof fn === "function") {
      try {
        fn(arg);
      } catch (e) {
        try {
          console.warn("[HD.Race] hook 오류:", e);
        } catch (e2) {}
      }
    }
  }

  // 현재 상태에서 전체 등수 순서(runner 인덱스 배열) 구성.
  function _composeOrder(state) {
    var runners = R._runners;
    var order = state.finished.slice();
    // 아직 안 들어온 주자는 진행도(x) 큰 순.
    var rest = [];
    for (var i = 0; i < runners.length; i++) {
      if (!state.finishedSet[i]) rest.push(i);
    }
    rest.sort(function (a, b) {
      return runners[b].x - runners[a].x;
    });
    for (var k = 0; k < rest.length; k++) order.push(rest[k]);
    return order;
  }

  // ──────────────────────────────────────────────────────────────────────────
  // 주자 생성 (풀 재사용으로 GC 최소화)
  // ──────────────────────────────────────────────────────────────────────────
  function _buildRunners(names, advanceCount) {
    var N = names.length;
    var pool = R._runners;
    // 풀 길이 맞추기.
    while (pool.length < N) {
      pool.push({
        name: "",
        lane: 0,
        x: 0,
        baseSpeed: 0,
        speed: 0,
        wobble: 0,
        wobblePhase: 0,
        legPhase: 0,
        color: "#C0392B",
        finished: false,
        finishT: 0,
        rank: -1,
        targetRank: 0,
        burst: 0, // 순간 가속 잔량
        eyeBlink: 0,
        advancing: false,
        nameW: 0, // measureText 캐시(이름 폭)
        nameWFs: -1, // 그 폭을 잰 폰트 크기(리사이즈 시 재측정 판단용)
      });
    }
    pool.length = N; // 초과분 잘라 사용(객체는 유지되니 재사용)

    // 공정성: 최종 등수를 미리 무작위로 정해두되(targetRank), 레이스 중 역전/접전으로
    // '연출'하고 마지막에 그 순위로 수렴 — 입력 순서 편향 없음.
    var ranks = [];
    for (var i = 0; i < N; i++) ranks.push(i);
    _shuffle(ranks);

    for (var j = 0; j < N; j++) {
      var r = pool[j];
      r.name = names[j];
      r.lane = j;
      r.x = 0;
      // 기본 속도: 약간씩 다르게(0.85~1.15). 최종 수렴은 update 에서 보정.
      r.baseSpeed = 0.9 + Math.random() * 0.25;
      r.speed = r.baseSpeed;
      r.wobble = 2 + Math.random() * 2;
      r.wobblePhase = Math.random() * Math.PI * 2;
      r.legPhase = Math.random() * Math.PI * 2;
      r.color = SAUSAGE_COLORS[j % SAUSAGE_COLORS.length];
      r.finished = false;
      r.finishT = 0;
      r.rank = -1;
      r.targetRank = ranks[j]; // 0 = 1등 (연출용 수렴 목표; 실제 진출은 결승선 통과 순서로 결정)
      r.burst = 0;
      r.eyeBlink = 0;
      // 진출 여부는 결승선 통과 '실제 순서'가 정해질 때 확정(onFinish 와 일치 보장).
      r.advancing = false;
      r.nameW = 0; // 라벨 폭 캐시 무효화(다음 draw에서 1회 측정 후 재사용; 리사이즈 시 재측정)
      r.nameWFs = -1;
    }
    // 파티클 풀 초기화.
    R._particleCount = 0;
    _ensureParticlePool(220);
  }

  function _shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0;
      var tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  function _ensureParticlePool(n) {
    var p = R._particles;
    while (p.length < n) {
      p.push({ x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 1, size: 3, color: "#fff", g: 1, kind: 0 });
    }
  }

  function _spawnParticle(x, y, vx, vy, life, size, color, g, kind) {
    var p = R._particles;
    if (R._particleCount >= p.length) _ensureParticlePool(p.length + 64);
    var pt = p[R._particleCount++];
    pt.x = x; pt.y = y; pt.vx = vx; pt.vy = vy;
    pt.life = life; pt.maxLife = life; pt.size = size;
    pt.color = color; pt.g = g; pt.kind = kind || 0;
  }

  function _burstAt(x, y, amount, palette) {
    // reduced-motion: 파티클 생략(SPEC §4 폴백).
    if (reducedMotion) return;
    for (var i = 0; i < amount; i++) {
      var ang = Math.random() * Math.PI * 2;
      var sp = 60 + Math.random() * 320;
      var vx = Math.cos(ang) * sp;
      var vy = Math.sin(ang) * sp - 120;
      var col = palette[(Math.random() * palette.length) | 0];
      var kind = Math.random() < 0.5 ? 0 : 1; // 0 색종이(사각), 1 소스방울(원)
      _spawnParticle(x, y, vx, vy, 0.7 + Math.random() * 0.7, 3 + Math.random() * 5, col, 520, kind);
    }
  }

  // ──────────────────────────────────────────────────────────────────────────
  // 업데이트 (물리/연출)
  // ──────────────────────────────────────────────────────────────────────────
  var CONFETTI = ["#FF4D4D", "#FFD23F", "#36D399", "#3ABFF8", "#A78BFA", "#FB7185", "#FDE047"];
  var SAUCE = ["#C0392B", "#FFD23F", "#E67E22"]; // 케첩/머스타드

  function _update(state, dt, now) {
    var ctx = R.ctx;
    var W = R.cssW, H = R.cssH;
    var runners = R._runners;
    var N = runners.length;

    var marginL = Math.max(70, W * 0.10);
    var marginR = Math.max(90, W * 0.12);
    var finishX = W - marginR;
    var trackLen = finishX - marginL;

    // 흔들림 감쇠.
    if (state.shake > 0) {
      state.shakeT += dt;
      state.shake *= Math.pow(0.0025, dt); // 빠른 감쇠
      if (state.shake < 0.4) state.shake = 0;
    }

    if (state.phase === "countdown") {
      var elapsed = (now - state.t0) / 1000;
      // 3,2,1 각 0.8초, 그 후 GO 0.6초.
      var step = Math.floor(elapsed / 0.8); // 0,1,2 -> 3,2,1 ; 3 -> GO
      var nShow = 3 - step;
      if (nShow >= 1 && nShow !== state.countdownN) {
        state.countdownN = nShow;
        _safeHook(state.hooks.onCountdown, nShow);
      }
      if (step >= 3 && !state.countdownShownGo) {
        state.countdownShownGo = true;
        _safeHook(state.hooks.onStart);
      }
      if (elapsed >= 0.8 * 3 + 0.55) {
        state.phase = "race";
        state.t0 = now;
      }
      return;
    }

    if (state.phase === "race" || state.phase === "photofinish") {
      // 진행도 기반 목표: targetRank 가 낮을수록(앞등수) 약간 더 빨리 도달하도록
      // 하되, 중간엔 역전/접전을 위해 노이즈와 '고무줄(rubber-band)'을 섞는다.

      // 현재 선두 x.
      var maxX = 0, secondX = 0, leadIdx = -1;
      for (var a = 0; a < N; a++) {
        var rx = runners[a].x;
        if (rx > maxX) { secondX = maxX; maxX = rx; leadIdx = a; }
        else if (rx > secondX) secondX = rx;
      }

      // 리드 체인지 감지.
      if (leadIdx !== -1 && leadIdx !== state.leader) {
        if (state.leader !== -1) {
          _safeHook(state.hooks.onLeadChange);
        }
        state.leader = leadIdx;
      }

      var nearFinishAny = maxX >= trackLen * 0.82;

      for (var i = 0; i < N; i++) {
        var r = runners[i];
        if (r.finished) continue;

        // 진행 비율.
        var prog = r.x / trackLen;

        // 목표 진행도(공정 수렴): 시간이 갈수록 targetRank 순서대로 줄세움.
        // race 후반부에 수렴 강도 ↑.
        var lead = maxX / trackLen; // 선두 진행도
        var convForce = clamp((lead - 0.45) / 0.55, 0, 1); // 0.45 이후 수렴 시작

        // 이 주자가 '있어야 할' 상대 위치(0=맨앞 .. 1=맨뒤)
        var rankPos = N > 1 ? r.targetRank / (N - 1) : 0;
        // 목표 갭(선두 대비 뒤처짐) — 1등은 0, 꼴찌는 좀 더 뒤.
        var desiredGap = rankPos * trackLen * 0.16 * convForce;
        var desiredX = maxX - desiredGap;

        // 기본 전진.
        var baseV = trackLen * 0.42 * r.baseSpeed; // px/s
        // 접전 연출: 랜덤 가속/감속(버스트).
        if (Math.random() < 0.9 * dt * 6) {
          r.burst = Math.max(r.burst, (Math.random() * 0.5));
        }
        var burstV = trackLen * 0.5 * r.burst;
        r.burst *= Math.pow(0.02, dt);

        // 고무줄: 목표보다 뒤면 가속, 앞서면 살짝 감속(수렴).
        var pull = (desiredX - r.x);
        var pullV = pull * (0.6 + 1.8 * convForce);

        // 노이즈(자글자글한 변화).
        var noiseV = (Math.random() - 0.5) * trackLen * 0.12;

        var v = baseV + burstV + pullV + noiseV;
        if (v < trackLen * 0.05) v = trackLen * 0.05; // 항상 약간 전진(역주행 금지)

        r.x += v * dt;

        // 다리/몸 흔들.
        r.legPhase += dt * (8 + r.baseSpeed * 6);
        r.wobblePhase += dt * 6;
        if (r.eyeBlink > 0) r.eyeBlink -= dt;
        else if (Math.random() < dt * 0.4) r.eyeBlink = 0.12;

        // 결승선 통과?
        if (r.x >= trackLen) {
          r.x = trackLen;
          r.finished = true;
          r.finishT = now;
          r.rank = state.finished.length; // 0-based 통과 순서(= 실제 등수)
          // 진출 확정: 통과 순서가 advanceCount 안이면 진출(onFinish 상위 advanceCount 와 동일).
          r.advancing = r.rank < state.advanceCount;
          state.finished.push(i);
          state.finishedSet[i] = true;
          // 결승 파티클(진출=색종이 화려하게, 탈락=소스 약간). reduced-motion 이면 _burstAt 내부에서 생략.
          var fy = _laneY(i, N, H);
          _burstAt(finishX, fy, r.advancing ? 26 : 14, r.advancing ? CONFETTI : SAUCE);
          // 화면 흔들림: reduced-motion 이면 0.
          if (!reducedMotion)
            state.shake = Math.max(state.shake, r.advancing ? 9 : 5);
        }
      }

      // 접전 슬로모: 1등이 거의 다 왔고 2등이 바짝 붙었으면 슬로모 + photofinish.
      // reduced-motion 이면 슬로모/포토피니시 생략 — 레이스는 정상 속도로 그대로 피니시.
      if (state.phase === "race" && nearFinishAny && !reducedMotion) {
        var gap = (maxX - secondX) / trackLen;
        if (gap < 0.06 && state.finished.length === 0) {
          state.phase = "photofinish";
          state.slowmo = 0.35;
          state.photoStart = now;
          _safeHook(state.hooks.onPhotoFinish);
        }
      }
      if (state.phase === "photofinish") {
        // 1등 확정되면 슬로모 천천히 해제.
        if (state.finished.length >= 1) {
          state.slowmo = clamp(state.slowmo + dt * 0.8, 0.35, 1);
          if (state.slowmo >= 0.999) {
            state.slowmo = 1;
            state.phase = "race";
          }
        }
      }

      // 종료 판정: 전원 통과.
      if (state.finished.length >= N) {
        // 마무리 여운(파티클 떨어질 시간) 후 done.
        if (!state._finishAt) state._finishAt = now;
        if (now - state._finishAt > 650) {
          state.done = true;
        }
      }
    }

    // 파티클 업데이트(역방향 제거로 O(n)).
    var ps = R._particles;
    var cnt = R._particleCount;
    for (var pI = cnt - 1; pI >= 0; pI--) {
      var pt = ps[pI];
      pt.life -= dt;
      if (pt.life <= 0) {
        // swap-remove
        var last = ps[--R._particleCount];
        ps[R._particleCount] = pt;
        ps[pI] = last;
        continue;
      }
      pt.vy += pt.g * dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= Math.pow(0.4, dt); // 공기저항
    }
  }

  // 레인 Y 좌표.
  function _laneY(i, N, H) {
    var top = Math.max(54, H * 0.12);
    var bottom = H - Math.max(40, H * 0.08);
    var usable = bottom - top;
    var step = N > 1 ? usable / N : usable;
    return top + step * (i + 0.5);
  }

  // ──────────────────────────────────────────────────────────────────────────
  // 렌더
  // ──────────────────────────────────────────────────────────────────────────
  function _render(state, now) {
    var ctx = R.ctx;
    if (!ctx) return;
    var W = R.cssW, H = R.cssH;
    var runners = R._runners;
    var N = runners.length;

    var marginL = Math.max(70, W * 0.10);
    var marginR = Math.max(90, W * 0.12);
    var finishX = W - marginR;
    var trackLen = finishX - marginL;

    // 화면 흔들림 오프셋.
    var sx = 0, sy = 0;
    if (state.shake > 0) {
      sx = (Math.random() - 0.5) * 2 * state.shake;
      sy = (Math.random() - 0.5) * 2 * state.shake;
    }

    ctx.save();
    ctx.clearRect(0, 0, W, H);
    ctx.translate(sx, sy);

    // 배경(투명 캔버스 위 옅은 트랙 — Designer의 CSS 배경이 뒤에 보이도록 거의 투명하게).
    _drawTrack(ctx, marginL, finishX, W, H, N, now);

    // 주자들(뒤 레인부터 그려 앞 레인이 위에).
    for (var i = 0; i < N; i++) {
      var r = runners[i];
      var y = _laneY(i, N, H);
      var x = marginL + r.x;
      _drawHotdog(ctx, x, y, r, now, trackLen);
    }

    // 파티클.
    _drawParticles(ctx);

    // 작은 타이틀(좌상단) — UI 가 큰 배너를 #overlay 에 그리므로 여긴 보조.
    if (state.title) {
      // 우상단 정렬: 좌상단은 Designer 의 .bracket 보드(z:2, ~62%w·38vh)가 차지하므로 피한다.
      ctx.save();
      ctx.font = "600 " + Math.round(clamp(W * 0.022, 14, 26)) + "px " + FONT_STACK;
      ctx.fillStyle = "rgba(255,255,255,0.86)";
      ctx.textAlign = "right";
      ctx.textBaseline = "top";
      ctx.shadowColor = "rgba(0,0,0,0.5)";
      ctx.shadowBlur = 6;
      ctx.fillText(state.title, finishX + Math.max(40, W * 0.05), Math.max(8, H * 0.03));
      ctx.restore();
    }

    // 카운트다운(캔버스에도 큰 숫자 — overlay 와 별개로 시각 강조).
    if (state.phase === "countdown") {
      _drawCountdown(ctx, state, W, H);
    }

    ctx.restore();
  }

  function _drawTrack(ctx, marginL, finishX, W, H, N, now) {
    // 트랙 바닥(아주 옅게) — CSS 배경 위에 살짝.
    ctx.save();
    var top = Math.max(54, H * 0.12) - 18;
    var bottom = H - Math.max(40, H * 0.08) + 18;

    // 레인 구분선.
    ctx.lineWidth = 1;
    for (var i = 0; i <= N; i++) {
      var ly = _laneY(i, N, H) - (_laneY(1, N, H) - _laneY(0, N, H)) / 2;
      ctx.strokeStyle = "rgba(255,255,255,0.06)";
      ctx.beginPath();
      ctx.moveTo(marginL - 30, ly);
      ctx.lineTo(finishX + 40, ly);
      ctx.stroke();
    }

    // 출발선.
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.setLineDash(DASH_START); // 상수 배열(매 프레임 할당 회피)
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(marginL, top);
    ctx.lineTo(marginL, bottom);
    ctx.stroke();
    ctx.setLineDash(DASH_NONE);

    // 결승선(체커보드).
    var cw = 9;
    var cols = 2;
    for (var cx = 0; cx < cols; cx++) {
      for (var cy = top; cy < bottom; cy += cw) {
        var on = (((cx + Math.floor((cy - top) / cw)) % 2) === 0);
        ctx.fillStyle = on ? "rgba(255,255,255,0.92)" : "rgba(20,20,20,0.85)";
        ctx.fillRect(finishX + cx * cw, cy, cw, cw);
      }
    }
    // 결승선 깃발 글로우.
    ctx.fillStyle = "rgba(255,210,63,0.10)";
    ctx.fillRect(finishX - 6, top, 6, bottom - top);

    ctx.restore();
  }

  /* 귀여운 핫도그 캐릭터 1마리.
   * 빵(번) + 소시지 + 케첩/머스타드 지그재그 + 얼굴(눈/볼/입) + 달리는 다리.
   * 이름은 캐릭터 위에 둥근 라벨로 귀엽게.
   */
  function _drawHotdog(ctx, x, y, r, now, trackLen) {
    var s = clamp(R.cssH / Math.max(7, R._runners.length) * 0.62, 16, 46); // 캐릭터 높이 스케일
    var bodyW = s * 2.0;
    var bodyH = s * 0.92;

    // 달릴 때 상하 바운스 + 살짝 기울기. reduced-motion 이면 모션 진폭 0(정지 자세, 고정 lean 유지).
    var run = r.finished || reducedMotion ? 0 : 1;
    var bounce = Math.sin(r.legPhase) * s * 0.10 * run;
    var tilt = Math.sin(r.legPhase * 0.5) * 0.06 * run + 0.06; // 앞으로 살짝 기운 자세(고정)
    var yy = y + bounce;

    ctx.save();
    ctx.translate(x, yy);

    // 그림자.
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(0, bodyH * 0.62, bodyW * 0.42, s * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.rotate(tilt);

    // 다리(달리는 모션) — 빵 아래 두 개.
    var legSwing = Math.sin(r.legPhase) * s * 0.5 * run;
    ctx.strokeStyle = "#7E5109";
    ctx.lineWidth = Math.max(2, s * 0.12);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-bodyW * 0.18, bodyH * 0.34);
    ctx.lineTo(-bodyW * 0.18 + legSwing, bodyH * 0.34 + s * 0.42);
    ctx.moveTo(bodyW * 0.16, bodyH * 0.34);
    ctx.lineTo(bodyW * 0.16 - legSwing, bodyH * 0.34 + s * 0.42);
    ctx.stroke();
    // 작은 신발.
    ctx.fillStyle = "#3A2410";
    _circle(ctx, -bodyW * 0.18 + legSwing, bodyH * 0.34 + s * 0.46, s * 0.1);
    _circle(ctx, bodyW * 0.16 - legSwing, bodyH * 0.34 + s * 0.46, s * 0.1);

    // 아래 빵.
    _roundRect(ctx, -bodyW / 2, -bodyH * 0.05, bodyW, bodyH * 0.55, bodyH * 0.28);
    ctx.fillStyle = BUN_SHADE;
    ctx.fill();

    // 소시지(가운데).
    _roundRect(ctx, -bodyW * 0.46, -bodyH * 0.28, bodyW * 0.92, bodyH * 0.5, bodyH * 0.25);
    ctx.fillStyle = r.color;
    ctx.fill();
    // 소시지 하이라이트.
    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = "#fff";
    _roundRect(ctx, -bodyW * 0.42, -bodyH * 0.24, bodyW * 0.84, bodyH * 0.14, bodyH * 0.08);
    ctx.fill();
    ctx.restore();

    // 위 빵.
    _roundRect(ctx, -bodyW / 2, -bodyH * 0.5, bodyW, bodyH * 0.4, bodyH * 0.24);
    ctx.fillStyle = BUN;
    ctx.fill();

    // 케첩/머스타드 지그재그.
    ctx.lineWidth = Math.max(1.6, s * 0.07);
    ctx.lineCap = "round";
    ctx.strokeStyle = "#E23B2E"; // 케첩
    _zigzag(ctx, -bodyW * 0.4, -bodyH * 0.06, bodyW * 0.8, s * 0.12, 6);
    ctx.strokeStyle = "#FFC21A"; // 머스타드
    _zigzag(ctx, -bodyW * 0.4, -bodyH * 0.0, bodyW * 0.8, s * 0.1, 6);

    // 얼굴(소시지 위) — 눈/볼/입.
    var eyeY = -bodyH * 0.06;
    var eyeDX = bodyW * 0.12;
    var blink = r.eyeBlink > 0;
    ctx.fillStyle = "#241200";
    if (blink) {
      ctx.lineWidth = Math.max(1.4, s * 0.05);
      ctx.strokeStyle = "#241200";
      ctx.beginPath();
      ctx.moveTo(-eyeDX - s * 0.06, eyeY); ctx.lineTo(-eyeDX + s * 0.06, eyeY);
      ctx.moveTo(eyeDX - s * 0.06, eyeY); ctx.lineTo(eyeDX + s * 0.06, eyeY);
      ctx.stroke();
    } else {
      _circle(ctx, -eyeDX, eyeY, s * 0.075);
      _circle(ctx, eyeDX, eyeY, s * 0.075);
      // 눈 반짝.
      ctx.fillStyle = "#fff";
      _circle(ctx, -eyeDX + s * 0.03, eyeY - s * 0.03, s * 0.028);
      _circle(ctx, eyeDX + s * 0.03, eyeY - s * 0.03, s * 0.028);
      ctx.fillStyle = "#241200";
    }
    // 볼터치.
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = "#FF8A8A";
    _circle(ctx, -eyeDX - s * 0.02, eyeY + s * 0.12, s * 0.06);
    _circle(ctx, eyeDX + s * 0.02, eyeY + s * 0.12, s * 0.06);
    ctx.restore();
    // 입(작은 미소 / 우승자는 활짝).
    ctx.strokeStyle = "#241200";
    ctx.lineWidth = Math.max(1.4, s * 0.05);
    ctx.beginPath();
    var smile = r.finished && r.advancing ? s * 0.13 : s * 0.07;
    ctx.arc(0, eyeY + s * 0.1, smile, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();

    ctx.restore(); // tilt/translate 해제 전(이름은 회전 영향 없이 그리기 위해 별도)

    // 이름 라벨(회전 영향 X) — 캐릭터 위 둥근 칩.
    _drawNameLabel(ctx, x, yy - bodyH * 0.78, r);
  }

  function _drawNameLabel(ctx, cx, cy, r) {
    // 이름 가독성이 앱의 핵심 — 출전자 적을수록(레인 높이 큼) 폰트를 크게.
    // 단, 칩 높이(≈fs*1.64)가 레인 높이를 넘지 않게 상한을 묶어 위/아래 레인과 겹치지 않게 한다.
    var N = R._runners.length;
    var top = Math.max(54, R.cssH * 0.12);
    var bottom = R.cssH - Math.max(40, R.cssH * 0.08);
    var laneH = N > 1 ? (bottom - top) / N : bottom - top;
    // 레인 높이의 ~52%까지 폰트 허용(칩 높이 fs*1.64 ≈ 레인의 ~85% → 인접 레인과 안전 간격).
    var fsCap = Math.min(52, (laneH * 0.52) / 1.0);
    var fs = clamp(R.cssH / Math.max(7, N) * 0.4, 12, fsCap);
    if (fs < 12) fs = 12; // 아주 많은 인원이어도 최소 가독 크기 보장(약간의 겹침 감수)
    var fsR = Math.round(fs);
    ctx.save();
    ctx.font = "700 " + fsR + "px " + FONT_STACK;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    // measureText 캐시: 폰트 크기가 그대로면 재측정 생략(주자당 매 프레임 비용 제거).
    // 리사이즈로 fs 가 바뀌면 1회만 다시 측정.
    if (r.nameWFs !== fsR) {
      r.nameW = ctx.measureText(r.name).width;
      r.nameWFs = fsR;
    }
    var tw = r.nameW;
    var padX = fs * 0.55, padY = fs * 0.32;
    var w = tw + padX * 2, h = fs + padY * 2;
    // 칩 배경. (shadowBlur 는 33주자×매 프레임이면 비싸 — 제거. 칩 배경/흰 글자로 가독성 확보.)
    var bg = r.finished
      ? (r.advancing ? "rgba(54,211,153,0.95)" : "rgba(120,120,130,0.85)")
      : "rgba(20,16,28,0.78)";
    _roundRect(ctx, cx - w / 2, cy - h / 2, w, h, h * 0.5);
    ctx.fillStyle = bg;
    ctx.fill();
    // 진출자 테두리 글로우.
    if (r.finished && r.advancing) {
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(255,255,255,0.85)";
      ctx.stroke();
    }
    // 이름.
    ctx.fillStyle = "#fff";
    ctx.fillText(r.name, cx, cy + 1);
    ctx.restore();
  }

  function _drawParticles(ctx) {
    var ps = R._particles;
    var cnt = R._particleCount;
    for (var i = 0; i < cnt; i++) {
      var p = ps[i];
      var a = clamp(p.life / p.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      if (p.kind === 0) {
        // 색종이(회전 사각).
        ctx.translate(p.x, p.y);
        ctx.rotate((p.x + p.y) * 0.05);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      } else {
        // 소스 방울.
        _circle(ctx, p.x, p.y, p.size * 0.5);
      }
      ctx.restore();
    }
  }

  function _drawCountdown(ctx, state, W, H) {
    var elapsed = (state.lastTs - state.t0) / 1000;
    var inStep = elapsed - Math.floor(elapsed / 0.8) * 0.8; // 0~0.8 within step
    var step = Math.floor(elapsed / 0.8);
    var label = step >= 3 ? "GO!" : String(3 - step);
    // 등장 팝 애니메이션. reduced-motion 이면 스케일 고정(1.0) — 숫자/페이드만.
    var t = clamp(inStep / 0.8, 0, 1);
    var pop = reducedMotion ? 1 : 1 + (1 - easeOutCubic(t)) * 0.8;
    var alpha = step >= 3 ? clamp(1 - (elapsed - 2.4) / 0.55, 0, 1) : clamp(1.2 - t, 0.15, 1);

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(W / 2, H / 2);
    ctx.scale(pop, pop);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    var fs = Math.round(clamp(Math.min(W, H) * 0.28, 60, 240));
    ctx.font = "900 " + fs + "px " + FONT_STACK;
    ctx.lineWidth = fs * 0.06;
