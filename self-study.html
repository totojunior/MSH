<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어휘 자기주도학습 · 마석고 2학년</title>
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<!-- 폰트는 비차단 로드: CDN이 막힌 네트워크에서도 앱 렌더가 지연되지 않음 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#eef1f8; --bg-blur:rgba(238,241,248,.86);
  --card:#ffffff; --text:#232946; --sub:#6b7394; --line:#e2e6f3;
  --prim:#4f46e5; --prim-strong:#4338ca; --prim-soft:#eef0ff; --accent:#7c3aed;
  --ok:#15803d; --ok-bg:#e6f6ec; --bad:#dc2626; --bad-bg:#fdecec;
  --shadow:0 2px 10px rgba(35,41,70,.06);
}
html[data-theme="dark"]{
  --bg:#0f1220; --bg-blur:rgba(15,18,32,.86);
  --card:#1a1f36; --text:#e9ecfb; --sub:#98a0c4; --line:#2a3052;
  --prim:#6366f1; --prim-strong:#c3c8ff; --prim-soft:#262c52; --accent:#a78bfa;
  --ok:#4ade80; --ok-bg:#143423; --bad:#f87171; --bad-bg:#3d1a22;
  --shadow:0 2px 12px rgba(0,0,0,.35);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; min-height:100svh;
  touch-action:manipulation;
}
button{ font-family:inherit; color:inherit; }
button:focus-visible, input:focus-visible{ outline:2.5px solid var(--prim); outline-offset:2px; }
#app{ max-width:680px; margin:0 auto; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; }
header{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:10px;
  padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top));
  background:var(--bg-blur); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.iconbtn{
  width:42px; height:42px; flex:none; border:none; border-radius:12px; cursor:pointer;
  background:var(--card); border:1.5px solid var(--line); font-size:17px;
  display:flex; align-items:center; justify-content:center;
}
.iconbtn:active{ transform:scale(.94); }
#hTitle{ flex:1; min-width:0; }
.ht1{ font-size:16.5px; font-weight:800; letter-spacing:-.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ht2{ font-size:11.5px; color:var(--sub); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
main{ flex:1; padding:16px 16px calc(44px + env(safe-area-inset-bottom)); }
.wrap{ animation:fadeUp .22s ease both; }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }

.card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:var(--shadow); }
.lbl{ font-size:13px; font-weight:800; color:var(--sub); margin:16px 2px 7px; }
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  min-height:52px; padding:12px 18px; border-radius:14px; border:none; cursor:pointer;
  background:var(--prim); color:#fff; font-size:17px; font-weight:800; letter-spacing:-.2px;
}
.btn:active{ transform:scale(.98); }
.btn.ghost{ background:var(--card); color:var(--text); border:1.5px solid var(--line); }
.btn.soft{ background:var(--prim-soft); color:var(--prim-strong); }
.btn.slim{ min-height:44px; font-size:15px; }
.btn.danger{ background:var(--bad-bg); color:var(--bad); }
.row{ display:flex; gap:10px; }
.row>.btn{ flex:1; }

/* 홈 */
.hello{ display:flex; align-items:center; gap:12px; padding:16px 18px; }
.hello .em{ font-size:30px; }
.hello .t{ font-weight:800; font-size:17px; }
.hello .s{ font-size:13px; color:var(--sub); margin-top:2px; }
.hello .s a{ color:var(--prim-strong); font-weight:700; text-decoration:none; }
.lesson-card{ display:flex; align-items:center; gap:14px; padding:18px; cursor:pointer; margin-top:12px; }
.lesson-card .em{ font-size:32px; flex:none; }
.lesson-card .mid{ flex:1; min-width:0; }
.lesson-card .t{ font-size:18px; font-weight:800; }
.lesson-card .s{ font-size:13px; color:var(--sub); margin:2px 0 8px; }
.lesson-card .arrow{ color:var(--sub); font-size:18px; flex:none; }
.pbar{ height:9px; border-radius:99px; background:var(--line); overflow:hidden; }
.pbar i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--prim),var(--accent)); border-radius:99px; transition:width .35s; }
.pinfo{ display:flex; justify-content:space-between; font-size:12px; color:var(--sub); font-weight:700; margin-top:5px; }
footer{ text-align:center; font-size:12px; color:var(--sub); padding:26px 10px 10px; }

/* 레슨 메뉴 */
.tiles{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
.tile{
  position:relative; background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:16px 14px; display:flex; flex-direction:column; gap:5px; align-items:flex-start;
  cursor:pointer; box-shadow:var(--shadow); text-align:left; min-height:104px;
}
.tile:active{ transform:scale(.98); }
.tile .em{ font-size:26px; }
.tile .t{ font-weight:800; font-size:16px; letter-spacing:-.3px; }
.tile .d{ font-size:12.5px; color:var(--sub); line-height:1.4; }
.tile .cnt{
  position:absolute; top:10px; right:10px; min-width:24px; height:24px; padding:0 7px;
  border-radius:99px; background:var(--bad); color:#fff; font-size:12.5px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
}

/* 품사 배지 */
.pos{ display:inline-flex; align-items:center; justify-content:center; min-width:23px; height:23px; padding:0 6px; border-radius:7px; font-size:12px; font-weight:800; vertical-align:2px; }
.pn{ background:#dbe7ff; color:#1d4ed8; } .pv{ background:#ffe1e6; color:#be123c; }
.pa{ background:#dcf3e3; color:#15803d; } .pd{ background:#eadffb; color:#7e22ce; }
.pp{ background:#fdeed3; color:#b45309; } .ph{ background:#e6e9f2; color:#475569; }
html[data-theme="dark"] .pn{ background:#1c2a52; color:#8fb3ff; }
html[data-theme="dark"] .pv{ background:#43202c; color:#ff9db1; }
html[data-theme="dark"] .pa{ background:#16351f; color:#6fe39b; }
html[data-theme="dark"] .pd{ background:#32204d; color:#cfaeff; }
html[data-theme="dark"] .pp{ background:#3d2c13; color:#ffc46b; }
html[data-theme="dark"] .ph{ background:#272d43; color:#a8b2cf; }
html[data-theme="dark"] .tile .cnt{ background:#dc2626; } /* 다크의 --bad(#f87171)는 흰 글자와 대비 부족 */

/* 발음 버튼 */
.say{
  border:none; background:var(--prim-soft); color:var(--prim-strong); border-radius:50%;
  width:40px; height:40px; font-size:17px; cursor:pointer; flex:none;
  display:inline-flex; align-items:center; justify-content:center; vertical-align:middle;
}
.say.mini{ width:34px; height:34px; font-size:14px; }
.say{ position:relative; }
.say::after{ content:''; position:absolute; inset:-5px; border-radius:50%; } /* 터치 히트 영역 44px 확보 */
.say:active{ transform:scale(.9); }

/* 세그먼트 */
.seg{ display:flex; background:var(--card); border:1.5px solid var(--line); border-radius:13px; padding:4px; gap:4px; }
.seg button{ flex:1; min-height:42px; border:none; background:transparent; border-radius:9px; font-size:14.5px; font-weight:700; color:var(--sub); cursor:pointer; padding:6px 4px; }
.seg button.sel{ background:var(--prim); color:#fff; }

/* 퀴즈 */
.quiz-top{ display:flex; justify-content:space-between; align-items:center; font-size:14px; font-weight:800; color:var(--sub); margin-bottom:8px; }
.quiz-top .qscore{ color:var(--ok); }
.pbar.slim{ height:6px; margin-bottom:14px; }
.qcard{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; min-height:150px; padding:24px 18px; }
.q-word{ font-size:clamp(26px,7vw,38px); font-weight:900; letter-spacing:-.5px; line-height:1.2; word-break:keep-all; overflow-wrap:anywhere; }
.q-mean{ font-size:clamp(21px,5.6vw,28px); font-weight:800; line-height:1.35; word-break:keep-all; }
.q-ask{ font-size:15.5px; color:var(--sub); font-weight:700; }
.q-ask b{ color:var(--prim-strong); }
.opts{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
.opt{
  display:flex; align-items:center; gap:12px; width:100%; min-height:56px; padding:12px 14px;
  border-radius:14px; border:1.5px solid var(--line); background:var(--card);
  font-size:16.5px; font-weight:700; cursor:pointer; text-align:left; line-height:1.35;
}
.opt .opt-n{ width:26px; height:26px; border-radius:8px; background:var(--prim-soft); color:var(--prim-strong); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; flex:none; }
.opt .opt-t{ flex:1; word-break:keep-all; overflow-wrap:anywhere; }
.opt.is-ok{ border-color:var(--ok); background:var(--ok-bg); }
.opt.is-bad{ border-color:var(--bad); background:var(--bad-bg); }
.opt.dim{ opacity:.45; }
.opt:disabled{ cursor:default; }
.fbp{ border-radius:14px; padding:14px 16px; text-align:center; margin-top:14px; animation:fadeUp .2s both; }
.fbp.ok{ background:var(--ok-bg); color:var(--ok); font-weight:800; font-size:16px; }
.fbp.bad{ background:var(--bad-bg); }
.fbp .fb-word{ font-size:20px; font-weight:900; color:var(--text); margin:4px 0 2px; }
.fbp .fb-mean{ font-size:15px; color:var(--text); font-weight:700; }
.fbp .fb-note{ font-size:13px; color:var(--sub); margin-top:6px; line-height:1.5; }
.fbp .btn{ margin-top:12px; }

/* 칩 */
.chips{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; }
.chips.left{ justify-content:flex-start; }
.chip{ display:inline-flex; align-items:center; gap:6px; background:var(--prim-soft); border-radius:10px; padding:7px 11px; font-size:13.5px; font-weight:700; cursor:pointer; border:none; text-align:left; position:relative; }
.chip::after{ content:''; position:absolute; inset:-3px; border-radius:12px; } /* 터치 히트 영역 확장 */
.chip .cm{ font-weight:600; color:var(--sub); }

/* 플래시카드 */
.flip{ perspective:1200px; height:clamp(320px,52vh,440px); margin-top:6px; cursor:pointer; }
.flip-inner{ position:relative; width:100%; height:100%; transition:transform .45s cubic-bezier(.2,.7,.3,1); transform-style:preserve-3d; }
.flip.flipped .flip-inner{ transform:rotateY(180deg); }
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  padding:22px 18px; border-radius:20px; background:var(--card); border:1px solid var(--line);
  box-shadow:var(--shadow); text-align:center; overflow:hidden;
}
.face.back{ transform:rotateY(180deg); justify-content:flex-start; }
/* 스크롤은 face 자신이 아니라 내부 래퍼가 담당 (backface 컬링과의 상호작용 예방) */
.back-scroll{ overflow-y:auto; width:100%; max-height:100%; display:flex; flex-direction:column; align-items:center; gap:12px; padding-bottom:4px; }
.taphint{ position:absolute; bottom:12px; left:0; right:0; font-size:12px; color:var(--sub); font-weight:600; }
.fc-word{ font-size:clamp(28px,8vw,42px); font-weight:900; letter-spacing:-.5px; line-height:1.2; word-break:keep-all; overflow-wrap:anywhere; }
.fc-mean{ font-size:clamp(22px,6vw,30px); font-weight:800; line-height:1.4; word-break:keep-all; }
.fc-sub{ font-size:14px; color:var(--sub); font-weight:600; }
.fc-ex{ font-size:14.5px; line-height:1.6; color:var(--sub); text-align:left; background:var(--bg); border-radius:12px; padding:12px 14px; width:100%; }
.fc-note{ font-size:13px; line-height:1.55; color:var(--prim-strong); background:var(--prim-soft); border-radius:12px; padding:10px 12px; width:100%; text-align:left; }
mark{ background:transparent; color:var(--prim-strong); font-weight:800; }
.flash-btns{ display:flex; gap:10px; margin-top:14px; }
.flash-btns .btn{ flex:1; min-height:58px; font-size:16.5px; }
.btn.no{ background:var(--bad-bg); color:var(--bad); }
.btn.yes{ background:var(--ok-bg); color:var(--ok); }

/* 스펠링 */
.pat{ font-family:ui-monospace,Consolas,Menlo,monospace; font-size:clamp(18px,5.5vw,24px); letter-spacing:3px; text-align:center; color:var(--sub); font-weight:700; margin:14px 0 4px; word-break:break-word; line-height:1.7; }
.pat b{ color:var(--prim-strong); }
.tin{
  width:100%; min-height:56px; border-radius:14px; border:1.5px solid var(--line);
  background:var(--card); color:var(--text); font-size:19px; font-weight:800;
  padding:10px 14px; text-align:center; outline:none; margin-top:10px;
}
.tin:focus{ border-color:var(--prim); }
.spell-btns{ display:flex; gap:8px; margin-top:12px; }
.spell-btns .btn{ flex:1; }
.bigsay{ width:76px; height:76px; border-radius:50%; border:none; background:var(--prim-soft); color:var(--prim-strong); font-size:30px; cursor:pointer; }
.bigsay:active{ transform:scale(.92); }
.typed{ text-decoration:line-through; color:var(--bad); font-weight:700; }

/* 결과 */
.result{ text-align:center; padding:26px 18px; }
.score-big{ font-size:56px; font-weight:900; letter-spacing:-1px; }
.score-big small{ font-size:24px; color:var(--sub); font-weight:800; }
.score-pct{ font-size:15px; color:var(--sub); font-weight:700; margin-top:2px; }
.score-msg{ font-size:19px; font-weight:800; margin-top:10px; }
.wrong-list{ margin-top:10px; }
.wrong-item{ display:flex; align-items:center; gap:9px; padding:11px 4px; border-bottom:1px solid var(--line); font-size:15px; }
.wrong-item:last-child{ border-bottom:none; }
.wrong-item .w{ font-weight:800; }
.wrong-item .m{ margin-left:auto; color:var(--sub); font-weight:600; text-align:right; }
.cf{ position:fixed; top:-30px; font-size:22px; z-index:999; pointer-events:none; animation:cfall linear forwards; }
@keyframes cfall{ to{ transform:translateY(112vh) rotate(680deg); } }

/* 단어 목록 */
.list-ctrl{ display:flex; gap:8px; margin-bottom:10px; }
.list-ctrl .tin{ margin-top:0; min-height:46px; font-size:16px; font-weight:600; text-align:left; flex:1; } /* 16px 미만이면 iOS가 포커스 시 화면을 강제 확대함 */
.tgl{ border:1.5px solid var(--line); background:var(--card); color:var(--sub); border-radius:12px; padding:0 13px; font-size:13.5px; font-weight:800; cursor:pointer; min-height:46px; flex:none; }
.tgl.on{ background:var(--prim); border-color:var(--prim); color:#fff; }
.wrow{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px; cursor:pointer; box-shadow:var(--shadow); }
.wrow .top{ display:flex; align-items:center; gap:9px; }
.wrow .no{ color:var(--sub); font-size:12px; font-weight:700; min-width:22px; }
.wrow .ww{ font-weight:800; font-size:16.5px; overflow-wrap:anywhere; }
.wrow .wm{ margin-left:auto; font-size:14.5px; color:var(--text); font-weight:600; text-align:right; max-width:48%; word-break:keep-all; }
.wrow .kn{ color:var(--ok); font-size:13px; flex:none; }
.masked{ filter:blur(6.5px); user-select:none; -webkit-user-select:none; }
.wdetail{ margin-top:11px; padding-top:11px; border-top:1.5px dashed var(--line); display:flex; flex-direction:column; gap:9px; font-size:14px; color:var(--sub); cursor:default; }
.wdetail .ex{ line-height:1.6; }

/* 오답/기록 */
.empty{ text-align:center; padding:44px 16px; color:var(--sub); font-size:15px; font-weight:600; line-height:1.7; }
.empty .em{ font-size:44px; display:block; margin-bottom:10px; }
.hist-item{ display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line); font-size:14px; }
.hist-item:last-child{ border-bottom:none; }
.hist-item .hm{ font-weight:800; }
.hist-item .hs{ color:var(--prim-strong); font-weight:800; }
.hist-item .hd{ margin-left:auto; color:var(--sub); font-size:12.5px; font-weight:600; }
.cntb{ min-width:26px; height:24px; padding:0 8px; border-radius:99px; background:var(--bad-bg); color:var(--bad); font-size:12.5px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; flex:none; }

/* 탭 */
.tabs{ display:flex; gap:8px; margin-bottom:14px; }
.tabs button{ flex:1; min-height:46px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); color:var(--sub); font-size:15px; font-weight:800; cursor:pointer; }
.tabs button.sel{ background:var(--prim); border-color:var(--prim); color:#fff; }

/* 토스트 */
.toast{
  position:fixed; left:50%; bottom:34px; transform:translateX(-50%);
  background:var(--text); color:var(--bg); padding:11px 20px; border-radius:16px;
  font-size:14px; font-weight:700; z-index:999;
  max-width:calc(100vw - 40px); width:max-content; text-align:center;
  word-break:keep-all; overflow-wrap:break-word; line-height:1.5;
  animation:toastio 2.2s ease forwards; pointer-events:none;
}
@keyframes toastio{ 0%{opacity:0; transform:translate(-50%,10px);} 12%{opacity:1; transform:translate(-50%,0);} 85%{opacity:1;} 100%{opacity:0;} }

@media (min-width:560px){
  main{ padding-left:22px; padding-right:22px; }
  .tiles{ grid-template-columns:1fr 1fr 1fr; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="btnBack" class="iconbtn" aria-label="뒤로 가기" hidden>◀</button>
    <div id="hTitle">
      <div class="ht1" id="hT1">마석고 어휘 학습</div>
      <div class="ht2" id="hT2">2학년 자기주도학습</div>
    </div>
    <button id="btnTheme" class="iconbtn" aria-label="화면 테마 전환">🌙</button>
  </header>
  <main id="main"><div class="empty"><span class="em">📚</span>단어장을 불러오는 중이에요…</div></main>
</div>

<script src="vocab-data/manifest.js"></script>
<script>
'use strict';
/* ============================================================
   마석고 2학년 · 어휘 자기주도학습 앱
   단어 데이터는 vocab-data/ 폴더의 lessonXX.js 파일에 있습니다.
   ============================================================ */

// ---------- 유틸 ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, Math.min(n, a.length));
const pad2 = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}.${pad2(d.getMonth()+1)}.${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

const POS = {
  'n.':   { k:'명', name:'명사',   cls:'pn' },
  'v.':   { k:'동', name:'동사',   cls:'pv' },
  'a.':   { k:'형', name:'형용사', cls:'pa' },
  'ad.':  { k:'부', name:'부사',   cls:'pd' },
  'prep.':{ k:'전', name:'전치사', cls:'pp' },
  'phr.': { k:'숙', name:'숙어',   cls:'ph' }
};
function posBadge(p){ const i = POS[p]; return i ? `<span class="pos ${i.cls}" title="${i.name}">${i.k}</span>` : ''; }
function posName(p){ return (POS[p] || {}).name || ''; }

function sayBtn(text, mini){ return `<button class="say${mini?' mini':''}" data-say="${esc(text)}" aria-label="발음 듣기">🔊</button>`; }

// 예문에서 표제어 강조 (변화형·구동사 일부 대응)
function hlExample(ex, word){
  const rx = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  let m = ex.match(new RegExp(`\\b${rx(word)}`, 'i'));
  if (!m) {
    const tokens = word.split(/\s+/).filter(t => t.length >= 4).sort((a,b) => b.length - a.length);
    for (const t of tokens) {
      const mm = ex.match(new RegExp(`\\b${rx(t)}[a-z]*`, 'i'));
      if (mm) { m = mm; break; }
    }
  }
  if (!m) {
    const first = word.split(/\s+/)[0];
    m = ex.match(new RegExp(`\\b${rx(first)}[a-z]*`, 'i'));
  }
  if (!m) return esc(ex);
  const s = m.index, e = m.index + m[0].length;
  return esc(ex.slice(0, s)) + '<mark>' + esc(ex.slice(s, e)) + '</mark>' + esc(ex.slice(e));
}

function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2300);
}

function confetti(){
  const ems = ['🎉','✨','🎊','⭐','💜','💙'];
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('span');
    s.className = 'cf'; s.textContent = ems[Math.floor(Math.random()*ems.length)];
    s.style.left = Math.random()*100 + 'vw';
    s.style.animationDuration = (1.6 + Math.random()*1.6) + 's';
    s.style.animationDelay = (Math.random()*.5) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 4000);
  }
}

// ---------- 저장소 ----------
const Store = {
  KEY: 'mshVocabV1',
  d: null,
  load(){
    try { this.d = JSON.parse(localStorage.getItem(this.KEY) || '{}'); } catch(e){ this.d = {}; }
    if (typeof this.d !== 'object' || !this.d) this.d = {};
    this.d.lessons = this.d.lessons || {};
    if (typeof this.d.name !== 'string') this.d.name = '';
  },
  save(){ try { localStorage.setItem(this.KEY, JSON.stringify(this.d)); } catch(e){} },
  lesson(id){
    const ls = this.d.lessons;
    if (!ls[id]) ls[id] = {};
    const L = ls[id];
    L.known = L.known || {}; L.wrong = L.wrong || {}; L.history = L.history || [];
    return L;
  },
  addHistory(id, mode, score, total){
    const L = this.lesson(id);
    L.history.unshift({ m: mode, s: score, t: total, d: fmtDate(new Date()) });
    if (L.history.length > 40) L.history.length = 40;
    this.save();
  },
  set(key, val){ this.d.set = this.d.set || {}; this.d.set[key] = val; this.save(); },
  get(key, dflt){ return (this.d.set && key in this.d.set) ? this.d.set[key] : dflt; }
};

function markRight(lesson, w){
  const L = Store.lesson(lesson.id);
  if (L.wrong[w.w]) delete L.wrong[w.w];
  L.known[w.w] = 1;
  Store.save();
}
function markWrong(lesson, w){
  const L = Store.lesson(lesson.id);
  L.wrong[w.w] = (L.wrong[w.w] || 0) + 1;
  delete L.known[w.w];
  Store.save();
}

// ---------- 발음 (TTS) ----------
const TTS = {
  ok: 'speechSynthesis' in window,
  voice: null,
  init(){
    if (!this.ok) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices();
      this.voice =
        vs.find(v => /en[-_]US/i.test(v.lang) && /google/i.test(v.name)) ||
        vs.find(v => /en[-_]US/i.test(v.lang)) ||
        vs.find(v => /^en/i.test(v.lang)) || null;
    };
    pick();
    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = pick;
  },
  _t: null,
  speak(text){
    if (!this.ok || !text) return;
    try {
      clearTimeout(this._t);
      const u = new SpeechSynthesisUtterance(text);
      if (this.voice) u.voice = this.voice;
      u.lang = 'en-US'; u.rate = 0.95;
      if (speechSynthesis.speaking || speechSynthesis.pending) {
        // 크롬은 cancel() 직후 같은 틱의 speak()를 간헐적으로 무시함 → 잠깐 뒤에 발화
        speechSynthesis.cancel();
        this._t = setTimeout(() => { try { speechSynthesis.speak(u); } catch(e){} }, 80);
      } else {
        speechSynthesis.speak(u);
      }
    } catch(e){}
  },
  stop(){ clearTimeout(this._t); if (this.ok) try { speechSynthesis.cancel(); } catch(e){} }
};

// ---------- 효과음 ----------
const Sfx = {
  ctx: null,
  get(){
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{});
    return this.ctx;
  },
  tone(freq, delay, dur, type, gain){
    const c = this.get(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(gain || .1, c.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + delay + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + delay); o.stop(c.currentTime + delay + dur + .02);
  },
  good(){ try { this.tone(660, 0, .1); this.tone(920, .09, .14); } catch(e){} },
  bad(){ try { this.tone(190, 0, .2, 'square', .06); if (navigator.vibrate) navigator.vibrate(70); } catch(e){} }
};

// ---------- 화면 전환 ----------
const App = { lessons: [], cleanup: null };
const Nav = {
  stack: [],
  _peT: null,
  _render(){
    if (App.cleanup) { try { App.cleanup(); } catch(e){} App.cleanup = null; }
    TTS.stop();
    const top = this.stack[this.stack.length - 1];
    top.fn();
    $('#btnBack').hidden = this.stack.length <= 1;
    window.scrollTo(0, 0);
    // 화면 전환 직후 잠깐 터치 무시: 더블탭의 두 번째 탭이
    // 새 화면의 버튼(퀴즈 보기 등)을 잘못 누르는 사고 방지
    const mEl = $('#main');
    mEl.style.pointerEvents = 'none';
    clearTimeout(this._peT);
    this._peT = setTimeout(() => { mEl.style.pointerEvents = ''; }, 260);
  },
  go(fn){ this.stack.push({ fn }); try { history.pushState({ n: this.stack.length }, ''); } catch(e){} this._render(); },
  replace(fn){ this.stack[this.stack.length - 1] = { fn }; this._render(); },
  back(){ history.back(); },
  popTo(len){
    len = Math.max(1, len);
    if (this.stack.length > len) this.stack.length = len;
    this._render();
  },
  // 결과/종료 화면에서 레슨 메뉴(스택 2단계)로: 히스토리를 함께 되감아 동기 유지
  toMenu(){
    const d = this.stack.length - 2;
    if (d > 0) { try { history.go(-d); return; } catch(e){} }
    this.popTo(2);
  },
  reset(fn){ this.stack = [{ fn }]; this._render(); }
};
// popstate는 뒤로/앞으로 모두에서 발생 → 저장해 둔 state.n으로 방향을 구분한다.
// 앞으로 가기(n ≥ 현재 스택)는 무시해 화면이 엉뚱하게 뒤로 가는 오동작을 막는다.
window.addEventListener('popstate', e => {
  const n = (e.state && e.state.n) || 1;
  if (n < Nav.stack.length) Nav.popTo(n);
});
try { history.replaceState({ n: 1 }, ''); } catch(e){}
$('#btnBack').addEventListener('click', () => Nav.back());

function renderList(ls){
  setHeader('단어장 보기', `${ls.title} · ${ls.words.length}단어`);
  let hideMode = ''; // '' | 'mean' | 'word'
  let query = '';
  let openNo = 0;

  const m = render(`
    <div class="list-ctrl">
      <input class="tin" id="q" type="search" placeholder="🔍 단어·뜻 검색" autocomplete="off">
      <button class="tgl" id="hm">뜻 가리기</button>
      <button class="tgl" id="hw">단어 가리기</button>
    </div>
    <div id="rows"></div>
  `);

  const rowsEl = $('#rows');
  const L = Store.lesson(ls.id);

  function familyChips(w){
    if (!w.f || !w.f.length) return '';
    return `<div class="chips left">${w.f.map(f =>
      `<button class="chip" data-say="${esc(f[0].replace(/\s*\(.*\)|\s*\+.*$/g,'') || f[0])}">${esc(f[0])} ${f[1] ? posBadge(f[1]) : ''} <span class="cm">${esc(f[2])}</span></button>`
    ).join('')}</div>`;
  }

  function draw(){
    const q = query.trim().toLowerCase();
    const list = ls.words.filter(w => !q || w.w.toLowerCase().includes(q) || w.m.toLowerCase().includes(q));
    if (!list.length) { rowsEl.innerHTML = `<div class="empty"><span class="em">🔍</span>검색 결과가 없어요</div>`; return; }
    rowsEl.innerHTML = list.map(w => {
      const open = openNo === w.no;
      const revealed = open; // 가리기 모드에서 열면 공개
      return `
      <div class="wrow" data-no="${w.no}" role="button" tabindex="0" aria-expanded="${open}">
        <div class="top">
          <span class="no">${w.no}</span>
          <span class="ww ${hideMode==='word' && !revealed ? 'masked' : ''}">${esc(w.w)}</span>
          ${posBadge(w.p)}
          ${L.known[w.w] ? '<span class="kn">✔</span>' : ''}
          <span class="wm ${hideMode==='mean' && !revealed ? 'masked' : ''}">${esc(w.m)}</span>
        </div>
        ${open ? `
        <div class="wdetail">
          <div style="display:flex;align-items:center;gap:8px;">
            ${sayBtn(w.w, true)}<b style="color:var(--text);font-size:15px;">${esc(w.w)}</b>
          </div>
          <div class="ex">${hlExample(w.ex, w.w)}</div>
          ${w.note ? `<div class="fc-note">💡 ${esc(w.note)}</div>` : ''}
          ${familyChips(w)}
        </div>` : ''}
      </div>`;
    }).join('');

    rowsEl.querySelectorAll('.wrow').forEach(el => {
      const toggle = () => { const no = +el.dataset.no; openNo = (openNo === no) ? 0 : no; draw(); };
      el.addEventListener('click', e => {
        if (e.target.closest('[data-say]')) return;
        toggle();
      });
      el.addEventListener('keydown', e => {
        if ((e.key === 'Enter' || e.key === ' ') && e.target === el) { e.preventDefault(); toggle(); }
      });
    });
    // 재렌더 후 열린 행으로 포커스 복원 (크롬북 키보드 탐색 지원)
    if (openNo) { const f = rowsEl.querySelector(`.wrow[data-no="${openNo}"]`); if (f) f.focus(); }
  }

  $('#q').addEventListener('input', e => { query = e.target.value; openNo = 0; draw(); });
  $('#hm').addEventListener('click', () => {
    hideMode = hideMode === 'mean' ? '' : 'mean'; openNo = 0;
    $('#hm').classList.toggle('on', hideMode === 'mean'); $('#hw').classList.remove('on');
    draw();
  });
  $('#hw').addEventListener('click', () => {
    hideMode = hideMode === 'word' ? '' : 'word'; openNo = 0;
    $('#hw').classList.toggle('on', hideMode === 'word'); $('#hm').classList.remove('on');
    draw();
  });
  draw();
}

function segHTML(key, opts, cur){
  return `<div class="seg" data-key="${key}">
    ${opts.map(o => `<button data-v="${o.v}" class="${String(o.v)===String(cur)?'sel':''}">${o.t}</button>`).join('')}
  </div>`;
}
function wireSegs(root, cfg){
  root.querySelectorAll('.seg').forEach(seg => {
    seg.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      seg.querySelectorAll('button').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      cfg[seg.dataset.key] = b.dataset.v;
    });
  });
}
function scopePool(ls, scope){
  const L = Store.lesson(ls.id);
  if (scope === 'unknown') return ls.words.filter(w => !L.known[w.w]);
  return ls.words.slice();
}
function countOf(v, poolLen){ return v === 'all' ? poolLen : Math.min(+v, poolLen); }

function renderFlashSetup(ls){
  setHeader('플래시카드', ls.title);
  const cfg = {
    scope: Store.get('flScope', 'all'),
    order: Store.get('flOrder', 'shuffle'),
    front: Store.get('flFront', 'en')
  };
  const unknownN = scopePool(ls, 'unknown').length;
  const m = render(`
    <div class="card" style="text-align:center;padding:22px;">
      <div style="font-size:38px;">🃏</div>
      <b style="font-size:18px;">카드를 넘기며 암기해요</b>
      <div style="font-size:13.5px;color:var(--sub);margin-top:6px;line-height:1.5;">카드를 탭하면 뒷면(뜻·파생어·예문)이 보여요.<br>다 보고 나서 <b>외웠어요 / 아직이에요</b>를 골라 주세요.</div>
    </div>
    <div class="lbl">범위</div>
    ${segHTML('scope', [{v:'all',t:`전체 (${ls.words.length})`},{v:'unknown',t:`아직 못 외운 단어 (${unknownN})`}], cfg.scope)}
    <div class="lbl">순서</div>
    ${segHTML('order', [{v:'shuffle',t:'랜덤 섞기'},{v:'no',t:'번호순'}], cfg.order)}
    <div class="lbl">카드 앞면</div>
    ${segHTML('front', [{v:'en',t:'영어 단어'},{v:'ko',t:'우리말 뜻'},{v:'mix',t:'랜덤'}], cfg.front)}
    <div style="margin-top:20px;"><button class="btn" id="go">시작하기 →</button></div>
  `);
  wireSegs(m, cfg);
  $('#go').addEventListener('click', () => {
    const pool = scopePool(ls, cfg.scope);
    if (!pool.length) { toast('이 범위에는 단어가 없어요! 이미 다 외웠네요 🎉'); return; }
    Store.set('flScope', cfg.scope); Store.set('flOrder', cfg.order); Store.set('flFront', cfg.front);
    const deck = cfg.order === 'shuffle' ? shuffle(pool) : pool.slice();
    Nav.go(() => renderFlashRun(ls, deck, cfg.front));
  });
}

function renderFlashRun(ls, deck, front){
  setHeader('플래시카드', ls.title);
  let i = 0, knownN = 0;
  const missed = [];

  function faceFront(w){
    const f = front === 'mix' ? (Math.random() < .5 ? 'en' : 'ko') : front;
    if (f === 'en') return `
      <div class="fc-sub">${posBadge(w.p)} <span style="margin-left:4px;">#${w.no}</span></div>
      <div class="fc-word">${esc(w.w)}</div>
      <div>${sayBtn(w.w)}</div>
      <div class="taphint">카드를 탭하면 뜻이 보여요 👆</div>`;
    return `
      <div class="fc-sub">${posBadge(w.p)} <span style="margin-left:4px;">#${w.no}</span></div>
      <div class="fc-mean">${esc(w.m)}</div>
      <div class="taphint">카드를 탭하면 단어가 보여요 👆</div>`;
  }
  function faceBack(w){
    const fam = (w.f && w.f.length)
      ? `<div class="chips">${w.f.map(f => `<span class="chip" style="cursor:default;">${esc(f[0])} ${f[1]?posBadge(f[1]):''} <span class="cm">${esc(f[2])}</span></span>`).join('')}</div>` : '';
    return `<div class="back-scroll">
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px;">
        <span class="fc-word" style="font-size:clamp(22px,6vw,30px);">${esc(w.w)}</span>${sayBtn(w.w, true)}
      </div>
      <div class="fc-mean" style="font-size:clamp(18px,5vw,24px);">${posBadge(w.p)} ${esc(w.m)}</div>
      ${w.note ? `<div class="fc-note">💡 ${esc(w.note)}</div>` : ''}
      ${fam}
      <div class="fc-ex">${hlExample(w.ex, w.w)}</div>
    </div>`;
  }

  function draw(){
    if (i >= deck.length) return end();
    const w = deck[i];
    const m = render(`
      <div class="quiz-top"><div>${i+1} / ${deck.length}</div><div class="qscore">✅ ${knownN}</div></div>
      <div class="pbar slim"><i style="width:${(i/deck.length)*100}%"></i></div>
      <div class="flip" id="card" role="button" tabindex="0" aria-label="카드 뒤집기">
        <div class="flip-inner">
          <div class="face">${faceFront(w)}</div>
          <div class="face back">${faceBack(w)}</div>
        </div>
      </div>
      <div class="flash-btns">
        <button class="btn no" id="no">❌ 아직이에요</button>
        <button class="btn yes" id="yes">✅ 외웠어요</button>
      </div>
    `);
    const card = $('#card');
    const flip = () => card.classList.toggle('flipped');
    card.addEventListener('click', e => { if (e.target.closest('[data-say]')) return; flip(); });
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
    $('#yes').addEventListener('click', () => { markRight(ls, w); knownN++; i++; draw(); });
    $('#no').addEventListener('click', () => {
      const L = Store.lesson(ls.id); delete L.known[w.w]; Store.save();
      missed.push(w); i++; draw();
    });
  }

  function end(){
    Store.addHistory(ls.id, '플래시카드', knownN, deck.length);
    Nav.replace(() => {
      setHeader('플래시카드 완료', ls.title);
      const m = render(`
        <div class="card result">
          <div style="font-size:44px;">${missed.length ? '💪' : '🏆'}</div>
          <div class="score-big">${knownN}<small> / ${deck.length}</small></div>
          <div class="score-msg">${missed.length ? `${missed.length}개는 다시 도전해 봐요!` : '전부 외웠어요! 최고예요!'}</div>
        </div>
        ${missed.length ? `<div class="lbl">아직 못 외운 단어</div>
        <div class="card wrong-list">${missed.map(w => `
          <div class="wrong-item">${sayBtn(w.w, true)}<span class="w">${esc(w.w)}</span>${posBadge(w.p)}<span class="m">${esc(w.m)}</span></div>`).join('')}
        </div>` : ''}
        <div style="margin-top:16px;display:flex;flex-direction:column;gap:10px;">
          ${missed.length ? `<button class="btn" id="again">📒 못 외운 것만 다시 (${missed.length})</button>` : ''}
          <button class="btn ghost" id="menu">학습 메뉴로</button>
        </div>
      `);
      if (!missed.length) confetti();
      const ag = $('#again');
      if (ag) ag.addEventListener('click', () => Nav.replace(() => renderFlashRun(ls, shuffle(missed), front)));
      $('#menu').addEventListener('click', () => Nav.toMenu());
    });
  }
  draw();
}

// ============================================================
// 퀴즈 공통 러너 (뜻 맞히기 · 품사 변신에서 사용)
// 질문: { prompt, options[], answer, info, word }
// ============================================================
function runQuiz(ls, qs, meta){
  // meta: { title, sub, label, wrongReview, retryAll(), retryWrong(list) }
  setHeader(meta.title, meta.sub);
  let i = 0, correct = 0;
  const wrongs = [];
  let timer = null;
  const offs = [];
  App.cleanup = () => { if (timer) clearTimeout(timer); offs.forEach(f => f()); };

  function onKey(fn){ document.addEventListener('keydown', fn); offs.push(() => document.removeEventListener('keydown', fn)); }

  function draw(){
    if (i >= qs.length) return finish();
    const Q = qs[i];
    const m = render(`
      <div class="quiz-top"><div>${i+1} / ${qs.length}</div><div class="qscore">✔ ${correct}</div></div>
      <div class="pbar slim"><i style="width:${(i/qs.length)*100}%"></i></div>
      <div class="card qcard">${Q.prompt}</div>
      <div class="opts">
        ${Q.options.map((o, k) => `
          <button class="opt" data-k="${k}"><span class="opt-n">${k+1}</span><span class="opt-t">${esc(o)}</span></button>`).join('')}
      </div>
      <div id="fb"></div>
    `);
    let answered = false;
    const optEls = [...m.querySelectorAll('.opt')];

    function answer(k){
      if (answered) return;
      answered = true;
      optEls.forEach((el, idx) => {
        el.disabled = true;
        if (idx === Q.answer) el.classList.add('is-ok');
        else if (idx === k) el.classList.add('is-bad');
        else el.classList.add('dim');
      });
      if (k === Q.answer) {
        correct++; Sfx.good();
        markRight(ls, Q.word);
        $('#fb').innerHTML = `<div class="fbp ok">정답이에요! 🎉</div>`;
        timer = setTimeout(next, 850);
      } else {
        Sfx.bad();
        markWrong(ls, Q.word);
        wrongs.push(Q.word);
        $('#fb').innerHTML = `<div class="fbp bad">${Q.info}<button class="btn slim" id="nx">다음 문제 →</button></div>`;
        $('#nx').addEventListener('click', next);
      }
    }
    optEls.forEach(el => el.addEventListener('click', e => {
      if (e.target.closest('[data-say]')) return;
      answer(+el.dataset.k);
    }));
    onKey(function h(e){
      if (e.repeat) return; // 키를 꾹 눌렀을 때 반복 입력으로 피드백을 건너뛰는 것 방지
      if (i >= qs.length) return;
      if (!answered && ['1','2','3','4'].includes(e.key)) { const k = +e.key - 1; if (k < optEls.length) answer(k); }
      else if (answered && (e.key === 'Enter' || e.key === ' ')) { const nx = $('#nx'); if (nx) { e.preventDefault(); next(); } }
    });
  }

  function next(){
    if (timer) { clearTimeout(timer); timer = null; }
    offs.splice(0).forEach(f => f());
    i++;
    draw();
  }

  function finish(){
    Store.addHistory(ls.id, meta.label, correct, qs.length);
    const res = { correct, total: qs.length, wrongs };
    Nav.replace(() => renderResult(ls, res, meta));
  }
  draw();
}

function renderResult(ls, res, meta){
  setHeader('결과', meta.sub);
  const pct = Math.round(res.correct / res.total * 100);
  const msg = pct >= 90 ? '완벽해요! 🏆' : pct >= 70 ? '잘했어요! 💪' : pct >= 50 ? '조금만 더! 📚' : '다시 도전해 봐요! 🌱';
  const uniqWrongs = [...new Map(res.wrongs.map(w => [w.w, w])).values()];
  render(`
    <div class="card result">
      <div style="font-size:15px;color:var(--sub);font-weight:800;">${esc(meta.label)}</div>
      <div class="score-big">${res.correct}<small> / ${res.total}</small></div>
      <div class="score-pct">정답률 ${pct}%</div>
      <div class="score-msg">${msg}</div>
    </div>
    ${uniqWrongs.length ? `
    <div class="lbl">틀린 단어 (${uniqWrongs.length})</div>
    <div class="card wrong-list">
      ${uniqWrongs.map(w => `<div class="wrong-item">${sayBtn(w.w, true)}<span class="w">${esc(w.w)}</span>${posBadge(w.p)}<span class="m">${esc(w.m)}</span></div>`).join('')}
    </div>` : ''}
    <div style="margin-top:16px;display:flex;flex-direction:column;gap:10px;">
      ${uniqWrongs.length ? `<button class="btn" id="rw">📒 틀린 것만 다시 (${uniqWrongs.length})</button>` : ''}
      <button class="btn soft" id="ra">🔁 한 번 더</button>
      <button class="btn ghost" id="menu">학습 메뉴로</button>
    </div>
  `);
  if (pct >= 90 && res.total >= 5) confetti();
  const rw = $('#rw');
  if (rw) rw.addEventListener('click', () => meta.retryWrong(uniqWrongs));
  $('#ra').addEventListener('click', () => meta.retryAll());
  $('#menu').addEventListener('click', () => Nav.toMenu());
}

// ============================================================
// 뜻 맞히기 퀴즈
// ============================================================
function tokensOf(m){ return m.split(/[,;·()~\s]+/).filter(t => t.length > 0); }
// 두 뜻이 겹쳐 보이는지 검사: 토큰 완전 일치뿐 아니라
// 포함 관계('소유'/'소유권')도 겹침으로 판정해 정답이 2개처럼 보이는 보기를 막는다
function meaningOverlap(a, b){
  const A = tokensOf(a), B = tokensOf(b);
  return B.some(t => A.some(s =>
    s === t || (s.length > 1 && t.length > 1 && (s.startsWith(t) || t.startsWith(s)))
  ));
}

function buildMeaningQs(ls, pool, dir, count){
  const chosen = sample(pool, count);
  return chosen.map(w => {
    const d = dir === 'mix' ? (Math.random() < .5 ? 'ek' : 'ke') : dir;
    const others = ls.words.filter(x => x.w !== w.w && x.m !== w.m && !meaningOverlap(x.m, w.m));
    const samePos = others.filter(x => x.p === w.p);
    const rest = others.filter(x => x.p !== w.p);
    let picks = shuffle(samePos).concat(shuffle(rest)).slice(0, 3);
    if (picks.length < 3) {
      // 단어 수가 적은 레슨 대비: 뜻 겹침 필터를 완화해서라도 보기 4개를 유지
      const fill = ls.words.filter(x => x.w !== w.w && x.m !== w.m && !picks.includes(x));
      picks = picks.concat(shuffle(fill)).slice(0, 3);
    }
    const famLine = (w.f && w.f.length)
      ? `<div class="fb-note">🔄 ${w.f.slice(0, 3).map(f => `${esc(f[0])} ${f[1] ? '('+esc(f[1])+' '+esc(f[2])+')' : '('+esc(f[2])+')'}`).join(' · ')}</div>` : '';
    const info = `
      <div style="font-size:13px;color:var(--sub);font-weight:700;">정답</div>
      <div class="fb-word">${esc(w.w)} ${sayBtn(w.w, true)}</div>
      <div class="fb-mean">${posBadge(w.p)} ${esc(w.m)}</div>
      ${famLine}`;
    if (d === 'ek') {
      const opts = shuffle([w, ...picks].map(x => x.m));
      return {
        prompt: `<div class="q-ask">알맞은 뜻을 골라 보세요</div>
                 <div class="q-word">${esc(w.w)}</div>
                 <div>${posBadge(w.p)} ${sayBtn(w.w)}</div>`,
        options: opts, answer: opts.indexOf(w.m), info, word: w
      };
    } else {
      const opts = shuffle([w, ...picks].map(x => x.w));
      return {
        prompt: `<div class="q-ask">알맞은 영어 단어를 골라 보세요</div>
                 <div class="q-mean">${esc(w.m)}</div>
                 <div>${posBadge(w.p)}</div>`,
        options: opts, answer: opts.indexOf(w.w), info, word: w
      };
    }
  });
}

function startMeaningQuiz(ls, pool, dir, count, isRetry){
  const dirLabel = dir === 'ek' ? '영→한' : dir === 'ke' ? '한→영' : '혼합';
  const meta = {
    title: '뜻 맞히기', sub: `${ls.title} · ${dirLabel}`,
    label: `뜻 맞히기(${dirLabel})`,
    retryAll: () => startMeaningQuizReplace(ls, pool, dir, count),
    retryWrong: ws => startMeaningQuizReplace(ls, ws, dir, ws.length)
  };
  const qs = buildMeaningQs(ls, pool, dir, count);
  const run = () => runQuiz(ls, qs, meta);
  isRetry ? Nav.replace(run) : Nav.go(run);
}
function startMeaningQuizReplace(ls, pool, dir, count){
  startMeaningQuiz(ls, pool, dir, count, true);
}

function renderSpellRun(ls, words, type, isRetry){
  const typeLabel = type === 'listen' ? '듣고 받아쓰기' : '뜻 보고 쓰기';
  setHeader('스펠링 연습', `${ls.title} · ${typeLabel}`);
  let i = 0, correct = 0, hints = 0;
  const wrongs = [];
  const offs = [];
  App.cleanup = () => offs.forEach(f => f());
  function onKey(fn){ document.addEventListener('keydown', fn); offs.push(() => document.removeEventListener('keydown', fn)); }

  const norm = s => s.toLowerCase().replace(/\s+/g, ' ').trim();

  function patHTML(w, reveal){
    let letterIdx = 0;
    return w.w.split('').map(ch => {
      if (ch === ' ') return '&nbsp;&nbsp;';
      const shown = letterIdx < reveal;
      letterIdx++;
      return shown ? `<b>${esc(ch)}</b>` : '_';
    }).join(' ');
  }

  function draw(){
    if (i >= words.length) return finish();
    const w = words[i];
    const letters = w.w.replace(/\s/g, '').length;
    const maxHint = Math.ceil(letters / 2);
    hints = 0;
    let answered = false;

    const promptHTML = type === 'listen'
      ? `<div class="q-ask">발음을 듣고 철자를 입력하세요</div>
         <button class="bigsay" data-say="${esc(w.w)}" aria-label="다시 듣기">🔊</button>
         <div style="font-size:12.5px;color:var(--sub);font-weight:600;">버튼을 누르면 다시 들을 수 있어요</div>
         <button class="tgl" id="showMean" style="min-height:36px;font-size:12.5px;">🙉 소리가 안 나요 · 뜻 보기</button>`
      : `<div class="q-ask">뜻에 맞는 영어를 입력하세요</div>
         <div class="q-mean">${esc(w.m)}</div>
         <div>${posBadge(w.p)}</div>`;

    const m = render(`
      <div class="quiz-top"><div>${i+1} / ${words.length}</div><div class="qscore">✔ ${correct}</div></div>
      <div class="pbar slim"><i style="width:${(i/words.length)*100}%"></i></div>
      <div class="card qcard">${promptHTML}<div class="pat" id="pat">${patHTML(w, 0)}</div></div>
      <input class="tin" id="inp" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="여기에 입력하세요" aria-label="철자 입력">
      <div class="spell-btns">
        <button class="btn ghost slim" id="hint">💡 힌트</button>
        <button class="btn ghost slim" id="skip">🤔 모르겠어요</button>
        <button class="btn slim" id="chk">확인</button>
      </div>
      <div id="fb"></div>
    `);
    const inp = $('#inp');
    if (type === 'listen') setTimeout(() => TTS.speak(w.w), 250);
    setTimeout(() => inp.focus(), 60);
    // TTS 보이스가 없는 기기 폴백: 뜻을 보고라도 풀 수 있게
    const sm = $('#showMean');
    if (sm) sm.addEventListener('click', () => {
      sm.outerHTML = `<div class="q-mean" style="font-size:clamp(17px,4.5vw,22px);">${esc(w.m)}</div>`;
      inp.focus();
    });

    function reveal(){
      if (hints >= maxHint) { toast('힌트를 다 썼어요! 조금만 더 생각해 봐요 💭'); return; }
      hints++;
      $('#pat').innerHTML = patHTML(w, hints);
      if (hints >= maxHint) $('#hint').disabled = true;
      inp.focus();
    }

    function feedback(okAns, userText){
      answered = true;
      inp.disabled = true;
      $('#hint').disabled = true; $('#skip').disabled = true; $('#chk').disabled = true;
      if (okAns) {
        correct++; Sfx.good(); markRight(ls, w);
        $('#fb').innerHTML = `
          <div class="fbp ok">정답이에요! 🎉
            <div class="fb-word">${esc(w.w)} ${sayBtn(w.w, true)}</div>
            <div class="fb-mean" style="color:var(--text);">${posBadge(w.p)} ${esc(w.m)}</div>
            <button class="btn slim" id="nx">다음 →</button>
          </div>`;
        if (type !== 'listen') TTS.speak(w.w);
      } else {
        Sfx.bad(); markWrong(ls, w); wrongs.push(w);
        $('#fb').innerHTML = `
          <div class="fbp bad">
            <div style="font-size:13px;color:var(--sub);font-weight:700;">정답은</div>
            <div class="fb-word">${esc(w.w)} ${sayBtn(w.w, true)}</div>
            <div class="fb-mean">${posBadge(w.p)} ${esc(w.m)}</div>
            ${userText ? `<div class="fb-note">내 답: <span class="typed">${esc(userText)}</span></div>` : ''}
            <button class="btn slim" id="nx">다음 →</button>
          </div>`;
        TTS.speak(w.w);
      }
      $('#nx').addEventListener('click', next);
    }

    $('#chk').addEventListener('click', () => {
      if (answered) return;
      const v = inp.value;
      if (!norm(v)) { toast('먼저 철자를 입력해 주세요 ✏️'); inp.focus(); return; }
      feedback(norm(v) === norm(w.w), v);
    });
    $('#skip').addEventListener('click', () => { if (!answered) feedback(false, ''); });
    $('#hint').addEventListener('click', reveal);

    onKey(function h(e){
      if (e.repeat) return; // Enter를 꾹 눌렀을 때 피드백을 건너뛰는 것 방지
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (!answered) $('#chk').click();
      else { const nx = $('#nx'); if (nx) next(); }
    });
  }

  function next(){
    offs.splice(0).forEach(f => f());
    i++;
    draw();
  }

  function finish(){
    Store.addHistory(ls.id, `스펠링(${typeLabel})`, correct, words.length);
    const meta = {
      title: '스펠링 연습', sub: `${ls.title} · ${typeLabel}`, label: `스펠링(${typeLabel})`,
      retryAll: () => Nav.replace(() => renderSpellRun(ls, shuffle(words), type, true)),
      retryWrong: ws => Nav.replace(() => renderSpellRun(ls, shuffle(ws), type, true))
    };
    Nav.replace(() => renderResult(ls, { correct, total: words.length, wrongs }, meta));
  }
  draw();
}

// ============================================================
// 품사 변신 (파생어)
// ============================================================
function familyQuizPool(ls){
  const qs = [];
  const MAIN = ['n.','v.','a.','ad.'];
  for (const w of ls.words) {
    if (w.fq === false) continue;
    if (!MAIN.includes(w.p)) continue;
    const cands = (w.f || []).filter(e =>
      e[3] !== 0 && e[0] !== w.w && MAIN.includes(e[1]) && e[1] !== w.p && !/동의어/.test(e[2])
    );
    // 괄호가 붙은 파생어(예: "specialize (in)")는 보기로 쓰기 어색하므로 퀴즈에서 제외
    const clean = cands.filter(e => !/[()]/.test(e[0]));
    const byPos = {};
    clean.forEach(e => { (byPos[e[1]] = byPos[e[1]] || []).push(e); });
    for (const p in byPos) {
      if (byPos[p].length === 1) qs.push({ base: w, target: byPos[p][0], tpos: p });
    }
  }
  return qs;
}

function renderFamily(ls){
  setHeader('품사 변신', ls.title);
  let tab = 'study';
  const famWords = ls.words.filter(w => w.f && w.f.length);
  const quizPool = familyQuizPool(ls);
  const cfg = { count: Store.get('fmCount', '10') };

  function draw(){
    const m = render(`
      <div class="tabs">
        <button data-t="study" class="${tab==='study'?'sel':''}">📚 파생어 한눈에</button>
        <button data-t="quiz" class="${tab==='quiz'?'sel':''}">🎯 변신 퀴즈</button>
      </div>
      ${tab === 'study' ? `
        <div style="font-size:13px;color:var(--sub);font-weight:600;margin:2px 2px 10px;line-height:1.5;">
          단어장에 명사로 나온 단어도 동사·형용사로 변신해요!<br>칩을 탭하면 발음을 들을 수 있어요 🔊
        </div>
        ${famWords.map(w => `
          <div class="card" style="margin-bottom:10px;padding:14px 16px;">
            <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;">
              <b style="font-size:17px;">${esc(w.w)}</b>${posBadge(w.p)}
              <span style="color:var(--sub);font-size:14px;font-weight:600;">${esc(w.m)}</span>
              ${sayBtn(w.w, true)}
            </div>
            <div class="chips left" style="margin-top:10px;">
              ${w.f.map(f => `<button class="chip" data-say="${esc(f[0].replace(/\s*\([^)]*\)/g,'').replace(/\s*\+.*$/,''))}">${esc(f[0])} ${f[1]?posBadge(f[1]):''} <span class="cm">${esc(f[2])}</span></button>`).join('')}
            </div>
            ${w.note ? `<div class="fc-note" style="margin-top:9px;">💡 ${esc(w.note)}</div>` : ''}
          </div>`).join('')}
      ` : `
        <div class="card" style="text-align:center;padding:22px;">
          <div style="font-size:38px;">🎯</div>
          <b style="font-size:18px;">품사 변신 퀴즈</b>
          <div style="font-size:13.5px;color:var(--sub);margin-top:6px;line-height:1.5;">단어의 <b>다른 품사형</b>을 고르는 퀴즈예요.<br>총 ${quizPool.length}문제가 준비되어 있어요.</div>
        </div>
        <div class="lbl">문항 수</div>
        ${segHTML('count', [{v:'10',t:'10문제'},{v:'20',t:'20문제'},{v:'all',t:'전체'}], cfg.count)}
        <div style="margin-top:20px;"><button class="btn" id="go">시작하기 →</button></div>
      `}
    `);
    m.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.t; draw(); }));
    if (tab === 'quiz') {
      wireSegs(m, cfg);
      $('#go').addEventListener('click', () => {
        if (!quizPool.length) { toast('퀴즈로 낼 파생어가 없어요'); return; }
        Store.set('fmCount', cfg.count);
        startFamilyQuiz(ls, quizPool, countOf(cfg.count, quizPool.length), false);
      });
    }
  }
  draw();
}

function buildFamilyQs(ls, pool, count){
  const chosen = sample(pool, count);
  // 품사별 보기 후보 (전체 파생어 + 표제어)
  const byPos = { 'n.':new Set(), 'v.':new Set(), 'a.':new Set(), 'ad.':new Set() };
  for (const w of ls.words) {
    if (byPos[w.p] && !/[()\s]/.test(w.w)) byPos[w.p].add(w.w);
    (w.f || []).forEach(e => { if (byPos[e[1]] && !/[()]/.test(e[0])) byPos[e[1]].add(e[0]); });
  }
  return chosen.map(q => {
    const famSet = new Set([q.base.w, ...(q.base.f || []).map(e => e[0])]);
    let cands = [...byPos[q.tpos]].filter(x => !famSet.has(x) && x !== q.target[0]);
    if (cands.length < 3) {
      const extra = Object.values(byPos).flatMap(s => [...s]).filter(x => !famSet.has(x) && x !== q.target[0]);
      cands = [...new Set(cands.concat(extra))];
    }
    const opts = shuffle([q.target[0], ...sample(cands, 3)]);
    const famAll = (q.base.f || []).map(f => `${esc(f[0])} ${f[1] ? '('+esc(f[1])+' '+esc(f[2])+')' : '('+esc(f[2])+')'}`).join(' · ');
    return {
      prompt: `
        <div class="q-ask"><b>${esc(q.base.w)}</b> ${posBadge(q.base.p)} <span style="font-weight:600;">${esc(q.base.m)}</span></div>
        <div class="q-ask" style="font-size:18px;margin-top:4px;">이 단어의 <b>${posName(q.tpos)}형</b>은?</div>`,
      options: opts,
      answer: opts.indexOf(q.target[0]),
      info: `
        <div style="font-size:13px;color:var(--sub);font-weight:700;">정답</div>
        <div class="fb-word">${esc(q.target[0])} ${sayBtn(q.target[0], true)}</div>
        <div class="fb-mean">${posBadge(q.tpos)} ${esc(q.target[2])}</div>
        <div class="fb-note">🔄 ${esc(q.base.w)}의 가족: ${famAll}</div>`,
      word: q.base
    };
  });
}

function startFamilyQuiz(ls, pool, count, isRetry){
  const meta = {
    title: '품사 변신 퀴즈', sub: ls.title, label: '품사 변신',
    retryAll: () => startFamilyQuiz(ls, pool, count, true),
    retryWrong: ws => {
      const wrongPool = pool.filter(q => ws.some(w => w.w === q.base.w));
      startFamilyQuiz(ls, wrongPool.length ? wrongPool : pool, wrongPool.length || count, true);
    }
  };
  const qs = buildFamilyQs(ls, pool, count);
  const run = () => runQuiz(ls, qs, meta);
  isRetry ? Nav.replace(run) : Nav.go(run);
}

// 오답 노트
// ============================================================
function renderWrong(ls){
  setHeader('오답 노트', ls.title);
  const L = Store.lesson(ls.id);
  const items = ls.words
    .filter(w => L.wrong[w.w])
    .sort((a, b) => L.wrong[b.w] - L.wrong[a.w]);

  if (!items.length) {
    const m = render(`
      <div class="empty">
        <span class="em">🎉</span>
        오답 노트가 비어 있어요!<br>퀴즈에서 틀린 단어가 자동으로 이곳에 모여요.
      </div>
      <button class="btn soft" id="goQuiz">✅ 뜻 맞히기 풀러 가기</button>
    `);
    $('#goQuiz').addEventListener('click', () => Nav.replace(() => renderQuizSetup(ls)));
    return;
  }

  const m = render(`
    <div style="font-size:13px;color:var(--sub);font-weight:600;margin:2px 2px 10px;line-height:1.5;">
      복습해서 정답을 맞히면 오답 노트에서 자동으로 사라져요!
    </div>
    <div class="row">
      <button class="btn slim" id="rq">✅ 퀴즈로 복습</button>
      <button class="btn slim soft" id="rs">⌨️ 스펠링으로 복습</button>
    </div>
    <div class="lbl">틀린 단어 (${items.length})</div>
    <div class="card wrong-list">
      ${items.map(w => `
        <div class="wrong-item">
          ${sayBtn(w.w, true)}
          <span class="w">${esc(w.w)}</span>${posBadge(w.p)}
          <span class="cntb">${L.wrong[w.w]}회</span>
          <span class="m">${esc(w.m)}</span>
        </div>`).join('')}
    </div>
    <div style="margin-top:14px;"><button class="btn danger slim" id="clr">오답 노트 비우기</button></div>
  `);
  $('#rq').addEventListener('click', () => startMeaningQuiz(ls, items, 'mix', items.length, false));
  $('#rs').addEventListener('click', () => Nav.go(() => renderSpellRun(ls, shuffle(items), 'mean', false)));
  let confirmClr = false;
  $('#clr').addEventListener('click', () => {
    if (!confirmClr) { confirmClr = true; $('#clr').textContent = '정말 비울까요? 한 번 더 누르면 삭제돼요'; return; }
    ls.words.forEach(w => delete L.wrong[w.w]);
    Store.save();
    Nav.replace(() => renderWrong(ls));
  });
}

function renderStats(){
  setHeader('학습 기록', '나의 어휘 학습 현황');
  const name = Store.d.name;
  const lessonsHTML = App.lessons.map(ls => {
    const L = Store.lesson(ls.id);
    const known = ls.words.filter(w => L.known[w.w]).length;
    const wrongN = ls.words.filter(w => L.wrong[w.w]).length;
    const pct = Math.round(known / ls.words.length * 100);
    const hist = L.history.slice(0, 12);
    return `
    <div class="lbl">${esc(ls.title)}</div>
    <div class="card" style="padding:16px 18px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <b style="font-size:14.5px;">암기 진행도</b>
        <span style="font-size:12.5px;color:var(--sub);font-weight:700;">${known}/${ls.words.length} (${pct}%) · 오답 ${wrongN}개</span>
      </div>
      <div class="pbar" style="margin-top:8px;"><i style="width:${pct}%"></i></div>
      ${hist.length ? `
      <div style="margin-top:14px;">
        ${hist.map(h => `
          <div class="hist-item">
            <span class="hm">${esc(h.m)}</span>
            <span class="hs">${h.s}/${h.t}</span>
            <span class="hd">${esc(h.d)}</span>
          </div>`).join('')}
      </div>` : `<div style="margin-top:12px;font-size:13px;color:var(--sub);font-weight:600;">아직 학습 기록이 없어요. 퀴즈에 도전해 보세요!</div>`}
    </div>`;
  }).join('');

  const m = render(`
    <div class="card" style="padding:16px 18px;">
      <b style="font-size:14.5px;">내 이름</b>
      <div style="font-size:12.5px;color:var(--sub);font-weight:600;margin:3px 0 9px;">이 기기에만 저장돼요. 선생님 확인용 화면에 표시됩니다.</div>
      <input class="tin" id="nm" type="text" maxlength="12" placeholder="예) 2학년 3반 김마석" value="${esc(name)}" style="margin-top:0;text-align:left;font-size:16px;">
    </div>
    ${lessonsHTML}
    <div style="margin-top:18px;"><button class="btn danger slim" id="reset">학습 기록 전체 초기화</button></div>
  `);
  $('#nm').addEventListener('change', e => { Store.d.name = e.target.value.trim(); Store.save(); });
  let confirmRst = false;
  $('#reset').addEventListener('click', () => {
    if (!confirmRst) { confirmRst = true; $('#reset').textContent = '암기·오답·기록이 모두 지워져요. 한 번 더 누르면 초기화!'; return; }
    const nm = Store.d.name, th = Store.d.theme;
    Store.d = { name: nm, theme: th, lessons: {} };
    Store.save();
    Nav.replace(() => renderStats());
    toast('학습 기록을 초기화했어요');
  });
}

// ============================================================
// 데이터 로드 & 시작
// ============================================================
function loadLessonScripts(){
  const files = window.VOCAB_MANIFEST || [];
  return Promise.all(files.map(f => new Promise(res => {
    const s = document.createElement('script');
    s.src = 'vocab-data/' + f;
    s.onload = res;
    s.onerror = () => { console.warn('단어장 로드 실패:', f); res(); };
    document.head.appendChild(s);
  })));
}

window.addEventListener('DOMContentLoaded', async () => {
  Store.load();
  Theme.init();
  TTS.init();
  await loadLessonScripts();
  App.lessons = (window.VOCAB_LESSONS || [])
    .filter(ls => ls && Array.isArray(ls.words) && ls.words.length)
    .sort((a, b) => String(a.id).localeCompare(String(b.id)));
  if (!App.lessons.length) {
    $('#main').innerHTML = `<div class="empty"><span class="em">😢</span>단어장을 불러오지 못했어요.<br>인터넷 연결을 확인하고 새로고침해 주세요.</div>`;
    return;
  }
  Nav.reset(renderHome);
});
