  '-ise':   { type:'suffix', role:'동사화 (-ise)',   desc:'~화하다 (영국식)', ex:'civil→civilise' },
  '-ify':   { type:'suffix', role:'동사화 (-ify)',   desc:'~로 만들다', ex:'beauty→beautify, simple→simplify' },
  '-en':    { type:'suffix', role:'동사화 (-en)',    desc:'~하게 만들다', ex:'wide→widen, strong→strengthen' },
  '-ate':   { type:'suffix', role:'동사화 (-ate)',   desc:'~하다, ~로 만들다', ex:'activate, generate' },
  // Prefixes
  'un-':    { type:'prefix', role:'부정 (un-)',     desc:'아닌, 반대의', ex:'happy→unhappy, fair→unfair' },
  'in-':    { type:'prefix', role:'부정 (in-)',     desc:'아닌, ~안에', ex:'visible→invisible, secure→insecure' },
  'im-':    { type:'prefix', role:'부정 (im-)',     desc:'아닌 (p,b,m 앞)', ex:'possible→impossible, perfect→imperfect' },
  'il-':    { type:'prefix', role:'부정 (il-)',     desc:'아닌 (l 앞)', ex:'legal→illegal' },
  'ir-':    { type:'prefix', role:'부정 (ir-)',     desc:'아닌 (r 앞)', ex:'regular→irregular' },
  'dis-':   { type:'prefix', role:'부정·반대 (dis-)', desc:'아닌, 반대', ex:'agree→disagree, like→dislike' },
  'non-':   { type:'prefix', role:'부정 (non-)',    desc:'~아닌', ex:'fiction→nonfiction' },
  'mis-':   { type:'prefix', role:'잘못 (mis-)',    desc:'잘못, 틀린', ex:'understand→misunderstand' },
  're-':    { type:'prefix', role:'재차 (re-)',     desc:'다시, 되', ex:'gain→regain, view→review' },
  'en-':    { type:'prefix', role:'동사화 (en-)',   desc:'~로 만들다', ex:'large→enlarge, danger→endanger' },
  'em-':    { type:'prefix', role:'동사화 (em-)',   desc:'~로 만들다 (b,p 앞)', ex:'power→empower' },
  'inter-': { type:'prefix', role:'사이 (inter-)',  desc:'~사이의, 상호', ex:'national→international, act→interact' },
  'over-':  { type:'prefix', role:'초과 (over-)',   desc:'지나치게, ~위에', ex:'whelm→overwhelm' },
  'under-': { type:'prefix', role:'아래 (under-)',  desc:'아래의, 부족한', ex:'underestimate, understand' },
  'pre-':   { type:'prefix', role:'사전 (pre-)',    desc:'미리, 앞', ex:'predominant' },
  'post-':  { type:'prefix', role:'사후 (post-)',   desc:'후의, 뒤', ex:'postpone' },
  'sub-':   { type:'prefix', role:'하위 (sub-)',    desc:'아래, 부속의', ex:'submit, suburb' },
  'super-': { type:'prefix', role:'위 (super-)',    desc:'~위에, 초월', ex:'superhuman' },
  'co-':    { type:'prefix', role:'함께 (co-)',     desc:'함께, 공동', ex:'cooperate' },
  'de-':    { type:'prefix', role:'제거 (de-)',     desc:'아래, 제거, 반대', ex:'forest→deforest' },
  'trans-': { type:'prefix', role:'전환 (trans-)',  desc:'가로질러, 변환', ex:'transparent, transform' },
  'ex-':    { type:'prefix', role:'밖 (ex-)',       desc:'밖으로, 이전의', ex:'expose, exploit' },
};

// ───── State ─────
const state = {
  pool: [],
  currentIdx: 0,
  revealedInQuiz: false,
  soundOn: false,
  autoSpeak: true,
  streak: 0,
  maxStreak: 0,
  wrongQueue: [],          // [{word, root, fam, idx}] for review round
  theme: 'dark',
  familyStats: {},         // localStorage: { [root]: { right, wrong, last, attempts } }
  currentFamilyStats: null,// per-family running stats during a family session
  inReviewMode: false,     // true during the review round
};
const ACCURACY_KEY = 'wordcloud_study_accuracy';
const THEME_KEY = 'wordcloud_study_theme';

// ───── Screen switch ─────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ───── Streak ─────
function bumpStreak() {
  state.streak++;
  if (state.streak > state.maxStreak) state.maxStreak = state.streak;
  updateStreakUI();
  if (state.streak === 3 || state.streak === 5 || state.streak === 10 || state.streak === 20) {
    showToast(`🔥 ${state.streak}연속 정답!`, 1800);
    const el = document.getElementById('streak');
    el.classList.add('milestone');
    setTimeout(() => el.classList.remove('milestone'), 600);
  }
}
function resetStreak() {
  state.streak = 0;
  updateStreakUI();
}
function updateStreakUI() {
  const el = document.getElementById('streak');
  el.textContent = `🔥 ${state.streak}`;
  el.classList.toggle('show', state.streak > 0);
}

// ───── Diff visualization: show user's input with right/wrong chars marked
// (no answer leak — progressive hint reveals partial answer separately) ─────
function renderDiff(parent, userInput, correct, showAnswer) {
  parent.innerHTML = '';
  const u = (userInput || '').toLowerCase();
  const c = correct.toLowerCase();

  // "입력" — user's text with per-char styling
  const labelYour = document.createElement('span'); labelYour.className = 'label'; labelYour.textContent = '입력';
  const yourSpan = document.createElement('span'); yourSpan.className = 'your';
  for (let i = 0; i < u.length; i++) {
    const ch = document.createElement('span');
    if (i < c.length && u[i] === c[i]) {
      ch.className = 'good';
    } else {
      ch.className = 'bad';
    }
    ch.textContent = u[i];
    yourSpan.appendChild(ch);
  }
  // Length mismatch indicator
  if (u.length < c.length) {
    const sh = document.createElement('span');
    sh.style.cssText = 'color:#ffd66e;margin-left:6px;font-size:12px;';
    sh.textContent = `+ ${c.length - u.length}자 더 필요`;
    yourSpan.appendChild(sh);
  } else if (u.length > c.length) {
    const lg = document.createElement('span');
    lg.style.cssText = 'color:#ffd66e;margin-left:6px;font-size:12px;';
    lg.textContent = `(${u.length - c.length}자 많음)`;
    yourSpan.appendChild(lg);
  }
  parent.appendChild(labelYour);
  parent.appendChild(yourSpan);

  // Only show "정답" line when explicitly enabled (after many attempts)
  if (showAnswer) {
    const labelAns = document.createElement('span'); labelAns.className = 'label'; labelAns.textContent = '정답';
    const ansSpan = document.createElement('span'); ansSpan.className = 'ans';
    for (let i = 0; i < c.length; i++) {
      const ch = document.createElement('span');
      if (i < u.length && u[i] === c[i]) ch.className = 'good';
      else ch.className = 'miss';
      ch.textContent = c[i];
      ansSpan.appendChild(ch);
    }
    parent.appendChild(labelAns);
    parent.appendChild(ansSpan);
  }
}

// ───── Progressive hint for wrong attempts ─────
function buildProgressiveHint(word, attempts) {
  // attempts: 1=show first letter, 2=show half, 3=show 75%
  if (attempts < 1) return '';
  const len = word.length;
  let revealed;
  if (attempts === 1)      revealed = Math.max(1, Math.ceil(len * 0.3));   // 30%
  else if (attempts === 2) revealed = Math.max(2, Math.ceil(len * 0.55));  // 55%
  else                     revealed = Math.max(3, Math.ceil(len * 0.8));   // 80%
  revealed = Math.min(revealed, len - 1);
  return word.slice(0, revealed) + '_'.repeat(Math.max(1, len - revealed));
}

// ───── Letter glow burst on correct answer ─────
function letterGlowBurst(inputEl, word) {
  // Briefly replace input visual with each letter popping in
  inputEl.classList.add('correct-glow');
  setTimeout(() => inputEl.classList.remove('correct-glow'), 1100);
}

// ───── Per-family stats ─────
function loadFamilyStats() {
  try { state.familyStats = JSON.parse(localStorage.getItem(ACCURACY_KEY)) || {}; }
  catch (_) { state.familyStats = {}; }
}
function saveFamilyStats() {
  try { localStorage.setItem(ACCURACY_KEY, JSON.stringify(state.familyStats)); } catch (_) {}
}
function recordFamilyResult(root, right, wrong, attempts) {
  const cur = state.familyStats[root] || { right: 0, wrong: 0, attempts: 0, sessions: 0 };
  cur.right += right;
  cur.wrong += wrong;
  cur.attempts += attempts;
  cur.sessions = (cur.sessions || 0) + 1;
  cur.last = Date.now();
  state.familyStats[root] = cur;
  saveFamilyStats();
}
function familyAccuracy(root) {
  const s = state.familyStats[root];
  if (!s || (s.right + s.wrong) === 0) return null;
  return s.right / (s.right + s.wrong);
}

// ───── Family progress dots ─────
function renderFamilyDots(fam, quizSet) {
  const wrap = document.getElementById('family-dots');
  wrap.innerHTML = '';
  fam.words.forEach((w, i) => {
    const d = document.createElement('span');
    d.className = 'fdot';
    d.dataset.idx = i;
    d.dataset.isQuiz = quizSet.has(i) ? '1' : '0';
    wrap.appendChild(d);
  });
}
function markDotDone(idx, isQuiz) {
  const dot = document.querySelector(`.fdot[data-idx="${idx}"]`);
  if (!dot) return;
  dot.classList.add(isQuiz ? 'done-quiz' : 'done', 'flash');
  setTimeout(() => dot.classList.remove('flash'), 280);
}

// ───── Theme toggle ─────
function applyTheme(theme) {
  state.theme = theme;
  document.body.classList.toggle('light-theme', theme === 'light');
  const btn = document.getElementById('theme-toggle');
  if (btn) {
    btn.textContent = theme === 'light' ? '☀️' : '🌙';
    btn.classList.toggle('light-on', theme === 'light');
  }
  try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
}
function toggleTheme() {
  applyTheme(state.theme === 'light' ? 'dark' : 'light');
}

// ───── Affix popup ─────
let _affixPopupTimer = null;
function showAffixPopup(target, affixText) {
  const info = lookupAffix(affixText);
  if (!info) return;
  const pop = document.getElementById('affix-popup');
  pop.querySelector('.affix-role').textContent = info.role;
  pop.querySelector('.affix-desc').textContent = info.desc;
  pop.querySelector('.affix-examples').innerHTML = '<b>예:</b> ' + info.ex;

  const rect = target.getBoundingClientRect();
  // Try below first; if not fitting, above
  pop.style.left = Math.max(10, Math.min(window.innerWidth - 300, rect.left + rect.width/2 - 140)) + 'px';
  pop.style.top = (rect.bottom + 8) + 'px';
  pop.classList.add('show');
  clearTimeout(_affixPopupTimer);
  _affixPopupTimer = setTimeout(hideAffixPopup, 3500);
}
function hideAffixPopup() {
  document.getElementById('affix-popup').classList.remove('show');
}
function lookupAffix(text) {
  // text is the raw affix text in the span (e.g. "ly", "tion", "un", "dis")
  // Try as suffix first (with "-" prefix), then as prefix (with "-" suffix)
  const lower = text.toLowerCase();
  // Suffix candidates: longest match
  const suffixKeys = Object.keys(AFFIX_INFO).filter(k => k.startsWith('-')).sort((a,b) => b.length - a.length);
  for (const key of suffixKeys) {
    if (key === '-' + lower) return AFFIX_INFO[key];
  }
  // Prefix candidates
  const prefixKeys = Object.keys(AFFIX_INFO).filter(k => k.endsWith('-')).sort((a,b) => b.length - a.length);
  for (const key of prefixKeys) {
    if (key === lower + '-') return AFFIX_INFO[key];
  }
  // Fallback: longest matching suffix where text contains the affix
  for (const key of suffixKeys) {
    if (lower.endsWith(key.slice(1))) return AFFIX_INFO[key];
  }
  for (const key of prefixKeys) {
    if (lower.startsWith(key.slice(0, -1))) return AFFIX_INFO[key];
  }
  return null;
}

// ───── Build pool from selection ─────
function buildPool() {
  const deckVal = document.getElementById('deck-select').value;
  const countVal = document.getElementById('count-select').value;
  const orderVal = document.getElementById('order-select').value;
  let pool;
  if (deckVal === 'all') {
    pool = ALL_FAMILIES.slice();
  } else {
    const parts = deckVal.split('-').map(Number);
    pool = ALL_FAMILIES.slice(parts[0], parts[1]);
  }
  if (orderVal === 'random') {
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
  } else if (orderVal === 'weak') {
    // Sort: weakest accuracy first; untouched families come after weak ones (treat as 100%)
    pool.sort((a, b) => {
      const aa = familyAccuracy(a.root);
      const bb = familyAccuracy(b.root);
      const av = aa === null ? 1.0 : aa;
      const bv = bb === null ? 1.0 : bb;
      return av - bv;
    });
  }
  if (countVal !== 'all') {
    const n = Math.min(parseInt(countVal, 10), pool.length);
    pool = pool.slice(0, n);
  }
  return pool;
}

// Update the small weak-info bar under the start controls
function updateWeakInfo() {
  const info = document.getElementById('weak-info');
  const order = document.getElementById('order-select').value;
  if (order !== 'weak') { info.classList.add('hidden'); return; }
  // Count weak families (accuracy < 80%)
  let weak = 0, recorded = 0;
  Object.entries(state.familyStats).forEach(([root, s]) => {
    const total = (s.right || 0) + (s.wrong || 0);
    if (total > 0) {
      recorded++;
      if (s.right / total < 0.8) weak++;
    }
  });
  if (recorded === 0) {
    info.classList.remove('hidden');
    info.textContent = '💡 학습 기록이 아직 없어요. 평소대로 진행해도 다음번부터 약점이 우선 출제됩니다.';
  } else {
    info.classList.remove('hidden');
    info.innerHTML = `💪 기록 있는 ${recorded}가족 중 <b>${weak}가족</b>이 약점(정답률 80% 미만). 약점이 우선 출제됩니다.`;
  }
}

function startGame() {
  state.pool = buildPool();
  state.currentIdx = 0;
  state.streak = 0;
  state.maxStreak = 0;
  state.wrongQueue = [];
  state.inReviewMode = false;
  state.currentFamilyStats = null;
  updateStreakUI();
  if (state.pool.length === 0) { showToast('단어가 없어요'); return; }
  document.getElementById('progress-row').classList.remove('hidden');
  updateProgress();
  goToQuiz();
}

function updateProgress() {
  const txt = document.getElementById('progress-text');
  const fill = document.getElementById('progress-fill');
  txt.textContent = (state.currentIdx + 1) + ' / ' + state.pool.length;
  fill.style.width = (state.currentIdx / state.pool.length * 100) + '%';
}

// ───── Quiz screen ─────
function goToQuiz() {
  const fam = state.pool[state.currentIdx];
  if (!fam) return;
  state.revealedInQuiz = false;

  document.getElementById('quiz-word').textContent = fam.root;
  document.getElementById('quiz-answer').classList.remove('shown');
  document.getElementById('quiz-reveal-btn').style.display = '';
  document.getElementById('quiz-next-btn').style.display = 'none';

  const baseWord = fam.words.find(w => w.word === fam.root);
  const posList = baseWord ? baseWord.pos : (fam.words[0] ? fam.words[0].pos : []);

  const posEl = document.getElementById('quiz-pos');
  posEl.innerHTML = '';
  posList.forEach(p => {
    const b = document.createElement('span');
    b.className = 'pos-big ' + posClass(p);
    b.textContent = p;
    posEl.appendChild(b);
  });
  document.getElementById('quiz-meaning').textContent = fam.meaning || '';

  updateProgress();
  showScreen('screen-quiz');
  sfxWordEntrance();

  if (state.autoSpeak) {
    setTimeout(() => speak(fam.root, document.getElementById('quiz-tts')), 700);
  }
}

function revealQuizAnswer() {
  if (state.revealedInQuiz) return;
  state.revealedInQuiz = true;
  document.getElementById('quiz-answer').classList.add('shown');
  document.getElementById('quiz-reveal-btn').style.display = 'none';
  document.getElementById('quiz-next-btn').style.display = '';
  sfxReveal();
  const rect = document.getElementById('quiz-word').getBoundingClientRect();
  burst(rect.left + rect.width/2, rect.top + rect.height/2, '#a78bfa', 22);
}

// ───── Family screen ─────
function goToFamily() {
  const fam = state.pool[state.currentIdx];
  if (!fam) return;
  document.getElementById('family-root').textContent = fam.root;
  document.getElementById('family-meaning').textContent = fam.meaning || '';
  document.getElementById('family-count').textContent = fam.words.length + '개 단어';

  // Initialize current family stats for summary
  state.currentFamilyStats = {
    root: fam.root,
    meaning: fam.meaning,
    totalQuiz: 0, rightQuiz: 0, wrongQuiz: 0,
    totalAttempts: 0,
    words: fam.words.slice()
  };

  const list = document.getElementById('family-list');
  list.innerHTML = '';

  // Quiz only derivatives (1-2 random); base stays as normal reference card
  const quizSet = chooseQuizIndices(fam);
  renderFamilyDots(fam, quizSet);

  fam.words.forEach((w, i) => {
    const isQuiz = quizSet.has(i);
    const card = document.createElement('div');
    card.className = 'word-card enter' + (isQuiz ? ' quiz-card' : '');
    card.style.animationDelay = (0.05 + i * 0.10) + 's';

    if (isQuiz) {
      buildQuizCard(card, w, fam);
    } else {
      buildNormalCard(card, w, fam);
    }

    list.appendChild(card);
  });
}

// ───── Normal card: word visible, click to reveal POS+meaning ─────
function buildNormalCard(card, w, fam) {
  const top = document.createElement('div');
  top.className = 'wc-top';

  const wordEl = buildWordEl(w.word, fam.root);
  top.appendChild(wordEl);

  const tts = document.createElement('button');
  tts.className = 'wc-tts';
  tts.textContent = '🔊';
  tts.title = '발음 듣기';
  tts.addEventListener('click', (e) => {
    e.stopPropagation();
    speak(w.word, tts);
  });
  top.appendChild(tts);
  card.appendChild(top);

  const hint = document.createElement('div');
  hint.className = 'wc-hint';
  hint.textContent = '🔍 탭하면 품사·뜻이 나와요';
  card.appendChild(hint);

  const reveal = document.createElement('div');
  reveal.className = 'wc-reveal';
  const posRow = document.createElement('div');
  posRow.className = 'wc-pos';
  w.pos.forEach(p => {
    const b = document.createElement('span');
    b.className = 'pos-badge ' + posClass(p);
    b.textContent = p;
    posRow.appendChild(b);
  });
  reveal.appendChild(posRow);
  const meaningRow = document.createElement('div');
  meaningRow.className = 'wc-meaning';
  meaningRow.textContent = w.meaning || fam.meaning || '';
  reveal.appendChild(meaningRow);
  card.appendChild(reveal);

  card.addEventListener('click', () => {
    const wasRevealed = card.classList.contains('revealed');
    card.classList.toggle('revealed');
    if (!wasRevealed) {
      sfxClick();
      const r = card.getBoundingClientRect();
      burst(r.left + r.width - 30, r.top + 20, '#ec4899', 10);
      if (state.autoSpeak) speak(w.word, tts);
      // Mark family dot
      const fam = state.pool[state.currentIdx];
      const idx = fam ? fam.words.findIndex(ww => ww.word === w.word) : -1;
      if (idx >= 0) markDotDone(idx, false);
    }
  });
}

// ───── Quiz card: POS+meaning visible, user types word ─────
function buildQuizCard(card, w, fam) {
  // Hint row: POS badges + meaning + tiny TTS hint button
  const promptRow = document.createElement('div');
  promptRow.className = 'quiz-prompt-row';
  w.pos.forEach(p => {
    const b = document.createElement('span');
    b.className = 'pos-badge ' + posClass(p);
    b.textContent = p;
    promptRow.appendChild(b);
  });
  const meaning = document.createElement('span');
  meaning.className = 'quiz-prompt-meaning';
  meaning.textContent = w.meaning || fam.meaning || '';
  promptRow.appendChild(meaning);
  const ttsHint = document.createElement('button');
  ttsHint.className = 'quiz-tts-small';
  ttsHint.textContent = '🔊';
  ttsHint.title = '발음 들어보기 (힌트)';
  ttsHint.addEventListener('click', (e) => {
    e.stopPropagation();
    speak(w.word, ttsHint);
  });
  promptRow.appendChild(ttsHint);
  card.appendChild(promptRow);

  // Input row
  const inputRow = document.createElement('div');
  inputRow.className = 'quiz-input-row';
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'quiz-input';
  input.placeholder = '영어 단어를 입력하세요';
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.autocapitalize = 'off';
  inputRow.appendChild(input);
  const submit = document.createElement('button');
  submit.className = 'quiz-submit';
  submit.textContent = '✓ 제출';
  inputRow.appendChild(submit);
  card.appendChild(inputRow);

  // Result row (hint / feedback)
  const result = document.createElement('div');
  result.className = 'quiz-result';
  result.textContent = '💭 한국어 뜻을 보고 영어 단어를 적어보세요';
  card.appendChild(result);

  // State
  let attempts = 0;
  let solved = false;
  let wasWrongBeforeCorrect = false;  // tracks "first-try correct?"

  // Track current-family stats for summary
  if (state.currentFamilyStats) {
    state.currentFamilyStats.totalQuiz++;
  }

  function checkAnswer() {
    if (solved) return;
    const userVal = normalizeAnswer(input.value);
    const target = w.word.toLowerCase();
    if (!userVal) {
      result.classList.remove('correct');
      result.classList.add('wrong');
      result.textContent = '✏️ 입력해주세요';
      return;
    }
    if (userVal === target) {
      // Correct!
      solved = true;
      card.classList.add('correct');
      input.classList.remove('wrong');
      input.classList.add('correct');
      input.value = w.word;
      input.disabled = true;
      submit.disabled = true;
      submit.textContent = '✓';
      result.classList.remove('wrong');
      result.classList.add('correct');
      result.innerHTML = (wasWrongBeforeCorrect ? '✓ 맞췄어요! ' : '🎉 정답! ') +
        '&nbsp; <span class="correct-word">' + w.word + '</span>';
      sfxReveal();
      letterGlowBurst(input, w.word);
      const r = card.getBoundingClientRect();
      burst(r.left + r.width/2, r.top + r.height/2, '#5cb85c', 22);
      if (state.autoSpeak) speak(w.word, ttsHint);
      // Stats: count this quiz as right (first try) or wrong
      if (state.currentFamilyStats) {
        if (wasWrongBeforeCorrect) state.currentFamilyStats.wrongQuiz++;
        else state.currentFamilyStats.rightQuiz++;
        state.currentFamilyStats.totalAttempts += (attempts + 1);
      }
      // Streak
      if (!wasWrongBeforeCorrect) bumpStreak();
      // Mark dot done
      const idx = fam.words.indexOf(w);
      if (idx >= 0) markDotDone(idx, true);
      // Remove from wrong queue if present (review mode)
      if (state.inReviewMode) {
        state.wrongQueue = state.wrongQueue.filter(x => !(x.word === w.word && x.root === fam.root));
      }
    } else {
      attempts++;
      wasWrongBeforeCorrect = true;
      input.classList.remove('correct');
      input.classList.add('wrong');
      result.classList.remove('correct');
      result.classList.add('wrong');
      resetStreak();
      // SFX
      try {
        if (state.soundOn) {
          playTone(220, 0.12, 0, 'sawtooth', 0.08);
          playTone(180, 0.16, 0.08, 'sawtooth', 0.07);
        }
      } catch (e) {}
      // Build feedback: header line + diff + hint
      result.innerHTML = '';
      const headerLine = document.createElement('div');
      headerLine.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;';
      headerLine.innerHTML = `<span style="color:#ff9b9b;font-weight:800">❌ 틀렸어요</span> <span style="color:#9aa3c7;font-size:12px">(${attempts}회 시도)</span>`;
      result.appendChild(headerLine);
      // Diff — input-only by default; show answer only after 4+ wrong tries
      const diffDiv = document.createElement('div');
      diffDiv.className = 'quiz-diff';
      renderDiff(diffDiv, input.value, w.word, attempts >= 4);
      result.appendChild(diffDiv);
      // Progressive hint
      if (attempts >= 1) {
        const hintDiv = document.createElement('div');
        hintDiv.innerHTML = `<span style="color:#9aa3c7;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-right:6px">💡 힌트</span><span class="quiz-hint-text">${buildProgressiveHint(w.word, attempts)}</span>`;
        result.appendChild(hintDiv);
      }
      // After 4 wrong, reveal full answer
      if (attempts >= 4) {
        const full = document.createElement('div');
        full.innerHTML = `정답: <span class="correct-word">${w.word}</span> · 입력해서 확인하세요`;
        full.style.cssText = 'color:#fbbf24;font-weight:700';
        result.appendChild(full);
      }
      setTimeout(() => input.classList.remove('wrong'), 500);
      // Track in review queue (once per word)
      if (!state.inReviewMode && !state.wrongQueue.some(x => x.word === w.word && x.root === fam.root)) {
        state.wrongQueue.push({ word: w.word, root: fam.root, fam: fam });
      }
      // Auto-select for retry
      input.select();
    }
  }

  submit.addEventListener('click', checkAnswer);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      checkAnswer();
    }
  });
  // Mobile: when keyboard opens, scroll input into view
  input.addEventListener('focus', () => {
    setTimeout(() => {
      try { input.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {}
    }, 320);
  });
  // Don't let card click do anything (no reveal toggle for quiz cards)
  card.addEventListener('click', (e) => {
    if (e.target === card) input.focus();
  });

  showScreen('screen-family');
}

function revealAllInFamily() {
  document.querySelectorAll('#family-list .word-card').forEach((card, i) => {
    if (!card.classList.contains('revealed')) {
      setTimeout(() => {
        card.classList.add('revealed');
        const r = card.getBoundingClientRect();
        burst(r.left + r.width - 30, r.top + 20, '#ec4899', 8);
      }, i * 80);
    }
  });
  sfxReveal();
}

function nextFamily() {
  // Show summary first (if there's any quiz data or normal interactions)
  if (state.currentFamilyStats && !state.inReviewMode) {
    saveCurrentFamilyStats();
    showFamilySummary();
    return;
  }
  proceedToNextOrDone();
}

function skipFamily() {
  proceedToNextOrDone();
}

function proceedToNextOrDone() {
  state.currentIdx++;
  if (state.currentIdx >= state.pool.length) {
    // If we're in review mode and finished, go to done; else go to review (if wrongs)
    if (state.inReviewMode) {
      state.inReviewMode = false;
      goToDone();
    } else if (state.wrongQueue.length > 0) {
      goToReviewIntro();
    } else {
      goToDone();
    }
  } else {
    goToQuiz();
  }
}

function saveCurrentFamilyStats() {
  const s = state.currentFamilyStats;
  if (!s || !s.root) return;
  // Save to persistent family stats (for "weak family" tracking)
  recordFamilyResult(s.root, s.rightQuiz, s.wrongQuiz, s.totalAttempts);
}

function showFamilySummary() {
  const s = state.currentFamilyStats;
  if (!s) { proceedToNextOrDone(); return; }
  document.getElementById('summary-root').textContent = s.root;
  document.getElementById('summary-meaning').textContent = s.meaning || '';
  document.getElementById('summary-total').textContent = s.words.length;
  const rateEl = document.getElementById('summary-rate');
  if (s.totalQuiz > 0) {
    const pct = Math.round(s.rightQuiz / s.totalQuiz * 100);
    rateEl.textContent = `${pct}%`;
    rateEl.className = 'value ' + (pct >= 90 ? 'good' : pct >= 60 ? 'mid' : 'poor');
  } else {
    rateEl.textContent = '—';
    rateEl.className = 'value';
  }
  document.getElementById('summary-attempts').textContent = s.totalAttempts || s.words.length;

  // Build words list with meanings
  const wordsBox = document.getElementById('summary-words');
  wordsBox.innerHTML = '';
  const fam = state.pool[state.currentIdx];
  s.words.forEach(w => {
    const line = document.createElement('div');
    line.className = 'summary-word-line';
    const ww = document.createElement('span');
    ww.className = 'w';
    ww.textContent = w.word + (w.word === fam.root ? ' ★' : '');
    const mm = document.createElement('span');
    mm.className = 'm';
    const meaningTxt = w.meaning || fam.meaning || '';
    mm.textContent = `[${w.pos.join(',')}] ${meaningTxt}`;
    line.appendChild(ww);
    line.appendChild(mm);
    wordsBox.appendChild(line);
  });

  showScreen('screen-summary');
}

function goToReviewIntro() {
  document.getElementById('review-count').textContent = state.wrongQueue.length;
  showScreen('screen-review-intro');
}

function startReview() {
  if (state.wrongQueue.length === 0) { goToDone(); return; }
  // Build a synthetic pool: each entry becomes a "family-like" with just the wrong word as a quiz
  // Simpler: cycle through wrongQueue using a special review-quiz screen
  state.inReviewMode = true;
  state.reviewIdx = 0;
  goToReviewQuiz();
}

function skipReview() {
  state.inReviewMode = false;
  goToDone();
}

function goToReviewQuiz() {
  if (state.reviewIdx >= state.wrongQueue.length) {
    // Done — check if any remain (still wrong); otherwise finish
    if (state.wrongQueue.length === 0) {
      state.inReviewMode = false;
      goToDone();
      return;
    }
    // Loop back if any remain
    state.reviewIdx = 0;
  }
  const item = state.wrongQueue[state.reviewIdx];
  if (!item) { state.inReviewMode = false; goToDone(); return; }
  // Show as a mini quiz: build the family screen but with just this one word as quiz card
  const fam = item.fam;
  document.getElementById('family-root').textContent = fam.root + ' (복습)';
  document.getElementById('family-meaning').textContent = fam.meaning || '';
  document.getElementById('family-count').textContent = `복습 ${state.reviewIdx + 1} / ${state.wrongQueue.length}`;
  document.getElementById('family-dots').innerHTML = '';

  state.currentFamilyStats = { root: fam.root, meaning: fam.meaning, totalQuiz:0, rightQuiz:0, wrongQuiz:0, totalAttempts:0, words: fam.words.slice() };

  const list = document.getElementById('family-list');
  list.innerHTML = '';
  // Find the word object
  const w = fam.words.find(ww => ww.word === item.word);
  if (!w) { state.reviewIdx++; goToReviewQuiz(); return; }
  const card = document.createElement('div');
  card.className = 'word-card enter quiz-card';
  card.style.animationDelay = '0.05s';
  buildQuizCard(card, w, fam);
  list.appendChild(card);

  showScreen('screen-family');
}

// ───── Done screen ─────
function goToDone() {
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-text').textContent = state.pool.length + ' / ' + state.pool.length;
  const totalWords = state.pool.reduce((s, f) => s + f.words.length, 0);
  document.getElementById('stat-families').textContent = state.pool.length;
  document.getElementById('stat-words').textContent = totalWords;
  showScreen('screen-done');
  setTimeout(() => {
    bigConfetti(window.innerWidth / 2, window.innerHeight / 3);
    sfxDone();
  }, 300);
}

function restart() {
  state.currentIdx = 0;
  state.pool = [];
  state.streak = 0;
  state.wrongQueue = [];
  state.inReviewMode = false;
  state.currentFamilyStats = null;
  updateStreakUI();
  document.getElementById('progress-row').classList.add('hidden');
  updateWeakInfo();
  showScreen('screen-start');
}

// ───── Toggles ─────
function toggleSound() {
  state.soundOn = !state.soundOn;
  const btn = document.getElementById('sound-toggle');
  btn.textContent = state.soundOn ? '🔊' : '🔇';
  btn.classList.toggle('on', state.soundOn);
  if (state.soundOn) playTone(880, 0.1, 0);
}
function toggleAutoSpeak() {
  state.autoSpeak = !state.autoSpeak;
  const btn = document.getElementById('autospeak-toggle');
  btn.classList.toggle('on', state.autoSpeak);
}

// ───── Wire up ─────
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('quiz-reveal-btn').addEventListener('click', revealQuizAnswer);
document.getElementById('quiz-next-btn').addEventListener('click', goToFamily);
document.getElementById('quiz-skip-btn').addEventListener('click', skipFamily);
document.getElementById('quiz-tts').addEventListener('click', () => {
  const fam = state.pool[state.currentIdx];
  if (fam) speak(fam.root, document.getElementById('quiz-tts'));
});
document.getElementById('family-reveal-all').addEventListener('click', revealAllInFamily);
document.getElementById('family-next-btn').addEventListener('click', nextFamily);
document.getElementById('done-restart-btn').addEventListener('click', restart);
document.getElementById('sound-toggle').addEventListener('click', toggleSound);
document.getElementById('autospeak-toggle').addEventListener('click', toggleAutoSpeak);
document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
document.getElementById('order-select').addEventListener('change', updateWeakInfo);
document.getElementById('summary-next-btn').addEventListener('click', proceedToNextOrDone);
document.getElementById('review-start-btn').addEventListener('click', startReview);
document.getElementById('review-skip-btn').addEventListener('click', skipReview);

// Affix popup: click/tap a .aff inside a .wc-word
document.addEventListener('click', (e) => {
  const aff = e.target.closest('.wc-word .aff');
  if (aff) {
    e.stopPropagation();
    showAffixPopup(aff, aff.textContent || '');
    return;
  }
  // Click outside → hide popup
  if (!e.target.closest('#affix-popup')) hideAffixPopup();
});

// Init theme and family stats
loadFamilyStats();
const savedTheme = (() => { try { return localStorage.getItem(THEME_KEY); } catch (_) { return null; } })();
applyTheme(savedTheme === 'light' ? 'light' : 'dark');
updateWeakInfo();

// Keyboard shortcuts — Enter/Space는 페이지 이동에 사용하지 않음
// (학생이 입력창에서 엔터로 답 제출할 때 다음 페이지로 넘어가는 사고 방지).
// Enter는 입력창 안에서 답 제출에만 사용됨 (각 입력창의 자체 핸들러).
document.addEventListener('keydown', (e) => {
  // Skip if the user is typing inside an input
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
  const active = (document.querySelector('.screen.active') || {}).id;
  if (e.key === 'p' || e.key === 'P') {
    if (active === 'screen-quiz') {
      const fam = state.pool[state.currentIdx];
      if (fam) speak(fam.root, document.getElementById('quiz-tts'));
    }
  } else if (e.key === 'Escape') {
    if (active !== 'screen-start' && confirm('처음으로 돌아갈까요?')) restart();
  }
});

</script>
</body>
</html>
