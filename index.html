<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3b5998">
<title>마석고 등굣길 — 오늘 하루 살아남기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#0d1b2a;color:#1a1a2e;user-select:none;-webkit-user-select:none}
body{display:flex;justify-content:center;align-items:center}
#app{width:100%;max-width:480px;height:100dvh;max-height:900px;display:flex;flex-direction:column;background:linear-gradient(180deg,#a8d8ea 0%,#c5e8f1 50%,#fdf6e3 100%);position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.3);transition:background .4s}
#app.scene-night{background:linear-gradient(180deg,#1a2a3e 0%,#2a3f5f 50%,#4a5d80 100%)}
#app.scene-school{background:linear-gradient(180deg,#ffd89b 0%,#ffe8b8 50%,#fff4d6 100%)}
#app.scene-gym{background:linear-gradient(180deg,#a8e6cf 0%,#c8f0e0 50%,#e0f5ec 100%)}
#app.scene-bad{background:linear-gradient(180deg,#ff6b6b 0%,#ff8585 50%,#ffa5a5 100%)}
#app.scene-good{background:linear-gradient(180deg,#ffd700 0%,#ffe55c 50%,#fff4a3 100%)}
#app.scene-rainy{background:linear-gradient(180deg,#637b8c 0%,#7a8fa0 50%,#9aacba 100%)}

@keyframes shake{0%,100%{transform:translate(0,0)}10%,30%,50%,70%{transform:translate(-6px,1px)}20%,40%,60%,80%{transform:translate(6px,-1px)}}
#app.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}

/* 헤더 */
#header{padding:8px 12px 6px;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px solid rgba(0,0,0,.08);z-index:10}
#topbar{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#5a5a7a;margin-bottom:5px;gap:6px}
#day-info{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#scene-tag{background:#3b5998;color:#fff;padding:2px 7px;border-radius:10px;font-size:10px;flex-shrink:0}
#sound-toggle{background:none;border:none;font-size:16px;cursor:pointer;padding:2px 4px;flex-shrink:0;font-family:inherit}
#sound-toggle:active{transform:scale(.85)}
#gauge-container{display:flex;align-items:center;gap:7px}
#gauge-label{font-size:11px;font-weight:700;color:#3b5998}
#gauge-bar{flex:1;height:9px;background:rgba(0,0,0,.1);border-radius:5px;overflow:hidden;position:relative}
#gauge-fill{height:100%;background:linear-gradient(90deg,#4caf50 0%,#8bc34a 100%);border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1),background .3s}
#gauge-fill.low{background:linear-gradient(90deg,#ff9800 0%,#ff5722 100%)}
#gauge-fill.danger{background:linear-gradient(90deg,#f44336 0%,#d32f2f 100%);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
#gauge-num{font-size:13px;font-weight:800;color:#1a1a2e;min-width:30px;text-align:right}
#combo-display{position:absolute;top:42px;left:12px;font-size:11px;font-weight:800;color:#ff5722;opacity:0;transition:opacity .3s;pointer-events:none}
#combo-display.show{opacity:1}

/* 메인 */
#main{flex:1;display:flex;flex-direction:column;padding:0;overflow:hidden;position:relative}
#character-area{flex:0 0 auto;height:42%;display:flex;justify-content:center;align-items:flex-end;position:relative;padding:6px}
#scene-bg{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;font-size:80px;opacity:.25;pointer-events:none}
#weather{position:absolute;top:8px;right:12px;font-size:32px;animation:float 4s ease-in-out infinite;pointer-events:none}
@keyframes float{50%{transform:translateY(-6px)}}
#character{height:100%;max-height:280px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
#expression{position:absolute;top:18%;left:50%;transform:translate(-50%,-50%);font-size:30px;pointer-events:none;animation:bobbing 3s ease-in-out infinite;z-index:3}
@keyframes bobbing{50%{transform:translate(-50%,-58%)}}
#teacher-overlay{position:absolute;top:8%;right:6%;font-size:64px;opacity:0;transform:translateX(40px) rotate(15deg);transition:all .4s cubic-bezier(.34,1.56,.64,1);z-index:5}
#teacher-overlay.show{opacity:1;transform:translateX(0) rotate(0deg)}
#friend-overlay{position:absolute;top:32%;left:4%;font-size:48px;opacity:0;transform:translateX(-30px);transition:all .4s;z-index:4}
#friend-overlay.show{opacity:1;transform:translateX(0)}

.flash-overlay{position:absolute;inset:0;background:rgba(255,0,0,.4);pointer-events:none;animation:flash-screen .3s forwards;z-index:25}
@keyframes flash-screen{0%{opacity:1}100%{opacity:0}}

.combo-popup{position:absolute;top:30%;left:50%;font-size:30px;font-weight:900;color:#ff5722;text-shadow:0 2px 6px rgba(0,0,0,.3),0 0 8px rgba(255,255,255,.8);animation:combo-pop 1.2s ease-out forwards;z-index:50;pointer-events:none;letter-spacing:1px}
@keyframes combo-pop{0%{opacity:0;transform:translateX(-50%) scale(.5)}20%{opacity:1;transform:translateX(-50%) scale(1.4)}40%{transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-50px)}}

/* 다이얼로그 */
#dialog-area{flex:0 0 auto;min-height:96px;background:rgba(255,255,255,.94);margin:0 12px;border-radius:14px;padding:10px 14px;box-shadow:0 4px 12px rgba(0,0,0,.1);border:2px solid rgba(59,89,152,.2);position:relative}
#dialog-area::before{content:"";position:absolute;top:-8px;left:30px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:8px solid rgba(59,89,152,.2)}
#dialog-area::after{content:"";position:absolute;top:-6px;left:31px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:7px solid rgba(255,255,255,.94)}
#speaker{font-size:11px;font-weight:700;color:#3b5998;margin-bottom:3px;letter-spacing:.5px}
#text{font-size:14px;line-height:1.55;color:#1a1a2e;font-weight:500;min-height:42px;white-space:pre-line;min-height:60px}
#text::after{content:"▌";color:#3b5998;animation:blink .9s steps(1) infinite}
#text.done::after{display:none}
@keyframes blink{50%{opacity:0}}

/* 선택지 */
#choices-area{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:8px 12px 12px;overflow-y:auto}
.choice-btn{padding:10px 14px;background:#fff;border:2px solid #3b5998;border-radius:10px;color:#1a1a2e;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s;text-align:left;font-family:inherit;display:flex;align-items:center;gap:8px;line-height:1.35}
.choice-btn:active{transform:scale(.97);background:#3b5998;color:#fff}
.choice-btn.bad{border-color:#e57373}
.choice-btn.good{border-color:#66bb6a}
.choice-btn.disabled{opacity:.4;pointer-events:none}
.choice-emoji{font-size:18px;flex-shrink:0}

/* 옷장 */
.wardrobe-section{margin-bottom:6px}
.wardrobe-label{font-size:11px;font-weight:700;color:#3b5998;margin-bottom:4px;letter-spacing:.5px}
.wardrobe-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cloth-item{padding:7px 3px;background:#fff;border:2px solid #cfd8dc;border-radius:8px;cursor:pointer;text-align:center;font-size:9.5px;font-weight:600;color:#37474f;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.cloth-item.selected{border-color:#3b5998;background:#e3eaf5;color:#3b5998;transform:scale(1.05)}
.cloth-item:active{transform:scale(.95)}
.cloth-emoji{font-size:20px}
#wardrobe-confirm{margin-top:6px;padding:10px;background:#3b5998;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:inherit}
#wardrobe-confirm:active{background:#2a4374}
#wardrobe-confirm:disabled{background:#b0bec5;cursor:not-allowed}

#countdown{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:64px;font-weight:900;color:#ff5722;text-shadow:0 2px 8px rgba(0,0,0,.3);z-index:5;animation:count-pulse .5s ease-out}
@keyframes count-pulse{0%{transform:translate(-50%,-50%) scale(1.5);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

/* 엔딩 카드 */
#ending-card{position:absolute;inset:0;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:18px;z-index:20;opacity:0;pointer-events:none;transition:opacity .5s;overflow-y:auto}
#ending-card.show{opacity:1;pointer-events:auto}
#ending-card.bad{background:linear-gradient(135deg,#ff5858 0%,#f09819 100%)}
#ending-card.normal{background:linear-gradient(135deg,#fdc830 0%,#f37335 100%)}
#ending-card.good{background:linear-gradient(135deg,#11998e 0%,#38ef7d 100%)}
#ending-card.s-rank{background:linear-gradient(135deg,#fceabb 0%,#f8b500 100%)}
.result-card{background:rgba(255,255,255,.96);border-radius:20px;padding:20px 16px;width:100%;max-width:320px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);position:relative;overflow:hidden}
.result-card::before{content:"";position:absolute;top:-50%;right:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,215,0,.3) 0%,transparent 60%);pointer-events:none}
.rank-badge{font-size:60px;margin-bottom:4px;animation:badge-spin .8s ease-out}
@keyframes badge-spin{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
.rank-text{font-size:30px;font-weight:900;color:#3b5998;margin-bottom:4px;letter-spacing:1px}
.score-row{display:flex;align-items:baseline;justify-content:center;gap:4px;margin:6px 0 10px}
.score-num{font-size:46px;font-weight:900;color:#1a1a2e;line-height:1}
.score-suffix{font-size:17px;color:#5a5a7a;font-weight:700}
.ending-title{font-size:15px;font-weight:800;color:#1a1a2e;margin-bottom:5px}
.ending-comment{font-size:12.5px;color:#5a5a7a;line-height:1.5;margin-bottom:10px;font-weight:500;white-space:pre-line}
.combo-info{background:#fff3e0;border-radius:8px;padding:6px;font-size:11px;color:#e65100;font-weight:700;margin-bottom:8px}
.violations-list{background:#fff8e1;border-left:3px solid #ffb300;padding:7px 10px;text-align:left;font-size:11.5px;color:#5a5a7a;margin-bottom:10px;border-radius:6px;line-height:1.5;max-height:80px;overflow-y:auto}
.violations-list .v-title{font-weight:800;color:#e65100;font-size:11px;margin-bottom:3px}
.violations-list ul{list-style:none;padding:0}
.violations-list li{padding:1px 0}
.violations-list li::before{content:"❌ "}
.violations-list .perfect{color:#2e7d32;font-weight:700}
.violations-list .perfect::before{content:"✅ "}
.share-tip{font-size:11px;color:#888;margin-bottom:8px}
.ending-buttons{display:flex;gap:5px;flex-direction:column}
.ending-btn{padding:9px;border:none;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.ending-btn.primary{background:#3b5998;color:#fff}
.ending-btn.primary:active{background:#2a4374}
.ending-btn.secondary{background:#e3eaf5;color:#3b5998}
.ending-btn.secondary:active{background:#cdd6e6}

/* 시작 화면 */
#title-screen{position:absolute;inset:0;background:linear-gradient(180deg,#3b5998 0%,#192f5d 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;z-index:30;padding:18px;overflow-y:auto}
#title-screen.hide{opacity:0;pointer-events:none;transition:opacity .5s}
#title-emoji{font-size:64px;margin-bottom:8px;animation:float 3s ease-in-out infinite}
#title-text{font-size:28px;font-weight:900;margin-bottom:4px;text-align:center;letter-spacing:1px;text-shadow:0 2px 4px rgba(0,0,0,.3)}
#title-sub{font-size:13px;opacity:.85;margin-bottom:14px;text-align:center;font-weight:500}

/* 도장 컬렉션 */
#collection{margin-bottom:14px;width:100%;max-width:320px}
.coll-title{font-size:11px;font-weight:700;opacity:.85;margin-bottom:6px;text-align:center}
.coll-stamps{display:flex;justify-content:center;gap:6px}
.stamp{width:46px;height:46px;border:2px dashed rgba(255,255,255,.35);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:rgba(0,0,0,.15)}
.stamp.collected{border-color:#ffd700;border-style:solid;background:rgba(255,215,0,.15);box-shadow:0 0 8px rgba(255,215,0,.3)}
.stamp.empty .stamp-emoji{opacity:.4}
.stamp-emoji{font-size:18px;line-height:1}
.stamp-rank{font-size:8px;font-weight:800;margin-top:1px;letter-spacing:.5px}
.stamp-count{position:absolute;bottom:-5px;right:-5px;background:#ff5722;color:#fff;border-radius:10px;font-size:9px;padding:1px 5px;font-weight:700}
.best-score{font-size:10px;opacity:.7;text-align:center;margin-top:6px}

/* 커스터마이징 */
#customize{margin-bottom:14px;width:100%;max-width:320px;background:rgba(255,255,255,.1);border-radius:12px;padding:8px 10px}
.cust-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:11px}
.cust-row:last-child{margin-bottom:0}
.cust-label{font-size:11px;font-weight:700;width:40px;flex-shrink:0;opacity:.85}
.cust-options{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.cust-opt{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700}
.cust-opt.active{border-color:#ffd700;border-width:3px;transform:scale(1.1)}
.cust-opt:active{transform:scale(.9)}

#start-btn{padding:14px 40px;background:#ffd700;color:#1a1a2e;border:none;border-radius:30px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 #ffaa00;transition:all .1s}
#start-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #ffaa00}
#title-credit{margin-top:12px;font-size:10px;opacity:.6}

/* SVG 의상 토글 */
.top,.bottom{display:none}
[data-top="uniform"] .top-uniform{display:inline}
[data-top="living"] .top-living{display:inline}
[data-top="casual"] .top-casual{display:inline}
[data-top="jacket"] .top-jacket{display:inline}
[data-top="friend"] .top-friend{display:inline}
[data-bottom="uniform"] .bottom-uniform{display:inline}
[data-bottom="living"] .bottom-living{display:inline}
[data-bottom="casual"] .bottom-casual{display:inline}
[data-jacket-open="true"] .uniform-peek{display:inline}
[data-jacket-open="false"] .uniform-peek{display:none}

/* 작은 화면 */
@media (max-height:680px){
  #character-area{height:36%}
  #title-emoji{font-size:48px}
  #title-text{font-size:24px}
  #text{font-size:13.5px}
  .choice-btn{padding:9px 12px;font-size:13px}
  .stamp{width:40px;height:40px}
  .stamp-emoji{font-size:16px}
  #collection{margin-bottom:10px}
  #customize{margin-bottom:10px}
}
@media (max-width:340px){
  .wardrobe-grid{grid-template-columns:repeat(4,1fr)}
  #text{font-size:13px}
  .choice-btn{font-size:12.5px}
}
</style>
</head>

<script>
"use strict";

const state = {
  scene:'opening', gauge:100, combo:0, maxCombo:0,
  outfit:{top:null,bottom:null}, violations:[],
  weather:null, dayOfWeek:null, friend:null,
  customize:{hair:0, skin:0}
};

const $ = id => document.getElementById(id);
const app=$('app'), character=$('character'), expression=$('expression');
const teacherOL=$('teacher-overlay'), friendOL=$('friend-overlay');
const dialogText=$('text'), speaker=$('speaker'), choicesEl=$('choices-area');
const gaugeFill=$('gauge-fill'), gaugeNum=$('gauge-num'), sceneTag=$('scene-tag');
const sceneBg=$('scene-bg'), endingCard=$('ending-card'), titleScreen=$('title-screen');
const soundToggle=$('sound-toggle'), comboDisplay=$('combo-display'), weatherEl=$('weather');

// ===== 사운드 =====
let audioCtx = null;
let soundEnabled = true;
let audioUnlocked = false;

function getAudio(){
  if(audioCtx) return audioCtx;
  try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  catch(e){ soundEnabled=false; return null; }
  return audioCtx;
}
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  try{
    const ctx = getAudio(); if(!ctx) return;
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    const buf = ctx.createBuffer(1,1,22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
  } catch(e){ soundEnabled=false; }
}
function beep(freq, dur, type, vol){
  if(!soundEnabled || !audioUnlocked) return;
  try{
    const ctx=getAudio(); if(!ctx) return;
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type=type||'sine'; osc.frequency.value=freq;
    gain.gain.setValueAtTime(vol||0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+dur);
  } catch(e){ soundEnabled=false; }
}
function melody(notes, type, vol){
  if(!soundEnabled || !audioUnlocked) return;
  try{
    const ctx=getAudio(); if(!ctx) return;
    let t=ctx.currentTime;
    notes.forEach(n=>{
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type=type||'square'; osc.frequency.value=n[0];
      gain.gain.setValueAtTime(vol||0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t+n[1]);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t); osc.stop(t+n[1]);
      t += n[1]*0.92;
    });
  } catch(e){ soundEnabled=false; }
}
const sfx = {
  click:   ()=>beep(700, 0.04, 'sine', 0.07),
  good:    ()=>melody([[523,0.08],[659,0.08],[784,0.14]], 'square', 0.09),
  bad:     ()=>melody([[400,0.08],[300,0.14]], 'sawtooth', 0.13),
  teacher: ()=>melody([[180,0.08],[150,0.14],[100,0.22]], 'sawtooth', 0.16),
  kakao:   ()=>melody([[1047,0.05],[1319,0.07]], 'sine', 0.09),
  combo:   ()=>melody([[523,0.05],[659,0.05],[784,0.05],[1047,0.1]], 'square', 0.11),
  endingS: ()=>melody([[523,0.12],[659,0.12],[784,0.12],[1047,0.25],[784,0.12],[1047,0.35]], 'square', 0.12),
  endingA: ()=>melody([[523,0.12],[659,0.12],[784,0.2]], 'square', 0.11),
  endingF: ()=>melody([[440,0.18],[392,0.18],[349,0.35]], 'sawtooth', 0.13),
  count:   ()=>beep(880, 0.04, 'sine', 0.06),
  start:   ()=>melody([[392,0.08],[523,0.08],[659,0.12],[784,0.18]], 'square', 0.12),
  rustle:  ()=>beep(150, 0.08, 'sawtooth', 0.04),
  step:    ()=>beep(180, 0.05, 'sine', 0.05)
};

soundToggle.onclick = ()=>{
  soundEnabled = !soundEnabled;
  soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
  if(soundEnabled){ getAudio(); sfx.click(); }
};

// ===== 데이터 =====
const tops = {

  friend:  {name:'친구 옷',   emoji:'🤝'}
};
const bottoms = {
  uniform: {name:'교복 바지', emoji:'👖'},
  living:  {name:'생활복',   emoji:'🩳'},

const FRIENDS = [
  {emoji:'🧑‍🦱', name:'곱슬머리'},
  {emoji:'🧑‍🦰', name:'빨강머리'},
  {emoji:'👦',    name:'단발머리'},
  {emoji:'🧑',    name:'짝꿍'},
  {emoji:'👨',    name:'뒷자리'},
  {emoji:'🧑‍🎤', name:'반장'}

const WEATHERS = [
  {emoji:'☀️', name:'sunny',  text:'오늘은 불볕더위.\n땀 줄줄 흘리는 날.'},
  {emoji:'🌧️', name:'rainy',  text:'비 오는 날.\n끈적끈적해서 더 짜증.'},
  {emoji:'⛅',   name:'cloudy', text:'흐려서 그나마 시원함.'},
  {emoji:'🌬️', name:'windy',  text:'바람 부는 날씨.\n근데 그래도 더움.'}
];

const HAIR_COLORS = ['#2a1a12','#5a3a20','#d4a04a','#ff6b9d','#7a3a90'];
const HAIR_NAMES  = ['검정','갈색','금발','핑크','보라'];
const SKIN_COLORS = ['#fdd9b8','#f5c298','#d4a98a','#a87a5a'];
const SKIN_NAMES  = ['기본','소맥','구리','진한'];

function applyCustomize(){
  const hair = HAIR_COLORS[state.customize.hair];
  const skin = SKIN_COLORS[state.customize.skin];
  document.querySelectorAll('#character [data-orig-fill="#2a1a12"]').forEach(el=>el.setAttribute('fill', hair));
  document.querySelectorAll('#character [data-orig-fill="#fdd9b8"]').forEach(el=>el.setAttribute('fill', skin));
}
function captureOriginalFills(){
  document.querySelectorAll('#character [fill]').forEach(el=>{
    if(!el.dataset.origFill) el.dataset.origFill = el.getAttribute('fill');
  });
}

// ===== LocalStorage 도장 =====
const STORAGE_KEY = 'maseok_uniform_v1';
function getStorage(){ try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');}catch(e){return{};} }
function saveStorage(d){ try{localStorage.setItem(STORAGE_KEY, JSON.stringify(d));}catch(e){} }
function recordEnding(rank, score, maxCombo){
  const d = getStorage();
  d.endings = d.endings || {};
  d.endings[rank] = (d.endings[rank]||0) + 1;
  d.bestScore = Math.max(d.bestScore||0, score);
  d.bestCombo = Math.max(d.bestCombo||0, maxCombo);
  d.totalPlays = (d.totalPlays||0) + 1;
  saveStorage(d);
}

const ENDINGS = ['S','A','B','C','F'];
const ENDING_INFO = {
  S:{emoji:'🏆'}, A:{emoji:'🎖️'}, B:{emoji:'😅'}, C:{emoji:'😬'}, F:{emoji:'👀'}
};

function renderCollection(){
  const d = getStorage();
  const e = d.endings || {};
  const got = ENDINGS.filter(r=>e[r]).length;
  let html = '<div class="coll-title">🏅 도장 컬렉션 ('+got+'/5)</div><div class="coll-stamps">';
  ENDINGS.forEach(rank=>{
    const cnt = e[rank] || 0;
    const cls = cnt>0 ? 'collected' : 'empty';
    html += '<div class="stamp '+cls+'"><span class="stamp-emoji">'+(cnt>0?ENDING_INFO[rank].emoji:'❓')+'</span><span class="stamp-rank">'+rank+'</span>';
    if(cnt>0) html += '<span class="stamp-count">'+cnt+'</span>';
    html += '</div>';
  });
  html += '</div>';
  if(d.bestScore!==undefined){
    html += '<div class="best-score">최고 점수 '+d.bestScore+'점 · 최대 '+(d.bestCombo||0)+' 콤보 · '+(d.totalPlays||0)+'회 플레이</div>';
  }
  $('collection').innerHTML = html;
}

function renderCustomize(){
  let html = '<div class="cust-row"><span class="cust-label">머리</span><div class="cust-options">';
  HAIR_COLORS.forEach((c,i)=>{
    html += '<div class="cust-opt'+(i===state.customize.hair?' active':'')+'" data-type="hair" data-idx="'+i+'" style="background:'+c+'" title="'+HAIR_NAMES[i]+'"></div>';
  });
  html += '</div></div><div class="cust-row"><span class="cust-label">피부</span><div class="cust-options">';
  SKIN_COLORS.forEach((c,i)=>{
    html += '<div class="cust-opt'+(i===state.customize.skin?' active':'')+'" data-type="skin" data-idx="'+i+'" style="background:'+c+'" title="'+SKIN_NAMES[i]+'"></div>';
  });
  html += '</div></div>';
  $('customize').innerHTML = html;
  $('customize').querySelectorAll('.cust-opt').forEach(el=>{
    el.onclick = ()=>{
      const type = el.dataset.type, idx = parseInt(el.dataset.idx);
      state.customize[type] = idx;
      sfx.click();
      applyCustomize();
      renderCustomize();
    };
  });
}

// ===== 헬퍼 =====
function setBg(name){ app.className=''; if(name) app.classList.add('scene-'+name); }
function setExpression(e){ expression.textContent = e||''; }
function setTeacher(show){
  teacherOL.classList.toggle('show', !!show);
  if(show){ shake(); sfx.teacher(); }
}
function setFriend(show, emoji){
  friendOL.classList.toggle('show', !!show);
  if(show){
    friendOL.textContent = emoji || (state.friend ? state.friend.emoji : '🧑');
    sfx.kakao();
  }
}
function setOutfit(top, bottom){
  if(top){ state.outfit.top = top; character.dataset.top = top; }
  if(bottom){ state.outfit.bottom = bottom; character.dataset.bottom = bottom; }
  sfx.rustle();
}
function setJacketOpen(open){ character.dataset.jacketOpen = open?'true':'false'; }
function setGauge(delta, reason){
  state.gauge = Math.max(0, Math.min(100, state.gauge + delta));
  gaugeFill.style.width = state.gauge + '%';
  gaugeNum.textContent = state.gauge;
  gaugeFill.classList.toggle('low', state.gauge<60 && state.gauge>=30);
  gaugeFill.classList.toggle('danger', state.gauge<30);
  if(delta<0 && reason) state.violations.push({reason, delta});
}
function setSpeaker(name){ speaker.textContent = name||'나'; }

let typingTimer = null;
function setText(t){
  clearTimeout(typingTimer);
  dialogText.textContent = '';
  dialogText.classList.remove('done');
  let i = 0;
  function type(){
    if(i < t.length){
      dialogText.textContent += t[i++];
      if(i % 2 === 0 && t[i-1] !== ' ' && t[i-1] !== '\n') sfx.step();
      typingTimer = setTimeout(type, 22);
    } else {
      dialogText.classList.add('done');
    }
  }
  type();
}
function setSceneTag(t){ sceneTag.textContent = t; }
function setSceneBgEmoji(e){ sceneBg.textContent = e||''; }
function clearChoices(){ choicesEl.innerHTML=''; }

function shake(){
  app.classList.add('shake');
  setTimeout(()=>app.classList.remove('shake'), 460);
}
function flashScreen(){
  const el = document.createElement('div');
  el.className = 'flash-overlay';
  document.querySelector('#main').appendChild(el);
  setTimeout(()=>el.remove(), 320);
}
function showCombo(n){
  const el = document.createElement('div');
  el.className = 'combo-popup';
  el.textContent = n + ' 콤보! +5';
  el.style.left = '50%';
  el.style.transform = 'translateX(-50%)';
  document.querySelector('#main').appendChild(el);
  setTimeout(()=>el.remove(), 1200);
  sfx.combo();
  setGauge(+5);
  comboDisplay.textContent = '🔥 ' + n + ' COMBO';
  comboDisplay.classList.add('show');
}
function recordChoice(correct){
  if(correct){
    state.combo++;
    if(state.combo > state.maxCombo) state.maxCombo = state.combo;
    if(state.combo >= 3) showCombo(state.combo);
  } else {
    state.combo = 0;
    comboDisplay.classList.remove('show');
  }
}

function addChoice(label, emoji, onClick, cls){
  const btn = document.createElement('button');
  btn.className = 'choice-btn' + (cls?' '+cls:'');
  btn.innerHTML = '<span class="choice-emoji">'+emoji+'</span><span>'+label+'</span>';
  btn.onclick = ()=>{
    btn.disabled = true;
    sfx.click();
    if(cls==='good') sfx.good();
    if(cls==='bad'){ sfx.bad(); flashScreen(); }
    onClick();
  };
  choicesEl.appendChild(btn);
}

function gotoScene(name){
  state.scene = name;
  (scenes[name]||scenes.opening)();
}

// ===== 씬 =====
const scenes = {};

scenes.opening = function(){
  if(!state.weather)   state.weather   = WEATHERS[Math.floor(Math.random()*WEATHERS.length)];
  if(!state.dayOfWeek) state.dayOfWeek = DAYS[Math.floor(Math.random()*DAYS.length)];
  if(!state.friend)    state.friend    = FRIENDS[Math.floor(Math.random()*FRIENDS.length)];

  weatherEl.textContent = state.weather.emoji;
  if(state.weather.name==='rainy') setBg('rainy'); else setBg('night');
  $('day-info').textContent = '📅 마석고 2학년 · '+state.dayOfWeek+'요일';

  setSceneTag('아침 7:30');
  setSceneBgEmoji('🌅');
  setSpeaker('나');
  setExpression('😪');
  setOutfit('uniform','uniform');
  setTeacher(false);
  setFriend(false);
  setJacketOpen(true);

  let dayText = '';
  if(state.dayOfWeek==='월') dayText = '월요일이다…\n또 일주일 시작.\n';
  else if(state.dayOfWeek==='금') dayText = '금요일!\n오늘만 버티면 주말이다.\n';
  else if(state.dayOfWeek==='수') dayText = '수요일.\n주중 한복판이다.\n';

  setText('알람 소리…\n\n'+dayText+state.weather.text+'\n\n오늘은 또 뭐 입고 가지?');
  clearChoices();
  addChoice('옷장 열기 👀', '🚪', ()=>gotoScene('wardrobe'));
};

scenes.wardrobe = function(){
  if(state.weather && state.weather.name==='rainy') setBg('rainy'); else setBg('night');
  setSceneTag('옷장 앞');
  setSceneBgEmoji('🚪');
  setSpeaker('나');
  setExpression('🤔');
  setText('자… 오늘 뭐 입지?\n(상의 / 하의 골라봐)');
  clearChoices();

  let selTop=null, selBottom=null;
  const wrapper = document.createElement('div');
  wrapper.innerHTML = '<div class="wardrobe-section"><div class="wardrobe-label">👕 상의</div><div class="wardrobe-grid" id="wg-top"></div></div><div class="wardrobe-section"><div class="wardrobe-label">👖 하의</div><div class="wardrobe-grid" id="wg-bot"></div></div><button id="wardrobe-confirm" disabled>옷 두 개 다 골라줘</button>';
  choicesEl.appendChild(wrapper);

  const wgTop=$('wg-top'), wgBot=$('wg-bot'), confirmBtn=$('wardrobe-confirm');
  Object.entries(tops).forEach(([k,v])=>{
    const it = document.createElement('div');
    it.className = 'cloth-item';
    it.innerHTML = '<span class="cloth-emoji">'+v.emoji+'</span><span>'+v.name+'</span>';
    it.onclick = ()=>{
      sfx.click();
      wgTop.querySelectorAll('.cloth-item').forEach(el=>el.classList.remove('selected'));
      it.classList.add('selected');
      selTop = k;
      character.dataset.top = k;
      sfx.rustle();
      if(selTop && selBottom){ confirmBtn.disabled=false; confirmBtn.textContent='이 옷으로 등교! ▶'; }
    };
    wgTop.appendChild(it);
  });
  Object.entries(bottoms).forEach(([k,v])=>{
    const it = document.createElement('div');
    it.className = 'cloth-item';
    it.innerHTML = '<span class="cloth-emoji">'+v.emoji+'</span><span>'+v.name+'</span>';
    it.onclick = ()=>{
      sfx.click();
      wgBot.querySelectorAll('.cloth-item').forEach(el=>el.classList.remove('selected'));
      it.classList.add('selected');
      selBottom = k;
      character.dataset.bottom = k;
      sfx.rustle();
      if(selTop && selBottom){ confirmBtn.disabled=false; confirmBtn.textContent='이 옷으로 등교! ▶'; }
    };
    wgBot.appendChild(it);
  });
  confirmBtn.onclick = ()=>{
    sfx.click();
    setOutfit(selTop, selBottom);
    judgeWardrobe();
  };
};

scenes.ending_calc = function(){
  let rank, rankEmoji, title, comment, cardClass;
  const g = state.gauge;
  if(g>=90){
    rank='S'; rankEmoji='🏆';
    title='마석고 모범생 인증';
    comment='완벽한 교복 등굣길!\n선생님이 너 자랑스러워하셔.\n친구들도 이렇게 좀 살자 ✨';
    cardClass='s-rank';
    sfx.endingS();
  } else if(g>=70){
    rank='A'; rankEmoji='🎖️';
    title='단정도 우수';
    comment='거의 완벽!\n작은 실수 한두 개 빼면\n진짜 잘 입고 다닌다.';
    cardClass='good';
    sfx.endingA();
  } else if(g>=50){
    rank='B'; rankEmoji='😅';
    title='한 번 더 도전!';
    comment='음… 살짝 아쉽다.\n변명 좀 줄이고\n다시 한번 가자!';
    cardClass='normal';
    sfx.endingA();
  } else if(g>=30){
    rank='C'; rankEmoji='😬';
    title='학생부 단골 후보';
    comment='이대로 가면\n학생부에 자주 불려다닐듯…\n다시 도전해봐.';
    cardClass='normal';
    sfx.endingF();
  } else {
    rank='F'; rankEmoji='👀';
    title='선생님이 보고 계셔';
    comment='솔직히 이건 좀…\n다시 한 번 처음부터.\n넌 할 수 있다.';
    cardClass='bad';
    sfx.endingF();
  }

  recordEnding(rank, g, state.maxCombo);

  $('rank-badge').textContent = rankEmoji;
  $('rank-text').textContent = rank + ' 등급';
  $('score-num').textContent = g;
  $('ending-title').textContent = title;
  $('ending-comment').textContent = comment;
  $('combo-info').textContent = state.maxCombo>=3 ? ('🔥 최대 ' + state.maxCombo + ' 콤보 달성!') : '';
  $('combo-info').style.display = state.maxCombo>=3 ? 'block' : 'none';

  const vList = $('violations-list');
  if(state.violations.length===0){
    vList.innerHTML = '<div class="v-title">🎉 완벽 클리어!</div><div class="perfect">한 번도 안 걸렸다!</div>';
  } else {
    let html = '<div class="v-title">오늘의 위반 항목</div><ul>';
    state.violations.forEach(v=>{ html += '<li>'+v.reason+' ('+v.delta+')</li>'; });
    html += '</ul>';
    vList.innerHTML = html;
  }

  endingCard.className = '';
  endingCard.classList.add(cardClass, 'show');
};

function resetState(){
  state.gauge = 100;
  state.combo = 0;
  state.maxCombo = 0;
  state.outfit = {top:null, bottom:null};
  state.violations = [];
  state.weather = null;
  state.dayOfWeek = null;
  state.friend = null;
  gaugeFill.style.width = '100%';
  gaugeNum.textContent = '100';
  gaugeFill.classList.remove('low','danger');
  comboDisplay.classList.remove('show');
  endingCard.classList.remove('show');
}

function startGame(){
  unlockAudio();
  try{ sfx.start(); }catch(e){}
  titleScreen.classList.add('hide');
  resetState();
  setTimeout(function(){
    try{ gotoScene('opening'); }
    catch(err){ showDebug('opening 에러: ' + (err && err.message)); }
  }, 200);
}

$('start-btn').addEventListener('click', function(e){
  if(e && e.preventDefault) e.preventDefault();
  startGame();
});

$('replay-btn').addEventListener('click', function(e){
  if(e && e.preventDefault) e.preventDefault();
  unlockAudio();
  try{ sfx.click(); }catch(_){}
  endingCard.classList.remove('show');
  resetState();
  setTimeout(function(){
    try{ gotoScene('opening'); }catch(err){ showDebug(err && err.message); }
  }, 100);
});

$('title-btn').addEventListener('click', function(e){
  if(e && e.preventDefault) e.preventDefault();
  unlockAudio();
  try{ sfx.click(); }catch(_){}
  resetState();
  endingCard.classList.remove('show');
  titleScreen.classList.remove('hide');
  renderCollection();
  renderCustomize();
});

// 모바일 디버그 — 에러 발생 시 화면 상단에 빨간 띠로 표시
function showDebug(msg){
  try{
    const div = document.createElement('div');
    div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#d32f2f;color:#fff;padding:6px 8px;z-index:9999;font-size:10px;font-family:monospace;line-height:1.3;word-break:break-all;text-align:left';
    div.textContent = '⚠️ ' + msg;
    document.body.appendChild(div);
    setTimeout(function(){ try{ div.remove(); }catch(e){} }, 12000);
  }catch(e){}
}
window.addEventListener('error', function(ev){
  showDebug((ev.message || 'unknown') + ' [L' + (ev.lineno || '?') + ']');
});

// 초기화
try{ captureOriginalFills(); }catch(e){ showDebug('init1: ' + e.message); }
try{ applyCustomize(); }catch(e){ showDebug('init2: ' + e.message); }
try{ renderCollection(); }catch(e){ showDebug('init3: ' + e.message); }
try{ renderCustomize(); }catch(e){ showDebug('init4: ' + e.message); }
</script>
</body>
</html>
